<head>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--ink:#3b2f2f;--paper:#fffdf7;--cream:#fff8ec}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#2b2320;font-family:"Pretendard","Malgun Gothic",sans-serif;color:var(--ink);touch-action:none}

  .jua{font-family:"Jua",sans-serif;font-weight:400}.pen{font-family:"Nanum Pen Script",cursive}
  .ii{display:inline-flex;align-items:center;justify-content:center;flex:none}.ii svg{display:block}
  /* top */
  #top{position:absolute;left:12px;right:var(--navr,12px);top:12px;display:flex;align-items:center;gap:8px}
  /* 화면 틀 여백이 있을 때(토스 등): 남는 띠를 검은색 대신 게임 바탕색으로 */
  html.framed,html.framed body{background:#f6f0e6}
  /* 오른쪽 위에 토스 버튼이 있을 때: 첫 줄이 좁아지므로 커피 충전 시간 글자를 숨기고 줄바꿈을 막는다 */
  html.navpill .ltop #lCoffeeT,html.navpill .ltop .plus{display:none}html.navpill .ltop .chip{white-space:nowrap;min-width:0}html.navpill .ltop{gap:5px}
  .chip{background:var(--paper);border:2px solid var(--ink);border-radius:10px;box-shadow:0 2px 0 var(--ink);height:34px;display:flex;align-items:center;justify-content:center;font-family:Jua;font-size:15px;padding:0 10px}

  .sheet{position:relative;width:100%;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:40px 18px 18px;display:flex;flex-direction:column;gap:10px}

  .h1{font-size:30px;text-align:center}.h2{font-size:22px;text-align:center;margin-top:-6px}.sub{text-align:center;font-size:22px;margin-top:-6px}
  .lbl{font-size:13px;font-weight:800}.center{text-align:center}
  .deck{display:flex;gap:5px;justify-content:space-between}.tile{position:relative;width:38px;height:44px;border:2px solid var(--ink);border-radius:8px;background:var(--cream);overflow:hidden;display:flex;justify-content:center;padding-top:1px}.tile .bar{position:absolute;left:0;right:0;bottom:0;height:6px;border-top:1.5px solid var(--ink)}
  .recipes{display:grid;grid-template-columns:1fr 1fr;gap:6px}.rcp{display:flex;align-items:center;gap:3px;border:2px solid var(--ink);border-radius:9px;padding:4px 6px;background:#fff;font-weight:800;font-size:12.5px;cursor:pointer}.rcp.sel{background:#fff6b8;box-shadow:0 0 0 3px #ffc93c}

  .rn{font-size:21px}.good,.bad{font-size:13px;font-weight:800;margin-top:4px;display:flex;gap:5px;align-items:flex-start}.good{color:#2e7d43}.bad{color:#c43c3c}

  .maps{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.mapc{border:2px solid var(--ink);border-radius:9px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px 5px;cursor:pointer;font-size:10px;font-weight:800;text-align:center}.mapc b{font-family:Jua;font-weight:400;font-size:12px;color:#fff;border:1.5px solid var(--ink);border-radius:5px;padding:0 4px;white-space:nowrap}.mapc i{font-style:normal;color:#e8a100;font-size:9px;letter-spacing:-1px}.mapc.sel{background:#fff6b8;box-shadow:0 0 0 3px #ffc93c}
  #chalk{cursor:pointer}
  #r3{gap:6px!important}.dev .t{font-size:12px!important}
  .chipr{font-family:Jua;font-size:15px;border:2px solid var(--ink);border-radius:9px;background:#fff1b8;padding:6px 10px;box-shadow:0 2px 0 var(--ink)}

  /* ---------- 로비 ---------- */

  #modal{z-index:20}#toast{z-index:30}

  .card{background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink)}

  .mappath{position:absolute;left:0;top:72px}

  .sstars{position:absolute;display:flex}
  .lpanel{position:absolute;left:14px;right:14px;bottom:8px}
  .stagecard{padding:10px 12px}
  .bossline{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
  .infoline{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:12px;font-weight:800;flex-wrap:wrap}
  .todaychip{margin-left:auto;display:flex;align-items:center;gap:2px;border:2px solid var(--ink);border-radius:8px;padding:1px 6px 1px 3px;background:#fff6b8;cursor:pointer}.todaychip small{font-size:10px;opacity:.6;margin-left:2px}

    if (!ctx || ctx.state !== 'running') return;
    const fast = bgmMode === 'run', spb = fast ? 60 / 108 / 2 : 60 / 84 / 2;   // 8분음표 길이
    while (nextT < ctx.currentTime + 0.35) {
      const bar = Math.floor(step / 8) % 4, s = step % 8, ch = CH[bar];
      if (s === 0 || s === 4) tone(ch[0] / 2, spb * 3.5, { type: 'triangle', vol: 0.09, at: nextT, bgm: true, lp: 600 });
      const m = MEL[(step % 16)]; if (m >= 0 && (fast || s % 2 === 0)) { const f = m < 3 ? ch[m] * 2 : ch[m - 3] * 4; tone(f, spb * 0.9, { type: 'sine', vol: 0.045, at: nextT, bgm: true }); }
      if (fast && s % 2 === 1) noise(0.04, { ft: 'highpass', f: 7000, vol: 0.018, at: nextT, bgm: true });
      nextT += spb; step++;
    }
  }
  function startBgmIfNeeded() {
    if (!bgmMode || !cfg.bgm || !ctx || ctx.state !== 'running') return;
    if (!bgmTimer) { nextT = ctx.currentTime + 0.1; bgmTimer = setInterval(sched, 100); }
  }
  function setBgm(mode) {
    if (mode === bgmMode) return; bgmMode = mode; step = 0;
    if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
    if (mode) startBgmIfNeeded();
  }

  /* ---------- 게임 상태 변화 감지 ---------- */
  let seen = new WeakSet(), prev = null, prevG = null;
  function tick(G) {
    if (!G) { prevG = null; return; }
    if (G !== prevG) { prevG = G; prev = { cleaned: G.stats.cleaned, summons: G.stats.summons, hearts: G.hearts, combos: { ...G.stats.combos } }; seen = new WeakSet(); for (const f of G.fx) seen.add(f); return; }
    if (G.stats.summons > prev.summons) play('summon', 60);
    if (G.stats.cleaned > prev.cleaned) play('clean', 70);
    if (G.hearts < prev.hearts) play('leak', 150);
    for (const k in G.stats.combos) if ((G.stats.combos[k] || 0) > (prev.combos[k] || 0)) play(k, 140);
    for (const f of G.fx) if (!seen.has(f)) { seen.add(f); if (f.type === 'pop' && f.merge) play('merge', 60); }   // 그릇마다 뜨는 +반짝 글자는 닦기 소리로 충분
    prev.cleaned = G.stats.cleaned; prev.summons = G.stats.summons; prev.hearts = G.hearts; prev.combos = { ...G.stats.combos };
  }
  function events(list) {
    for (const e of list) {
      if (e.type === 'recipe') play('recipe');
      else if (e.type === 'bossWarn') play('boss');
      else if (e.type === 'waveStart') play('waveStart');
      else if (e.type === 'waveEnd') play('waveEnd');
      else if (e.type === 'end') play(e.win ? 'win' : 'lose');
      else if (e.type === 'chooseRule' || e.type === 'branch' || e.type === 'comboFirst') play('chime', 200);
      else if (e.type === 'forbidden') play('buzz');
    }
  }
  // 버튼 누를 때 가벼운 소리 (캔버스는 제외)
  addEventListener('pointerdown', (e) => { if (e.target.closest && e.target.closest('.btn,.chip,.ltab,.sideb,.sdot,.peek,.sarrow,.card[data-act],.rule,.br')) play('click', 40); }, true);

  SD.sound = {
    play, tick, events, setBgm, played, get state() { return ctx ? ctx.state : 'none'; }, get bgmMode() { return bgmMode; }, get bgmRunning() { return !!bgmTimer; },
    get sfx() { return cfg.sfx; }, get bgm() { return cfg.bgm; },
    setSfx(on) { cfg.sfx = !!on; save(); ensure(); if (sfxBus) sfxBus.gain.value = on ? 0.9 : 0; },
    setBgmOn(on) { cfg.bgm = !!on; save(); ensure(); if (bgmBus) bgmBus.gain.value = on ? 0.55 : 0; if (on) startBgmIfNeeded(); else if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; } },
    suspend() { if (ctx) ctx.suspend(); }, resume() { if (ctx && !document.hidden) ctx.resume(); }
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>document.getElementById('icTap').innerHTML=SD_ART.device('pipe',34);document.getElementById('icPlug').innerHTML=SD_ART.device('drainplug',34);</script>
<script>
/* 싱크대를 부탁해 - 화면(DOM) · 입력 · 루프 */
(function (g) {
  const SD = g.SD;
  const D = SD.DATA, A = g.SD_ART;
  const INK = '#3b2f2f';
  const $ = (s) => document.querySelector(s);
  const ROLE = { aoe: '범위', single: '단일', support: '지원', slow: '둔화' };
  const STN = { acid: '산성', alk: '알칼리', foam: '거품', soak: '불림', hard: '굳힘' };
  const store = {
    get(k, d) { try { const v = localStorage.getItem((window.SD_STORE_PREFIX || '') + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem((window.SD_STORE_PREFIX || '') + k, JSON.stringify(v)); } catch (e) { } }
  };

  let G = null, speed = store.get('sd.speed', 1), paused = false, modalOpen = false, runMode = null;   // runMode: null(스테이지) | 'endless' | 'daily'
  const codex = store.get('sd.codex.v1', { recipes: {}, combos: {}, safety: {} });
  const ui = { sel: null, drag: null, hover: null, dragTargets: null };
  const cv = $('#cv'), ctx = cv.getContext('2d');
  const stage = $('#stage');
  let scale = 1, seenTypes = new Set();

  const ingName = (k) => A.ING[k] ? A.ING[k].name : (D.RECIPES[k] ? D.RECIPES[k].name : k);
  const dishName = (k) => (A.DISH[k] || A.BOSS[k] || {}).name || k;
  const ingImg = (k, s) => `<span class="ii" style="width:${s}px;height:${s}px">${A.ing(k, s)}</span>`;
  const coin = (s = 16) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}"><circle cx="12" cy="12" r="10" fill="#ffc93c" stroke="${INK}" stroke-width="2.2"/><path d="M12 6l1.6 4.4L18 12l-4.4 1.6L12 18l-1.6-4.4L6 12l4.4-1.6z" fill="#fff" stroke="${INK}" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
  const traitsOf = (type) => { const ds = D.DISHES[type]; return Object.keys(D.TRAIT_TEXT).filter(k => ds[k]).map(k => D.TRAIT_TEXT[k]); };

  /* ---------- layout ---------- */
  // 화면 틀 여백: 토스 게임 웹뷰는 전체 화면이라 상태바 · 홈 바 영역과 오른쪽 위 토스 버튼(더보기 · 닫기)을 피해야 한다 (검수 반려 사유)
  // 값은 window.SD_INSETS = { top, bottom, nav, ios } (토스 빌드가 SafeAreaInsets로 넣음) 또는 주소의 ?ti=&bi=&nav=1&ios=1 (미리보기용). 없으면 예전 그대로
  // 토스 버튼 위치는 문서 값(오른쪽 10, 위 +5 iOS / +10 안드로이드), 크기는 문서에 없어 어림값이다. 기기에서 확인 필요
  const NAV = { w: 96, h: 40, right: 10, gap: 6 };
  function insets() {
    const q = new URLSearchParams(location.search), I = window.SD_INSETS || {}, n = (v) => Math.max(0, +v || 0);
    return { top: n(I.top != null ? I.top : q.get('ti')), bottom: n(I.bottom != null ? I.bottom : q.get('bi')), nav: I.nav != null ? !!I.nav : q.get('nav') === '1', ios: I.ios != null ? !!I.ios : q.get('ios') === '1' };
  }
  function fit() {
    const W = window.innerWidth, H = window.innerHeight, I = insets();
    let top = I.top; const availH = () => H - top - I.bottom;
    scale = Math.min(W / 390, availH() / 844);
    if (I.nav) {
      // 둘째 줄(로비 아이콘 줄 · 칠판, 설계 높이 55부터)이 토스 버튼 아래에 오도록, 모자라면 화면을 그만큼 더 내린다
      const need = (I.ios ? 5 : 10) + NAV.h + 4 - 55 * scale;
      if (need > 0) { top += need; scale = Math.min(W / 390, availH() / 844); }
    }
    const sx = (W - 390 * scale) / 2, sy = top + (availH() - 844 * scale) / 2;
    stage.style.transform = `translate(${sx}px, ${sy}px) scale(${scale})`;
    // 첫 줄 오른쪽은 토스 버튼 자리만큼 비운다 (설계 좌표, 원래 오른쪽 여백 12 포함)
    stage.style.setProperty('--navr', (I.nav ? Math.max(12, Math.ceil((NAV.right + NAV.w + NAV.gap - sx) / scale)) : 12) + 'px');
    document.documentElement.classList.toggle('framed', I.top > 0 || I.bottom > 0 || I.nav);
    document.documentElement.classList.toggle('navpill', I.nav);
    const k = scale * (window.devicePixelRatio || 1);
    cv.width = Math.round(390 * k); cv.height = Math.round(844 * k);
    ctx.setTransform(k, 0, 0, k, 0, 0);
  }
  window.addEventListener('resize', fit);

  /* ---------- HUD ---------- */
  function hud() {
    if (!G) return;
    $('#wave').innerHTML = `W<b>${Math.max(1, G.wave)}</b><i>/${G.endless ? '∞' : G.waves}</i>`;
    const seg = Math.ceil(G.hearts / 2);
    $('#hearts').innerHTML = Array.from({ length: 10 }, (_, i) => `<span class="${i < seg ? 'on' : ''}"></span>`).join('');
    $('#speed').textContent = 'x' + speed;
    $('#speed').classList.toggle('hot', speed > 1);
    // chalkboard
    let line1 = runMode ? `${runMode === 'daily' ? '오늘의 도전' : '무한 영업'} · ${G.map.name}` : `${G.map.name} ${G.stage}스테이지`, line2 = '';
    if (G.map.situations) { const S = D.SITUATIONS; line1 = G.sit ? `지금 ${S[G.sit].name}${G.sitNext ? ' → 다음 ' + S[G.sitNext].name : ''}` : `다음 ${S[G.sitNext].name}`; }
    if (ui.sel != null && G.cells[ui.sel] && G.cells[ui.sel].unit) {
      const u = G.cells[ui.sel].unit, sp = u.recipe ? D.RECIPES[u.recipe] : D.ING[u.key], br = G.branchOf(u);
      line1 = (u.recipe ? '살림 비법' : A.FAMILY[A.ING[u.key].family].name) + ' · ' + ROLE[sp.role] + (br.name ? ' · ' + br.name : '');
      const sts = (sp.sts || (sp.st ? [sp.st] : [])).map(s => STN[s]).join('+');
      line2 = `${ingName(u.key)} ★${u.star} · 위력 ${G.powerOf(ui.sel)}`;
    } else if (G.phase === 'ready') { line2 = '재료를 놓고 시작!'; }
    else if (G.phase === 'break') { line2 = `다음 W${G.wave + 1} · ${Math.ceil(G.breakT)}초`; }
    else if (G.phase === 'wave') { const spec = D.waveSpec(G.wave, G.map, G.stage, G.endless, G.waves); line2 = spec.boss ? spec.bossLabel + '!' : `남은 그릇 ${G.spawn.list.length + G.dishes.length}`; }
    else if (G.phase === 'end') line2 = '영업 끝';
    $('#chalk').innerHTML = `<div class="pen">${line1}</div><div class="jua"${line2.length > 12 ? ' style="font-size:13px"' : ''}>${line2}</div>`;
    const rs = Object.keys(G.rules);
    $('#receipt').innerHTML = (G.guests && G.guests.length ? `<div class="rl gl">${G.guests.map(g => `<span class="tago">${D.GUESTS[g.id].name}</span>`).join('')}</div>` : '') + `<div class="rt"><span class="tagr">주방 규칙</span></div>` + (rs.length > 1 ? `<div class="rl">${D.RULES[rs[rs.length - 1]].name} 외 ${rs.length - 1}개</div>` : rs.length ? `<div class="rl">${D.RULES[rs[0]].name}</div>` : `<div class="rl dim">${D.RULE_WAVES[0]}웨이브 뒤에 골라요</div>`);
    const syn = G.synergy(); const need = { acid: [2, 3], alk: [2, 3], soap: [2, 3], water: [2, 3], scrub: [2, 4] };
    $('#syn').innerHTML = ['acid', 'alk', 'scrub', 'water', 'soap'].map(f => { const n = syn[f], on = n >= need[f][0]; return `<div class="tok ${on ? 'on' : ''}" style="${on ? `background:${A.FAMILY[f].color}` : ''}">${A.FAMILY[f].name}<i>${n}/${n >= need[f][0] ? need[f][1] : need[f][0]}</i></div>`; }).join('');
    const R = D.PAIRS[G.recipeToday], known = !!(codex.recipes[R.A] || codex.recipes[R.B]);
    $('#today').innerHTML = `<span class="tagr">오늘의 레시피</span>${ingImg(R.a, 22)}${known ? ingImg(R.b, 22) : '<b class="q">?</b>'}<span class="jua">확률 x2</span>`;
    $('#shine').innerHTML = coin(20) + G.shine;
    const cost = G.summonCost();
    $('#bSummon').classList.toggle('dis', G.shine < cost || !G.emptyCells().length);
    $('#bSummon .cost').innerHTML = G.freeSummons > 0 ? `공짜 ${G.freeSummons}` : coin(12) + cost;
    $('#next').innerHTML = G.queue.map(k => `<span class="mini">${ingImg(k, 20)}</span>`).join('');
    const lc = G.lvCost(), odds = D.SUMMON_ODDS[G.summonLv];
    $('#bLv b').textContent = '소환 Lv' + G.summonLv;
    $('#bLv small').innerHTML = lc == null ? '최대' : `${coin(11)}${lc} · 2성 ${Math.round(odds[1] * 100)}%`;
    $('#bLv').classList.toggle('dis', lc == null || G.shine < lc);
    const mp = G.mergePairs();
    $('#bMerge .badge').textContent = mp; $('#bMerge .badge').style.display = mp ? 'flex' : 'none';
    $('#bMerge').classList.toggle('dis', !mp);
    const selU = ui.sel != null && G.cells[ui.sel] && G.cells[ui.sel].unit;
    // 고른 게 없고 조리대가 꽉 찼으면 1성을 한 번에 재활용
    const lowOk = !selU && G.canRecycleLow();
    $('#bRecycle small').innerHTML = selU ? `${coin(11)}+${G.refundOf(ui.sel)}` : lowOk ? `1성 모두 +${G.lowRefund()}` : '골라서 버리기';
    $('#bRecycle').classList.toggle('dis', !selU && !lowOk);
    const dv = G.devices;
    $('#dTap').style.display = dv.tap ? 'flex' : 'none';
    $('#dPlug').style.display = dv.plug ? 'flex' : 'none';
    $('#dWok').style.display = dv.wok ? 'flex' : 'none';
    if (dv.tap) { $('#dTap .cd').style.background = dv.tap.cd > 0 ? `conic-gradient(rgba(59,47,47,.55) 0 ${dv.tap.cd / D.TAP_CD * 100}%, transparent 0)` : 'none'; $('#dTap small').textContent = dv.tap.active > 0 ? `물줄기 ${Math.ceil(dv.tap.active)}초` : dv.tap.cd > 0 ? Math.ceil(dv.tap.cd) + '초 뒤' : '불리고 느리게'; }
    if (dv.plug) { $('#dPlug small').textContent = dv.plug.active > 0 ? `막는 중 ${Math.ceil(dv.plug.active)}초` : `멈추기 ${dv.plug.uses}회`; $('#dPlug').classList.toggle('dis', dv.plug.uses <= 0); }
    // 장치로 풀어야 하는 보스가 레일 위에 있으면 그 장치 버튼·구역을 깜빡인다
    const bossOn = G.phase === 'wave' && G.dishes.find(d => D.DISHES[d.type].boss);
    const needTap = !!(bossOn && D.DISHES[bossOn.type].tapMul && dv.tap && dv.tap.cd <= 0), needPlug = !!(bossOn && D.DISHES[bossOn.type].stopMul && dv.plug && dv.plug.uses > 0 && !(dv.plug.active > 0));
    $('#dTap').classList.toggle('pulse', needTap); $('#dPlug').classList.toggle('pulse', needPlug);
    ui.devHint = needTap ? 'tap' : needPlug ? 'plug' : ui.tutHint || null;
    if (dv.wok) { $('#dWok .cd').style.background = dv.wok.cd > 0 ? `conic-gradient(rgba(59,47,47,.55) 0 ${dv.wok.cd / D.WOK_CD * 100}%, transparent 0)` : 'none'; $('#dWok small').textContent = dv.wok.cd > 0 ? Math.ceil(dv.wok.cd) + '초' : '불쇼!'; }
    const wb = $('#bWave');
    if (G.phase === 'ready') { wb.style.display = 'flex'; wb.innerHTML = '설거지 시작!'; }
    else if (G.phase === 'break') { wb.style.display = 'flex'; wb.innerHTML = `바로 W${G.wave + 1}`; }
    else wb.style.display = 'none';
    // 처음 보는 특수 그릇 안내
    for (const d of G.dishes) if (!seenTypes.has(d.type)) { seenTypes.add(d.type); const t = traitsOf(d.type); if (t.length && !D.DISHES[d.type].boss) toast(`${dishName(d.type)}: ${t[0]}`); }
  }

  /* ---------- toasts / modals ---------- */
  let toastT = null;
  // 창이 떠 있으면 알림을 맨 위로 올려 창의 버튼을 가리지 않게 한다
  function toast(text, warn) { const t = $('#toast'); t.textContent = text; t.className = 'show' + (warn ? ' warn' : '') + (modalOpen ? ' hi' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }   // 위치(hi)는 남겨 둬야 사라지는 동안 가운데로 튀지 않는다
  const mq = [];
  function modal(html, onReady) { if (modalOpen) { mq.push([html, onReady]); return; } modalOpen = true; const m = $('#modal'); m.innerHTML = `<div class="sheet">${html}</div>`; m.classList.add('show'); const tt = $('#toast'); if (tt.classList.contains('show')) tt.classList.add('hi'); onReady && onReady(m); }
  function closeModal() { modalOpen = false; $('#modal').classList.remove('show'); $('#modal').innerHTML = ''; if (mq.length) { const [h, f] = mq.shift(); modal(h, f); } }
  const ribbon = (t, c = '#ff6b5b') => `<div class="ribbon" style="background:${c}">${t}</div>`;

const sndToggles = () => `<div class="tgls"><div class="tgl ${SD.sound && SD.sound.sfx ? 'on' : ''}" data-snd="sfx"><span>효과음</span><i></i></div><div class="tgl ${SD.sound && SD.sound.bgm ? 'on' : ''}" data-snd="bgm"><span>배경음</span><i></i></div></div>`;
  const bindSnd = (m) => m.querySelectorAll('[data-snd]').forEach(t => t.onclick = () => { const on = !t.classList.contains('on'); t.classList.toggle('on', on); if (t.dataset.snd === 'sfx') SD.sound.setSfx(on); else SD.sound.setBgmOn(on); });
  SD.sndToggles = sndToggles; SD.bindSnd = bindSnd;
  function startScreen() { SD.sound && SD.sound.setBgm('lobby'); mq.length = 0; modalOpen = false; branchOpen = false; $('#modal').classList.remove('show'); G = null; SD.lobby.show(); }
  function begin(r, mapId, stage) {
    SD.lobby.hide(); runMode = r.mode || null;
    SD.ads.prepare(['boost', 'double', 'revive']);
    // 첫 비법 안내: 기본 주방 3스테이지부터, 아직 비법을 하나도 못 만들었으면 3성 베이킹소다·식초를 선물로 놓아 준다
    const gift = !r.mode && mapId === 'basic' && stage >= 3 && !Object.keys(codex.recipes).length ? [{ key: 'soda', star: 3 }, { key: 'vinegar', star: 3 }] : null;
    newGame(mapId, r.today, { deck: r.deck, levels: r.levels, stage, guests: r.guests || [], tools: r.tools || [], endless: !!r.mode, seed: r.seed || undefined, gift });
    if (gift) toast('선물: 3성 베이킹소다와 식초! 격쳐 보세요');
    if (r.guests && r.guests.length) guestScreen(r.guests);
    boostScreen();
    return true;
  }
  function startRun(mapId, stage) {
    const r = SD.meta.startRun(mapId, stage);
    if (!r.ok) { toast(r.why); if (r.coffee) SD.lobby.show('shop'); return false; }
    return begin(r, mapId, stage);
  }
  // 무한 영업('endless', 음식점) · 오늘의 도전('daily')
  function startMode(mode, mapId, viaAd) {
    const r = SD.meta.startMode(mode, mapId, viaAd);
    if (!r.ok) { toast(r.why); if (r.coffee) SD.lobby.show('shop'); return false; }
    return begin(r, r.map, 5);
  }
  // 광고 보고 유리하게 시작 (하루 5번). 첫 판과 웹판에서는 묻지 않는다
  function boostScreen() {
    const M = SD.meta, left = M.adLeft('boost');
    if (!SD.ads || !SD.ads.available() || left <= 0 || !M.p.stats.plays) return;
    const adFree = M.p.adFree;
    modal(`${ribbon('영업 준비', '#4aa3ff')}<div class="pen sub">넉넉하게 시작해 볼까요?</div>
      <div class="guest"><span class="tag" style="background:#4aa3ff">준비</span><div><div class="jua gn">반짝 +40 · 소환 레벨 2</div><div class="gd">이번 판을 반짝 100과 소환 레벨 2로 시작해요</div></div></div>
      <div class="btn big go" id="bsAd">${adFree ? '바로 받기' : '광고 보고 받기'}</div>
      <div class="lbl center dim">오늘 ${left}번 남음</div>
      <div class="btn" id="bsNo">그냥 시작</div>`, (m) => {
      const go = m.querySelector('#bsAd');
      go.onclick = () => {
        if (go.classList.contains('dis')) return; go.classList.add('dis'); if (!adFree) go.textContent = '광고 보는 중…';

  function drainEvents() {

  /* ---------- input ---------- */
  function toLocal(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * 390, y: (e.clientY - r.top) / r.height * 844 }; }
  function cellAt(p) { if (!G) return null; const i = G.cells.findIndex(c => p.x >= c.x - 3 && p.x <= c.x + 59 && p.y >= c.y - 3 && p.y <= c.y + 59); return i < 0 ? null : i; }
  function overRecycle(e) { const el = document.elementFromPoint(e.clientX, e.clientY); return el && el.closest && el.closest('#bRecycle'); }
  cv.addEventListener('pointerdown', (e) => {
    if (!G || modalOpen) return;

      const a = G.cells[ui.drag.from].unit;
      ui.dragTargets = new Set(G.cells.map((c, j) => [c, j]).filter(([c, j]) => j !== ui.drag.from && c.unit && ((c.unit.key === a.key && c.unit.star === a.star && a.star < 4) || G.canHybrid(a, c.unit))).map(([c, j]) => j));
    }
    ui.hover = ui.drag.moved ? cellAt(p) : null;
    $('#bRecycle').classList.toggle('drop', ui.drag.moved && !!overRecycle(e));
  });
  cv.addEventListener('pointerup', (e) => {
    if (!G || modalOpen) { ui.drag = null; return; }
    const p = toLocal(e), i = cellAt(p);
    if (ui.drag && ui.drag.moved) {
      if (overRecycle(e)) { G.recycle(ui.drag.from); ui.sel = null; }
      else if (i != null) { const r = G.move(ui.drag.from, i); if (r === 'move' || r === 'merge' || r === 'recipe') ui.sel = i; else if (r === 'needBranch') ui.pendingHybrid = { from: ui.drag.from, to: i }; }
    } else if (ui.press) {
      const j = ui.press.i;
      if (j != null) {
        const c = G.cells[j];
        const terr = () => { if (c.terrain && D.TERRAIN[c.terrain].desc) toast(`${D.TERRAIN[c.terrain].name}: ${D.TERRAIN[c.terrain].desc}`); };

  // 4배속은 상점 상품(4배속 또는 광고 제거 + 4배속 묶음). 웹판은 결제가 없어서 열려 있다
  $('#speed').addEventListener('click', () => {
    if (speed === 2 && !SD.meta.canSpeed4()) { speed = 1; toast('4배속은 상점에서 열 수 있어요'); }

  const inRun = () => !!G && $('#lobby').style.display !== 'block';

  // 뒤로가기(안드로이드): 닫을 수 있는 창은 닫고, 판 안이면 멈춤 창을 연다. 처리했으면 true, 로비 맨 바깥이면 false

    return false;
  }

  /* ---------- loop ---------- */
  let last = performance.now(), acc = 0, hudT = 0, lastFrame = 0;
  function frame(now) {
    lastFrame = now;
    const real = Math.min(0.1, (now - last) / 1000); last = now;
    if (G) {
      if (!paused && !modalOpen) {
        acc += real * speed; let n = 0;
        while (acc >= 1 / 60 && n < 12) { G.update(1 / 60); acc -= 1 / 60; n++; if (G.events.some(e => e.type === 'branch' || e.type === 'chooseRule' || (e.type === 'bossWarn' && !(codex.bosses || {})[e.boss]) || e.type === 'end' || (e.type === 'recipe' && e.first))) break; }

})(window);

    return rw.filter(r => r.type !== 'chest').map(r => lb(r) + (r.type === 'coffee' ? `<span class="rw">${coffee(18)}+${r.n}</span>` : r.type === 'tips' ? `<span class="rw">${tip(18)}+${num(r.n)}</span>` : r.type === 'maxPlus' ? `<span class="rw">${coffee(18)}최대치 +${r.n}</span>` : r.type === 'adFree' ? `<span class="rw">광고 제거</span>` : r.type === 'speed4' ? `<span class="rw">4배속</span>` : r.type === 'pass' ? `<span class="rw">단골 패스</span>` : r.type === 'parts' ? `<span class="rw">${partIcon(18)}도구 부품 +${r.n}</span>` : r.type === 'deckShards' ? r.keys.map(k => `<span class="rw">${shard(k, 18)}x${r.n}</span>`).join('') : r.type === 'shardList' ? r.list.map(s => `<span class="rw">${shard(s.k, 18)}x${s.n}</span>`).join('') : '')).join('');
  }
  function chestHtml(c) {
    return `<div class="chestbox"><div style="display:flex;align-items:center;gap:8px">${box(c.tier, 44)}<span class="jua" style="font-size:17px">${M.CHESTS[c.tier].name}</span><span class="link" data-act="odds" data-tier="${c.tier}">확률 보기</span></div>
      <div class="chestitems">${c.items.map(it => it.type === 'shard' ? `<div class="ci ${it.fresh ? 'new' : ''}">${shard(it.k, 34)}<span>${A.ING[it.k].name}</span><b>x${it.n}</b>${it.fresh ? '<i>새 재료</i>' : ''}</div>` : `<div class="ci">${tip(34)}<span>팁</span><b>+${num(it.n)}</b></div>`).join('')}</div><table class="odds" style="display:none;margin-top:6px">${M.chestOdds(c.tier).map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table></div>`;
  }
  function showRewards(title, rw, color = '#5cc96b') {
    const chests = rw.filter(r => r.type === 'chest');
    SD.ui.modal(`<div class="ribbon" style="background:${color}">${title}</div><div class="rwrow">${rewardChips(rw)}</div>${chests.map(chestHtml).join('')}<div class="btn big" data-close>좋아요!</div>`, bindModal);
  }
  function bindModal(m) {
    m.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { SD.ui.closeModal(); render(); });
    m.querySelectorAll('[data-act]').forEach(b => b.onclick = (e) => { e.stopPropagation(); if (b.dataset.act === 'odds') { const t = b.closest('.chestbox') && b.closest('.chestbox').querySelector('.odds'); if (t) { t.style.display = t.style.display === 'none' ? '' : 'none'; return; } } act(b.dataset.act, b.dataset); });
  }
  function oddsModal(tier) {
    SD.ui.modal(`<div class="ribbon" style="background:#8d7b6f">${M.CHESTS[tier].name} 확률</div><div style="display:flex;justify-content:center">${box(tier, 72)}</div>
      <table class="odds">${M.chestOdds(tier).map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table>
      <div class="lbl center dim">조각 종류는 해당 묶음 안에서 같은 확률로 골라요</div><div class="btn big" data-close>닫기</div>`, bindModal);
  }

  /* ---------- 공통 틀 ---------- */
  function topbar() {
    const P = M.p, need = M.expNeed();
    const next = M.coffeeNextMs();
    return `<div class="ltop">
      <div class="chip lvchip"><span class="lvb">${ing('sponge', 18)}</span><span>Lv ${P.lv}</span><i style="width:${Math.round(100 * P.exp / need)}%"></i></div>
      <div class="chip" style="flex:1" data-act="goShop">${coffee(22)}<span id="lCoffee">${P.coffee}<small style="font-size:12px;opacity:.5">/${M.coffeeMax()}</small></span><small id="lCoffeeT" style="margin-left:auto">${next ? '+1 · ' + mmss(next) : '가득'}</small><span class="plus">+</span></div>
      <div class="chip" data-act="goShop">${tip(22)}<span id="lTips">${num(P.tips)}</span><span class="plus">+</span></div></div>`;
  }
  function tabsHtml() {
    const L = [['play', '영업'], ['ing', '재료'], ['note', '비법 노트'], ['shop', '상점'], ['kitchen', '주방']];
    const dot = { shop: !M.p.day.freeChest || M.passState().claimable > 0, kitchen: M.kitchenPending().hours >= 2, ing: M.allIngs().some(k => (M.isUnlocked(k) ? (M.lvCost(k) && (M.p.shards[k] || 0) >= M.lvCost(k).shards && M.p.tips >= M.lvCost(k).tips) : (M.p.shards[k] || 0) >= M.ECON.UNLOCK_SHARDS)) };
    return `<div class="ltabs">${L.map(([k, n]) => `<div class="ltab ${k === tab ? 'on' : ''}" data-act="tab" data-t="${k}">${TI[k]}<span>${n}</span>${dot[k] && k !== tab ? '<span class="dot"></span>' : ''}</div>`).join('')}</div>`;
  }
  function sideIcons() {
    const att = M.attendState();
    const L = [['challenge', '도전', '<path d="M7.5 4h9v5.5a4.5 4.5 0 0 1-9 0z" fill="#ffc93c" ' + S + '/><path d="M7.5 6H4.5v.8A3 3 0 0 0 7.5 9.8M16.5 6h3v.8a3 3 0 0 1-3 3M12 14v4M8 20h8" fill="none" ' + S + '/>', M.modeUnlocked() && M.dailyInfo().free],
      ['attend', '출석', '<path d="M5 6h14v14H5z" fill="#fff" ' + S + '/><path d="M5 6h14v4H5z" fill="#ff6b5b" ' + S + '/><path d="M9 3v5M15 3v5M9 15l2 2 4-4" ' + S + '/>', !att.claimedToday],
      ['missions', '미션', '<path d="M6 4h12v16H6z" fill="#fff" ' + S + '/><path d="M9 9l1.5 1.5L13 8M9 14l1.5 1.5L13 13M15 9h1M15 14h1" ' + S + '/>', M.missionBadge()],
      ['mail', '우편', '<path d="M3 6h18v12H3z" fill="#fff" ' + S + '/><path d="M3 6l9 7 9-7" fill="none" ' + S + '/>', M.p.mail.length > 0],
      ['sound', '소리', '<path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff" ' + S + '/>' + (SD.sound && (SD.sound.sfx || SD.sound.bgm) ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" ' + S + '/>' : '<path d="M16 9l5 6M21 9l-5 6" ' + S + '/>'), false]];
    return `<div class="lside row">${L.map(([a, n, p, dot]) => `<div class="sideb" data-act="${a}"><svg viewBox="0 0 24 24" width="24" height="24">${p}</svg><span class="jua">${n}</span>${dot ? '<span class="dot"></span>' : ''}</div>`).join('')}</div>`;
  }

  /* ---------- 영업 (가운데 카드: 위아래 = 음식점, 좌우 = 스테이지) ---------- */
  let viewStage = null, slideDir = '';
  function bestStage(m) { if (M.p.sel.map === m && M.stageUnlocked(m, M.p.sel.stage)) return M.p.sel.stage; return [5, 4, 3, 2, 1].find(s => M.stageUnlocked(m, s)) || 1; }
  function moveView(dm, ds) {
    const O = D.MAP_ORDER; let i = O.indexOf(viewMap);
    if (dm) { const j = i + dm; if (j < 0 || j >= O.length) return false; viewMap = O[j]; viewStage = bestStage(viewMap); slideDir = dm > 0 ? 'up' : 'down'; }
    if (ds) { const s = viewStage + ds; if (s < 1 || s > 5) return false; viewStage = s; slideDir = ds > 0 ? 'left' : 'right'; }
    if (M.stageUnlocked(viewMap, viewStage)) { M.p.sel = { map: viewMap, stage: viewStage }; M.save(); }
    return true;
  }
  function playTab() {
    const P = M.p;
    if (!viewMap) { viewMap = P.sel.map; viewStage = P.sel.stage; }
    const O = D.MAP_ORDER, mi = O.indexOf(viewMap), map = D.MAPS[viewMap], st = viewStage;
    const mapOpen = M.mapUnlocked(viewMap), open = M.stageUnlocked(viewMap, st);
    const stars = M.starsOf(viewMap, st), first = stars === 0, free = M.isFree(viewMap);
    const boss = M.stageBoss(viewMap, st), bname = (k) => (A.BOSS[k] || {}).name || k;
    const today = D.PAIRS[P.today], known = today && (codex().recipes[today.A] || codex().recipes[today.B]);
    const prev = O[mi - 1], next = O[mi + 1];
    const peek = (m, dir) => m ? `<div class="peek ${dir}" data-act="mv" data-dm="${dir === 'up' ? -1 : 1}"><svg viewBox="0 0 24 24" width="14" height="14"><path d="${dir === 'up' ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6'}" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span style="background:${D.MAPS[m].color}" class="pdot"></span>${D.MAPS[m].name}${M.mapUnlocked(m) ? ` <small>${M.mapStars(m)}/15</small>` : ` <small>${lock(11)}</small>`}</div>` : `<div class="peek ${dir} none"></div>`;
    const dots = [1, 2, 3, 4, 5].map(s => { const so = M.stageUnlocked(viewMap, s), sr = M.starsOf(viewMap, s); return `<div class="sdot ${s === st ? 'on' : ''} ${so ? '' : 'lock'} ${s === 5 ? 'last' : ''}" data-act="stage" data-s="${s}"><b>${so ? s : lock(10)}</b><span>${sr ? '★'.repeat(sr) : ''}</span></div>`; }).join('');
    const arrow = (d) => { const ok = d < 0 ? st > 1 : st < 5; return `<div class="sarrow ${d < 0 ? 'l' : 'r'} ${ok ? '' : 'off'}" data-act="mv" data-ds="${d}"><svg viewBox="0 0 24 24" width="22" height="22"><path d="${d < 0 ? 'M15 5l-7 7 7 7' : 'M9 5l7 7-7 7'}" fill="none" stroke="${INK}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`; };
    const lockMsg = !mapOpen ? `${D.MAPS[prev].name} 5스테이지를 깨면 열려요` : `${mi + 1}-${st - 1} 스테이지를 먼저 깨요`;
    return `<div class="phead"><span class="jua" style="font-size:22px">영업하러 가기</span><div class="hicons">${sideIcons()}</div></div>
      ${peek(prev, 'up')}
      <div class="swipezone">
        <div class="stageview ${slideDir}" style="--mc:${map.color}">
          <img class="sbg" src="${SD.mapImg(viewMap)}" alt="">
          <div class="stop"><span class="maptag" style="background:${map.color}">${mi + 1}장 · ${map.shape}</span><span class="mapstars">${starS(1, 14)} ${M.mapStars(viewMap)}/15</span></div>
          <div class="sinfo">
            <div class="jua sname"><span class="sno" style="background:${map.color}">${mi + 1}-${st}</span>${map.name}</div>
            <div class="jua ssub">${M.stageName(viewMap, st)}</div>
            <div class="bossline">${st === 5 ? `<span class="bossic">${A.boss(boss.last, 34)}</span>` : ''}${D.GUEST_COUNT[st] ? `<span class="tag" style="background:#ff9f43">까다로운 손님 ${D.GUEST_COUNT[st]}명</span>` : ''}<span class="tag" style="background:#a77bf3">W7 ${bname(boss.mid)}</span><span class="tag" style="background:${boss.lastStrong ? '#a77bf3' : '#ff6b5b'}">W${D.wavesOf(viewMap, st)} ${bname(boss.last)}${boss.lastStrong ? ' 강화' : ''}</span></div>
            <div class="sstars2">${starS(stars > 0, 22)}${starS(stars > 1, 22)}${starS(stars > 2, 22)}</div>
          </div>
          ${open ? '' : `<div class="slock"><div>${lock(30)}</div><div class="jua">${lockMsg}</div></div>`}
        </div>
        ${arrow(-1)}${arrow(1)}
      </div>
      <div class="sdots">${dots}</div>
      ${peek(next, 'down')}
      <div class="lpanel">
        <div class="infoline card" style="padding:7px 10px;margin:0">${first ? `첫 클리어 ${box(M.firstChest(viewMap, st), 22)}${M.CHESTS[M.firstChest(viewMap, st)].name}` : `별 3개 ${box('silver', 22)}은 상자`}
          <span class="todaychip" data-act="today"><span class="tag" style="background:#ff6b5b">오늘</span>${today ? ing(today.a, 18) + (known ? ing(today.b, 18) : '<b class="q">?</b>') : '-'}<small>바꾸기</small></span></div>
        <div style="display:flex;gap:8px;margin-top:8px">
          ${stars >= 3 ? `<div class="btn" style="width:96px;height:58px;flex-direction:column;gap:0" data-act="sweep">소탕<small style="display:flex;align-items:center;gap:2px">${free ? '무료' : coffee(14) + '5'}</small></div>` : ''}
          <div class="btn startbtn ${open ? '' : 'dis'} ${open && !P.stats.plays ? 'pulse' : ''}" data-act="${open ? 'start' : 'lockedStart'}">영업 시작<span>${free ? '연습 주방 · 무료' : coffee(18) + ' 5'}</span></div>
        </div></div>`;
  }

  /* ---------- 재료 ---------- */
  function ingTile(k, sel) {
    const P = M.p, un = M.isUnlocked(k), lv = P.levels[k] || 0;
    const c = un ? M.lvCost(k) : { shards: M.ECON.UNLOCK_SHARDS };
    const ready = c && (P.shards[k] || 0) >= c.shards && (!un || P.tips >= c.tips);
    return `<div class="itile ${sel ? 'sel' : ''} ${un ? '' : 'locked'}" data-act="ing" data-k="${k}"><div class="ia">${ing(k, 30)}</div><div class="ib" style="background:${fam(k).color}">${un ? 'Lv' + lv : '잠김'}</div>${ready ? '<span class="dot"></span>' : ''}</div>`;
  }
  function ingTab() {
    const P = M.p; selIng = selIng || P.deck[0];
    const all = M.allIngs(), deck = P.deck, rest = all.filter(k => !deck.includes(k));
    const famCount = ['acid', 'alk', 'soap', 'water', 'scrub'].map(f => `<span class="fc"><i style="background:${A.FAMILY[f].color}"></i>${deck.filter(k => A.ING[k].family === f).length}</span>`).join('');
    const k = selIng, un = M.isUnlocked(k), lv = P.levels[k] || 0, sp = D.ING[k], c = un ? M.lvCost(k) : null;
    const have = P.shards[k] || 0, need = un ? (c ? c.shards : 0) : M.ECON.UNLOCK_SHARDS;
    const pairs = Object.values(D.PAIRS).filter(p => p.key === k);
    const brs = ['A', 'B'].map(b => { const B = D.BRANCH[k][b], rs = pairs.map(p => `+ ${A.ING[p.a === k ? p.b : p.a].name} → ${codex().recipes[p[b]] ? D.RECIPES[p[b]].name : '???'}`); return `<div class="brcard ${b}"><div><span class="brb">${b}</span><span class="jua">${B.name}</span></div><div class="brd">${B.desc}</div>${rs.map(r => `<div class="brr">${r}</div>`).join('')}</div>`; }).join('');
    return `<div class="lscroll">
      <div class="sec">덱 <small>${deck.length}/8종 · 판에서 소환되는 재료</small><span class="famc">${famCount}</span></div>
      <div class="igrid">${deck.map(x => ingTile(x, x === k)).join('')}${Array.from({ length: 8 - deck.length }, () => '<div class="itile empty"></div>').join('')}</div>
      <div class="sec" style="margin-top:12px">전체 재료 <small>눌러서 보기 · 덱에 넣기</small></div>
      <div class="igrid">${rest.map(x => ingTile(x, x === k)).join('')}</div>
      <div class="card idetail">
        <div style="display:flex;gap:12px;align-items:center">
          <div class="bigicon">${ing(k, 64)}</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px"><span class="jua" style="font-size:23px">${A.ING[k].name}</span><span class="tag" style="background:${fam(k).color};color:${INK}">${fam(k).name} · ${ROLE[sp.role]}</span></div>
            <div style="font-size:12px;font-weight:800;margin-top:3px">${un ? (c ? `Lv ${lv} → ${lv + 1} <span class="dim">위력 +8%</span>` : `Lv ${lv} 최대`) : '아직 없는 재료'} <span class="dim">· 지금 위력 x${M.dmgMul(k).toFixed(2)}</span></div>
            <div style="display:flex;align-items:center;gap:6px;margin-top:6px">${shard(k, 20)}<div class="bar" style="flex:1"><i style="width:${need ? Math.min(100, 100 * have / need) : 100}%;background:#2ec4b6"></i></div><span style="font-size:12px;font-weight:800">${have}/${need || '-'}</span></div>
          </div></div>
        <div class="brrow">${brs}</div>
        <div class="dbtns">
          ${un ? `<div class="btn" data-act="deck" data-k="${k}">${deck.includes(k) ? '덱에서 빼기' : '덱에 넣기'}</div>` : ''}
          ${un ? (c ? `<div class="btn go" data-act="lvup" data-k="${k}">레벨업<span>${tip(14)}${num(c.tips)} · ${shard(k, 14)}${c.shards}</span></div>` : `<div class="btn" style="opacity:.5">최대 레벨</div>`) : `<div class="btn go" data-act="unlock" data-k="${k}">해금<span>${shard(k, 14)}${M.ECON.UNLOCK_SHARDS}</span></div>`}
        </div></div></div>`;
  }

  /* ---------- 비법 노트 ---------- */
  function noteTab_() {
    const cx = codex(), R = D.RECIPES;
    const known = Object.keys(R).filter(k => cx.recipes[k]).length;
    const sub = `<div class="ntabs">${[['recipe', `비법 ${known}/${Object.keys(R).length}`], ['combo', `콤보 ${Object.keys(cx.combos).length}/5`], ['safety', `안전 ${Object.keys(cx.safety || {}).length}/1`]].map(([k, n]) => `<div class="ntab ${noteTab === k ? 'on' : ''}" data-act="note" data-n="${k}">${n}</div>`).join('')}</div>`;
    let body = '';
    if (noteTab === 'recipe') {
      body = Object.entries(D.PAIRS).map(([pid, P]) => `<div class="prow"><div class="pico">${ing(P.a, 26)}<b>+</b>${ing(P.b, 26)}</div>${['A', 'B'].map(b => { const id = P[b], kn = cx.recipes[id]; return `<div class="rcard ${kn ? '' : 'unk'}" data-act="${kn ? 'recipe' : ''}" data-id="${id}"><span class="brb ${b}">${b}</span><span>${kn ? R[id].name : '???'}</span></div>`; }).join('')}</div>`).join('')
        + `<div class="sec" style="margin-top:12px">상위 비법 <small>비법 + 재료 3성, 비법 + 비법</small></div>`
        + Object.entries(R).filter(([, r]) => r.tier > 1).map(([id, r]) => { const kn = cx.recipes[id]; const src = `${A.ING[D.PAIRS[r.src].a].name}+${A.ING[D.PAIRS[r.src].b].name} 비법`; const w = r.with ? A.ING[r.with].name : `${A.ING[D.PAIRS[r.withPair].a].name}+${A.ING[D.PAIRS[r.withPair].b].name} 비법`; return `<div class="t2row ${kn ? '' : 'unk'}" data-act="${kn ? 'recipe' : ''}" data-id="${id}"><span class="tag" style="background:${r.tier === 3 ? '#e8653f' : '#ff9f43'}">${r.tier === 3 ? '최상위' : '상위'}</span><span class="jua">${kn ? r.name : '???'}</span><small>${kn ? `${src} + ${w}` : `${src} + ?`}</small></div>`; }).join('');
    } else if (noteTab === 'combo') {
      const desc = { blast: '산성 + 알칼리 → 범위 세척 + 밀어내기', puddle: '거품 + 불림 → 바닥 거품 장판', shatter: '굳힘 + 연마 → 주변으로 파편', chain: '불림 + 소금 → 옆 그릇으로 연쇄', cloud: '불림 + 과탄산 → 그릇이 구름을 달고 다님' };
      const fxk = { blast: 'burst', puddle: 'puddle', shatter: 'shard', chain: 'crystal', cloud: 'cloud' };
      body = Object.keys(D.COMBOS).map(k => { const kn = cx.combos[k]; return `<div class="t2row ${kn ? '' : 'unk'}"><span class="ii" style="width:40px;height:40px">${kn ? A.fx(fxk[k], 40) : ''}</span><span class="jua">${kn ? D.COMBOS[k].name.replace('!', '') : '???'}</span><small>${kn ? desc[k] : '전투에서 상태를 겹쳐 보세요'}</small></div>`; }).join('');
    } else {
      const kn = cx.safety && cx.safety.bleachAcid;
      body = `<div class="t2row ${kn ? '' : 'unk'}"><span class="tag" style="background:#ff6b5b">금지</span><span class="jua">${kn ? '락스 + 산성 세제' : '???'}</span><small>${kn ? '절대 섞으면 안 돼요. 유독한 염소 가스가 나와요' : '위험한 조합을 시도하면 기록돼요'}</small></div>
        <div class="t2row"><span class="tag" style="background:#ff9f43">주의</span><span class="jua">철수세미 + 코팅 팬</span><small>코팅 팬은 철수세미로 닦으면 코팅이 벗겨져요</small></div>`;
    }
    return `<div class="lscroll notebook">${sub}${body}</div>`;
  }
  function recipeModal(id) {
    const r = D.RECIPES[id];
    SD.ui.modal(`<div class="ribbon" style="background:${r.tier > 1 ? '#e8653f' : '#ff6b5b'}">${r.name}</div><div class="pair">${r.icons.map(k => ing(k, 46)).join('<b>+</b>')}</div>
      ${r.tier === 1 ? `<div class="lbl center dim">${A.ING[D.PAIRS[r.pair].key].name} 분기 ${r.branch}로 교잡</div>` : ''}<div class="note pen">${r.tip}</div><div class="btn big" data-close>닫기</div>`, bindModal);
  }

  /* ---------- 상점 ---------- */
  function shopTab() {
    const P = M.p, d = P.day, E = M.ECON, WEB = window.SD_PLATFORM === 'web', NOAD = WEB || !SD.ads.available();   // NOAD: 광고를 못 띄우는 판(웹판, 광고 그룹이 없는 토스)에서는 광고 칸을 안 보여 준다
    const adBtn = (n, left) => `<div class="btn sm" style="flex-direction:column;gap:0;line-height:1">${P.adFree ? '바로 받기' : '광고 보기'}<small>${left}/${n} 남음</small></div>`;
    const ps = M.passState(), days = Math.max(1, Math.ceil(ps.endMs / 864e5)), cLeft = M.adLeft('chest'), rLeft = M.adLeft('reroll');
    const prod = (id, ic) => { const pr = M.PRODUCTS[id], own = M.owned(id); if (TOSS && !own && !canSell(id)) return ''; return `<div class="card pcard ${own ? 'used' : ''}" data-act="buy" data-id="${id}"><div class="pic">${ic}</div><div class="ptx"><span class="jua">${pr.name}</span><small class="dim">${pr.desc}</small></div><div class="btn sm">${own ? '보유 중' : priceText(id)}</div></div>`; };
    const cards = WEB ? '' : prod('adfree', noAdIcon(34)) + prod('speed4', ffIcon(34)) + prod('shards10', shard(P.deck[0], 32)) + prod('shards30', `<span style="position:relative;margin-right:10px">${shard(P.deck[0], 32)}<span class="jua plusbadge">x3</span></span>`);
    const showStarter = !WEB && !P.bought.starter && (!TOSS || canSell('starter')), showCombo = !WEB && !(P.adFree || P.speed4) && (!TOSS || canSell('combo'));
    return `<div class="lscroll">
      <div class="card passcard ${ps.claimable ? 'hot' : ''}" data-act="pass">${passIcon(46)}<div style="flex:1;min-width:0"><div class="jua" style="font-size:18px">단골 패스 <small class="dim" style="font-family:Pretendard;font-size:11px;font-weight:800">${ps.lv}/${E.PASS_LEVELS}단계 · ${days}일 남음</small></div><div class="bar" style="margin-top:5px"><i style="width:${Math.round(100 * ps.into / ps.step)}%;background:#ff9f43"></i></div></div><div class="btn sm ${ps.claimable ? 'go' : ''}" style="width:64px;height:36px">${ps.claimable ? '받기 ' + ps.claimable : '보기'}</div></div>
      <div class="sec" style="margin-top:12px">오늘의 무료 <small>매일 오전 5시 초기화</small></div>
      <div class="${NOAD ? '' : 'g4'}">
        ${NOAD ? `<div class="card fwide ${d.freeChest ? 'used' : 'hot'}" data-act="free">${box('wood', 50)}<div style="flex:1"><div class="jua" style="font-size:18px">무료 상자</div><div class="pdesc">재료 조각과 팁이 들어 있어요</div></div><div class="btn sm ${d.freeChest ? '' : 'go'}" style="width:84px;height:36px">${d.freeChest ? '내일 또' : '받기'}</div></div>` : `<div class="card fcard ${d.freeChest ? 'used' : 'hot'}" data-act="free">${box('wood', 44)}<span class="jua">무료 상자</span><div class="btn sm ${d.freeChest ? '' : 'go'}">${d.freeChest ? '내일 또' : '받기'}</div></div>`}
        ${NOAD ? '' : `<div class="card fcard ${cLeft <= 0 ? 'used' : ''}" data-act="adChest">${box('wood', 44)}<span class="jua">상자 더</span>${adBtn(E.AD_CAPS.chest, cLeft)}</div>
        <div class="card fcard ${d.adCoffee >= E.AD_COFFEE_CAP ? 'used' : ''}" data-act="adCoffee">${coffee(40)}<span class="jua">커피 +${E.AD_COFFEE}</span>${adBtn(E.AD_COFFEE_CAP, E.AD_COFFEE_CAP - d.adCoffee)}</div>
        <div class="card fcard ${M.adShardLeft() <= 0 ? 'used' : ''}" data-act="adShard">${shard(P.deck[0], 38)}<span class="jua">조각 +${E.AD_SHARD_KINDS * E.AD_SHARD_N}</span>${adBtn(E.AD_SHARD_CAP, M.adShardLeft())}</div>`}
      </div>
      <div class="sec" style="margin-top:12px">조각 가게 <small id="lShopT">${mmss(M.shopNextMs())} 뒤 바뀜</small><span style="margin-left:auto;display:flex;gap:5px">${NOAD || rLeft <= 0 ? '' : `<span class="btn sm" style="width:auto;padding:0 8px;flex-direction:row;gap:3px;white-space:nowrap" data-act="adReroll">${P.adFree ? '무료' : '광고'} 새로고침 ${rLeft}</span>`}<span class="btn sm" style="width:auto;padding:0 8px;flex-direction:row;gap:3px;white-space:nowrap" data-act="reroll">새로고침 ${tip(14)}${E.SHOP_REROLL}</span></span></div>
      <div class="g4">${P.shop.slots.map((s, i) => { const bought = P.shop.bought.includes(i), un = M.isUnlocked(s.k); return `<div class="card scard ${bought ? 'used' : ''}" data-act="shopBuy" data-i="${i}">${un ? '' : '<span class="tag newtag" style="background:#a77bf3">새 재료</span>'}${shard(s.k, 38)}<span class="sname2">${A.ING[s.k].name} x${s.n}</span><div class="btn sm prow">${bought ? '구매 완료' : tip(14) + num(s.price)}</div></div>`; }).join('')}</div>
      ${WEB || (TOSS && !cards && !showStarter && !showCombo) ? '' : `<div class="sec" style="margin-top:12px">상품${TOSS ? '' : ' <small>개발용 · 테스트로 바로 지급</small>'}</div>
      ${!showStarter ? '' : `<div class="card pstarter" data-act="buy" data-id="starter"><span class="tag" style="position:absolute;top:-9px;left:12px;background:#ff6b5b">한 번만</span>${box('gold', 54)}<div style="flex:1"><div class="jua" style="font-size:18px">스타터팩</div><div class="pdesc">${M.PRODUCTS.starter.desc}</div></div><div class="btn" style="height:42px;width:78px;background:#ffc93c">${priceText('starter')}</div></div>`}
      ${!showCombo ? '' : `<div class="card pstarter" data-act="buy" data-id="combo" style="margin-top:${P.bought.starter ? 10 : 16}px"><span class="tag" style="position:absolute;top:-9px;left:12px;background:#5cc96b">묶음 할인</span><span style="display:flex;flex:none">${noAdIcon(38)}${ffIcon(38)}</span><div style="flex:1"><div class="jua" style="font-size:17px">광고 제거 + 4배속</div><div class="pdesc">따로 사면 <s>${num(M.PRODUCTS.adfree.price + M.PRODUCTS.speed4.price)}원</s> · ${num(M.PRODUCTS.adfree.price + M.PRODUCTS.speed4.price - M.PRODUCTS.combo.price)}원 할인</div></div><div class="btn" style="height:42px;width:78px;background:#ffc93c">${priceText('combo')}</div></div>`}
      <div class="g2">${cards}</div>`}
    </div>`;
  }

  /* ---------- 주방 ---------- */
  function kitchenTab() {
    const P = M.p, pend = M.kitchenPending(), up = M.kitchenUpCost(), E = M.ECON, adOk = SD.ads.available(), sLeft = M.adLeft('sweep');
    const sweeps = []; for (const m of D.MAP_ORDER) for (let s = 1; s <= 5; s++) if (M.starsOf(m, s) >= 3) sweeps.push([m, s]);
    const slots = M.toolSlots();
    const tools = Object.entries(D.TOOLS).map(([id, t]) => { const own = M.hasTool(id), on = P.toolEq.includes(id); return `<div class="card tcard ${on ? 'on' : ''} ${own ? '' : 'lockd'}" data-act="tool" data-id="${id}"><div class="tic">${toolArt(id, 40)}</div><div class="ttx"><span class="jua">${t.name}</span><small>${t.desc}</small></div>${on ? '<span class="tag ton" style="background:#5cc96b">드는 중</span>' : own ? '' : `<span class="tag ton" style="background:#8d7b6f">${partIcon(12)}${t.cost}</span>`}</div>`; }).join('');
    return `<div class="lscroll">
      <div class="card kcard">
        <div style="display:flex;align-items:center;gap:12px">
          <div class="kpot">${TI.kitchen.replace(/width="26" height="26"/, 'width="70" height="70"')}</div>
          <div style="flex:1"><div class="jua" style="font-size:22px">우리 주방 Lv ${P.kitchen.lv}</div>
            <div style="font-size:12px;font-weight:800;margin-top:2px">시간당 ${tip(14)} ${num(M.kitchenRate())} <span class="dim">· 깬 스테이지 ${M.clearedCount()}개만큼 늘어요</span></div></div></div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:12px">${tip(26)}<span class="jua" style="font-size:24px" id="lKitchen">${num(pend.tips)}</span><div class="bar" style="flex:1"><i style="width:${Math.round(100 * pend.hours / E.KITCHEN_CAP_H)}%;background:#ffc93c"></i></div><small style="font-weight:800">${pend.full ? '가득 참' : `${Math.floor(pend.hours)}/${E.KITCHEN_CAP_H}시간`}</small></div>
        <div class="dbtns"><div class="btn go" data-act="kCollect">받기</div><div class="btn" data-act="kUp" style="flex-direction:column;gap:0">주방 확장 ${up == null ? '<small>최대</small>' : `<small style="display:flex;align-items:center;gap:2px">${tip(13)}${num(up)} · 생산 +25%</small>`}</div></div>
        <div class="lbl dim" style="margin-top:6px">게임을 꺼 둬도 최대 ${E.KITCHEN_CAP_H}시간까지 쌓여요</div>
      </div>
      <div class="sec" style="margin-top:14px">주방 도구 <small>판에 ${slots}개 들고 가요 (${P.toolEq.length}/${slots})</small><span class="partchip">${partIcon(16)}${P.parts}</span></div>
      <div class="g2">${tools}</div>
      <div class="lbl dim" style="margin-top:6px">도구 부품은 오늘의 도전, 무한 영업 기록, 일일 미션, 단골 패스에서 얻어요${P.lv < E.TOOL_SLOT3_LV ? ` · 레벨 ${E.TOOL_SLOT3_LV}부터 3개를 들어요` : ''}</div>
      <div class="sec" style="margin-top:14px">소탕 <small>별 3개 스테이지 · 바로 보상 (나무 상자)</small></div>
      ${sweeps.length ? sweeps.map(([m, s]) => `<div class="t2row"><span class="tag" style="background:${D.MAPS[m].color}">${D.MAPS[m].name}</span><span class="jua">${D.MAP_ORDER.indexOf(m) + 1}-${s} ${M.stageName(m, s)}</span><span style="margin-left:auto;display:flex;gap:5px">${adOk && sLeft > 0 && !M.isFree(m) ? `<span class="btn sm" style="width:auto;padding:0 8px;flex-direction:row;white-space:nowrap" data-act="sweepAd" data-m="${m}" data-s="${s}">${P.adFree ? '무료' : '광고'} 소탕 ${sLeft}</span>` : ''}<span class="btn sm" style="width:auto;padding:0 10px;flex-direction:row;gap:3px;white-space:nowrap" data-act="sweepAt" data-m="${m}" data-s="${s}">소탕 ${M.isFree(m) ? '무료' : coffee(14) + '5'}</span></span></div>`).join('') : `<div class="lbl dim" style="margin-top:8px">아직 별 3개 스테이지가 없어요. 만족도를 16 이상 남기고 클리어하면 별 3개예요.</div>`}
    </div>`;
  }

  /* ---------- 출석 · 미션 · 우편 ---------- */
  const itemText = (it) => [it.coffee ? `${coffee(16)}${it.coffee}` : '', it.tips ? `${tip(16)}${num(it.tips)}` : '', it.chest ? `${box(it.chest, 18)}${M.CHESTS[it.chest].name}` : '', it.parts ? `${partIcon(16)}부품 ${it.parts}` : '', it.deckShards ? `덱 조각 x${it.deckShards}` : ''].filter(Boolean).join(' ');
  function attendModal() {
    const st = M.attendState();
    SD.ui.modal(`<div class="ribbon" style="background:#ffc93c;color:${INK};text-shadow:none">출석 보상</div>
      <div class="att">${M.ATTEND.map((a, i) => `<div class="attd ${i < st.idx || (st.claimedToday && i === st.idx) ? 'got' : ''} ${i === st.idx && !st.claimedToday ? 'now' : ''}"><b>${i + 1}일</b><div>${itemText(a)}</div></div>`).join('')}</div>
      <div class="btn big" data-act="${st.claimedToday ? '' : 'attendClaim'}" ${st.claimedToday ? 'data-close' : ''}>${st.claimedToday ? '내일 또 와요' : '받기'}</div>`, bindModal);
  }
  function missionModal() {
    SD.ui.modal(`<div class="ribbon" style="background:#a77bf3">오늘의 미션</div>${M.missionState().map(ms => `<div class="mrow"><div style="flex:1"><div class="jua" style="font-size:15px">${ms.name} <small class="dim" style="display:inline;font-family:Pretendard;font-size:10px;font-weight:800">${ms.tier}/${ms.tiers}단계</small></div><div class="bar" style="margin-top:4px"><i style="width:${Math.round(100 * ms.prog / ms.goal)}%;background:#a77bf3"></i></div><small class="dim">${ms.prog}/${ms.goal} · ${itemText(ms.reward)}</small></div><div class="btn sm ${ms.done && !ms.claimed ? 'go' : ''}" style="width:72px" data-act="${ms.done && !ms.claimed ? 'mClaim' : ''}" data-id="${ms.id}">${ms.claimed ? '완료' : ms.done ? '받기' : '진행 중'}</div></div>`).join('')}${M.missionBadge() ? '<div class="btn big go" data-act="mAll">모두 받기</div>' : '<div class="btn big" data-close>닫기</div>'}`, bindModal);
  }
  function mailModal() {
    const L = M.p.mail;
    SD.ui.modal(`<div class="ribbon" style="background:#4aa3ff">우편함</div>${L.length ? L.map(m => `<div class="mrow"><div style="flex:1"><div class="jua" style="font-size:15px">${m.title}</div><small class="dim">${m.body || ''}</small><div style="font-size:12px;font-weight:800;margin-top:3px">${itemText(m.items)}</div></div><div class="btn sm go" style="width:64px" data-act="mailOne" data-id="${m.id}">받기</div></div>`).join('') + '<div class="btn big" data-act="mailAll">모두 받기</div>' : '<div class="lbl center dim" style="padding:20px 0">우편이 없어요</div><div class="btn big" data-close>닫기</div>'}`, bindModal);
  }

  /* ---------- 도전 (오늘의 도전 · 무한 영업) · 랭킹 ---------- */
  function challengeModal() {
    if (!M.modeUnlocked()) { toast('기본 주방 5스테이지를 깨면 도전이 열려요'); return; }
    const P = M.p, di = M.dailyInfo(), map = D.MAPS[di.map], maps = M.endlessMaps(), adOk = SD.ads.available();
    if (!maps.includes(endMap)) endMap = maps[maps.length - 1];
    if (!di.free) SD.ads.prepare(['daily']);
    const next = M.endlessNext(endMap);
    const dBtn = di.free ? `<div class="btn big go" data-act="dailyGo">도전하기</div>`
      : (adOk && di.adLeft > 0) ? `<div class="btn big" data-act="dailyAd">${P.adFree ? '다시 도전' : '광고 보고 다시 도전'} (${di.adLeft}번 남음)</div>` : `<div class="btn big dis">내일 또 도전해요</div>`;
    SD.ui.modal(`<div class="ribbon" style="background:#4aa3ff">도전</div>
      <div class="card chcard"><div class="chh"><span class="tag" style="background:#ff6b5b">오늘의 도전</span><span class="jua">${map.name}</span><span class="link" data-act="rank">랭킹 보기</span></div>
        <div class="chd">모두 같은 판이에요. 끝없이 밀려오는 그릇을 몇 웨이브까지 버티는지 겨뤄요.</div>
        <div class="chg">${di.guests.map(x => `<span class="tago">${D.GUESTS[x.id].name}</span>`).join('')}</div>
        <div class="chd">오늘 내 최고 <b>${di.bestWave ? di.bestWave + '웨이브' : '기록 없음'}</b>${di.tries ? '' : ` · 참가하면 ${partIcon(13)}부품 +1`}</div>${dBtn}</div>
      <div class="card chcard"><div class="chh"><span class="tag" style="background:#a77bf3">무한 영업</span><span class="jua">${D.MAPS[endMap].name}</span>${maps.length > 1 ? '<span class="link" data-act="endMap">음식점 바꾸기</span>' : ''}</div>
        <div class="chd">5스테이지를 깬 음식점에서 끝없이 영업해요. 내 최고 <b>${M.endlessBest(endMap)}웨이브</b>${next ? ` · ${next}웨이브를 넘기면 ${partIcon(13)}부품 +${M.ECON.ENDLESS_MS_PARTS}` : ''}</div>
        <div class="btn big" data-act="endGo" style="gap:6px">무한 영업 시작 <small style="opacity:1;font-size:13px">${coffee(16)}${M.ECON.MODE_COFFEE}</small></div></div>
      <div class="btn" data-close>닫기</div>`, bindModal);
  }
  function rankModal() {
    const day = M.dayISO();
    SD.ui.modal(`<div class="ribbon" style="background:#ffc93c;color:${INK};text-shadow:none">오늘의 도전 랭킹</div>
      <div class="lbl center">내 이름 <b id="rkName">${M.rankName()}</b> <span class="link" data-act="rankName">다른 이름</span></div>
      <div class="rklist" id="rkList"><div class="lbl center dim" style="padding:26px 0">불러오는 중…</div></div>
      <div class="btn big" data-close>닫기</div>`, (m) => {
      bindModal(m);
      SD.rank.top(day).then((r) => {
        const bx = m.querySelector('#rkList'); if (!bx) return;
        if (!r) { bx.innerHTML = '<div class="lbl center dim" style="padding:26px 0">랭킹을 불러오지 못했어요. 잠시 뒤에 다시 열어 주세요</div>'; return; }
        const row = (x, me) => `<div class="rkrow ${me ? 'me' : ''}"><b>${x.rank}</b><span>${x.name}</span><i>${x.wave}웨이브</i></div>`;
        const top = r.top || [];
        bx.innerHTML = (top.length ? top.map(x => row(x, x.me)).join('') : '<div class="lbl center dim" style="padding:26px 0">아직 기록이 없어요. 첫 번째로 도전해 보세요</div>')
          + (r.me && !top.some(x => x.me) ? '<div class="rkgap">⋮</div>' + row(r.me, true) : '')
          + (r.total ? `<div class="lbl center dim" style="margin-top:6px">오늘 ${r.total}명 참가</div>` : '');
      });
    });
  }

  /* ---------- 단골 패스 ---------- */
  function passModal() {
    const st = M.passState(), E = M.ECON, days = Math.max(1, Math.ceil(st.endMs / 864e5));
    const WEB = window.SD_PLATFORM === 'web' || (TOSS && !st.premium && !canSell('pass'));   // 유료 줄을 안 보여 주는 판
    const cell = (it, got, open, shut) => `<div class="pcell ${got ? 'got' : ''} ${open && !shut ? '' : 'wait'}">${itemText(it)}${shut ? ' ' + lock(10) : ''}</div>`;
    SD.ui.modal(`<div class="ribbon" style="background:#ff9f43">단골 패스</div>
      <div class="lbl center"><b>${st.lv}/${E.PASS_LEVELS}단계</b> · ${days}일 뒤 새 시즌</div>
      <div class="bar"><i style="width:${Math.round(100 * st.into / st.step)}%;background:#ff9f43"></i></div>
      <div class="lbl center dim">영업 · 미션 · 출석 · 도전을 하면 점수가 쌓여요${st.lv >= E.PASS_LEVELS ? '' : ` (다음 단계까지 ${st.step - st.into}점)`}</div>
      ${WEB ? '' : `<div class="lbl center">${st.premium ? '단골 줄 열림 · 이번 시즌 동안 주방 도구를 하나 더 들어요' : '단골 줄을 열면 이번 시즌 동안 <b>주방 도구를 하나 더</b> 들어요'}</div>`}
      <div class="prow2 phd ${WEB ? 'one' : ''}"><b></b><span>무료</span>${WEB ? '' : `<span>단골${st.premium ? '' : ' ' + lock(10)}</span>`}</div>
      <div class="plist ${WEB ? 'one' : ''}">${st.rows.map(x => `<div class="prow2 ${x.open ? 'open' : ''}"><b>${x.lv}</b>${cell(x.free, x.gotF, x.open, false)}${WEB ? '' : cell(x.paid, x.gotP, x.open, !st.premium)}</div>`).join('')}</div>
      ${st.claimable ? '<div class="btn big go" data-act="passClaim">보상 받기</div>' : ''}
      ${st.premium || WEB || (TOSS && !canSell('pass')) ? '' : `<div class="btn big" data-act="buy" data-id="pass">단골 줄 열기 ${priceText('pass')}</div>`}
      <div class="btn" data-close>닫기</div>`, bindModal);
  }

  /* ---------- 주방 도구 ---------- */
  function toolModal(id) {
    const t = D.TOOLS[id], P = M.p, enough = P.parts >= t.cost;
    SD.ui.modal(`<div class="ribbon" style="background:#8d7b6f">주방 도구</div>
      <div style="display:flex;justify-content:center">${toolArt(id, 84)}</div>
      <div class="jua h1" style="text-align:center;font-size:24px">${t.name}</div>
      <div class="lbl center" style="font-size:14px">${t.desc}</div>
      <div class="lbl center dim">가진 부품 ${partIcon(13)}${P.parts} · 필요 ${t.cost}</div>
      <div class="btn big ${enough ? 'go' : 'dis'}" data-act="toolBuy" data-id="${id}" style="gap:6px">${enough ? '부품으로 만들기' : `부품이 ${t.cost - P.parts}개 모자라요`}</div>

  // 광고를 끝까지 본 뒤에만 fn 실행. 광고 제거를 샀으면 바로

  const adTitle = (t) => M.p.adFree || !SD.ads.isTest ? t : t + ' (테스트 광고)';
  const closeIfOpen = () => { if (document.querySelector('#modal.show')) SD.ui.closeModal(); };

  /* ---------- 동작 ---------- */
  function res(r, okMsg) { if (!r.ok) { if (r.why) toast(r.why); return false; } if (okMsg) toast(okMsg); return true; }
  function act(a, ds) {
    const P = M.p;

      case 'pass': passModal(); return;

      case 'tool': { if (!M.hasTool(ds.id)) { toolModal(ds.id); return; } const r = M.toggleTool(ds.id); if (res(r)) toast(`${D.TOOLS[ds.id].name} ${r.on ? '들고 가요' : '내려놨어요'}`); break; }
      case 'toolBuy': { const r = M.buyTool(ds.id); if (!r.ok) { if (r.why) toast(r.why); return; } SD.ui.closeModal(); toast(`${D.TOOLS[ds.id].name} 완성! ${r.equipped ? '바로 들고 가요' : '눌러서 바꿔 들 수 있어요'}`); break; }
      case 'adChest': withAd('chest', M.adLeft('chest'), () => { const r = M.adChest(); if (res(r)) showRewards(adTitle('상자 하나 더'), [{ type: 'chest', tier: 'wood', items: r.items }]); }); return;

      case 'ing': selIng = ds.k; break;

      case 'adCoffee': case 'adShard': { const kind = a === 'adCoffee' ? 'coffee' : 'shards', left = kind === 'coffee' ? M.ECON.AD_COFFEE_CAP - P.day.adCoffee : M.adShardLeft(); withAd(kind, left, () => { const r = M.adReward(kind); if (res(r)) showRewards(adTitle('광고 보상'), r.rewards); }); return; }
      case 'shopBuy': res(M.shopBuy(+ds.i), '샀어요!'); break;
      case 'reroll': res(M.shopReroll(), '조각 가게를 새로 채웠어요'); break;

        { const r = M.buyProduct(ds.id); if (res(r)) { closeIfOpen(); showRewards('(테스트) 결제 완료', r.rewards, '#ff9f43'); } break; }

      case 'missions': missionModal(); return;
      case 'mAll': { const r = M.claimAllMissions(); SD.ui.closeModal(); if (res(r)) showRewards('미션 완료', r.rewards, '#a77bf3'); break; }
      case 'mClaim': { const r = M.claimMission(ds.id); SD.ui.closeModal(); if (res(r)) showRewards('미션 완료', r.rewards, '#a77bf3'); break; }
      case 'mail': mailModal(); return;
      case 'sound': SD.ui.modal(`<div class="ribbon" style="background:#2ec4b6">소리</div>${SD.sndToggles()}<div class="btn big" data-close>닫기</div>`, (m) => { SD.bindSnd(m); m.querySelector('[data-close]').onclick = () => { SD.ui.closeModal(); render(); }; }); return;
      case 'mailOne': { const r = M.claimMail(ds.id); SD.ui.closeModal(); if (res(r)) showRewards('우편 받기', r.rewards, '#4aa3ff'); break; }
      case 'mailAll': { const r = M.claimAllMail(); SD.ui.closeModal(); if (r.rewards.length) showRewards('우편 받기', r.rewards, '#4aa3ff'); break; }

    }
    render();
  }
  let swipe = null, swallowClick = false;
  el.addEventListener('pointerdown', (e) => { if (tab !== 'play' || !e.target.closest('.swipezone')) return; swipe = { x: e.clientX, y: e.clientY }; });
  el.addEventListener('pointerup', (e) => {
    if (!swipe) return; const k = (el.getBoundingClientRect().width / 390) || 1;

  });
  el.addEventListener('pointercancel', () => { swipe = null; });
  function bump(dir) { const v = el.querySelector('.stageview'); if (!v) return; v.classList.remove('bump-' + dir); void v.offsetWidth; v.classList.add('bump-' + dir); }
  el.addEventListener('click', (e) => { if (swallowClick) return; const t = e.target.closest('[data-act]'); if (!t || !el.contains(t)) return; act(t.dataset.act, t.dataset); });
  document.addEventListener('keydown', (e) => {

    if (!mv) return; e.preventDefault(); if (moveView(mv[0], mv[1])) render(); else bump(mv[1] ? (mv[1] > 0 ? 'left' : 'right') : (mv[0] > 0 ? 'up' : 'down'));
  });

  /* ---------- 그리기 ---------- */
  function render() {
    M.tick();
    if (tab === 'shop') SD.ads.prepare(['coffee', 'shards', 'chest', 'reroll']); else if (tab === 'kitchen') SD.ads.prepare(['sweep']);
    const body = tab === 'play' ? playTab() : tab === 'ing' ? ingTab() : tab === 'note' ? noteTab_() : tab === 'shop' ? shopTab() : kitchenTab();
    const keep = el.querySelector('.lscroll'); const y = keep ? keep.scrollTop : 0, prevTab = el.dataset.tab;
    el.innerHTML = topbar() + `<div class="lbody">${body}</div>` + tabsHtml();
    el.dataset.tab = tab; slideDir = ''; window.__sdReady = true;
    const sc = el.querySelector('.lscroll'); if (sc && prevTab === tab) sc.scrollTop = y;
  }
  function tickTop() {
    if (el.style.display === 'none') return;

  }
  SD.lobby = {
    show(t) { if (t) tab = t; el.style.display = 'block'; render(); clearInterval(timer); timer = setInterval(tickTop, 1000); },
    hide() { el.style.display = 'none'; clearInterval(timer); },
    render, showRewards, chestHtml, rewardChips, starS, showRank: rankModal, toolArt, get tab() { return tab; },
    // 토스 결제가 끝나 지급됐을 때 · 광고나 상품 준비 상태가 바뀌었을 때 (toss/app/src 에서 부른다)
    purchased(id, rewards) { closeIfOpen(); if (el.style.display === 'block') render(); showRewards('구매 완료', rewards || [], '#ff9f43'); },
    refresh() { if (el.style.display === 'block' && !document.querySelector('#modal.show')) render(); }
  };
})(window);

<script>
/* 싱크대를 부탁해 - 처음 하는 사람 안내
 * 첫 영업에서 순서대로: 소환 → 같은 재료 합성 → 설거지 시작 → 하트 설명 → (때가 되면) 일괄 합성 → 살림 비법
 * 화면을 막지 않고 말풍선 + 강조 테두리 + 손가락만 띄운다. 끝나거나 건너뛰면 프로필에 tut=1 저장 */
(function (g) {
  const SD = g.SD;
  const $ = (s) => document.querySelector(s);
  let el = null, cur = null, stepT = 0;

  const units = (G) => G.cells.map((c, i) => [c, i]).filter(([c]) => c.unit);
  function samePair(G) {
    const us = units(G);
    for (let a = 0; a < us.length; a++) for (let b = a + 1; b < us.length; b++) {
      const x = us[a][0].unit, y = us[b][0].unit;
      if (x.key === y.key && !!x.recipe === !!y.recipe && x.star === y.star && x.star < 4 && x.jam <= 0 && y.jam <= 0) return [us[a][1], us[b][1]];
    }
    return null;
  }
  function giftPair(G) {
    const gs = units(G).filter(([c]) => c.unit.gift && !c.unit.recipe);
    return gs.length >= 2 ? [gs[0][1], gs[1][1]] : null;
  }
  function hybridPair(G) {
    const us = units(G);
    for (let a = 0; a < us.length; a++) for (let b = a + 1; b < us.length; b++) {
      const x = us[a][0].unit, y = us[b][0].unit; if (x.recipe || y.recipe || x.key === y.key) continue;
      const h = G.hybridOf(x, y); if (h && (h.id || h.needBranch != null)) return [us[a][1], us[b][1]];
    }
    return null;
  }

  // 칸에 실제로 그려지는 표시와 같은 모양
  const BADGE = {
    merge: '<svg viewBox="0 0 18 18" width="17" height="17"><circle cx="9" cy="9" r="7.2" fill="#ffd84d" stroke="#3b2f2f" stroke-width="1.6"/><path d="M5.5 10.5L9 7l3.5 3.5" fill="none" stroke="#3b2f2f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    fresh: '<svg viewBox="0 0 18 18" width="17" height="17"><circle cx="9" cy="9" r="7.2" fill="#a77bf3" stroke="#3b2f2f" stroke-width="1.6"/><text x="9" y="13" text-anchor="middle" font-family="Jua" font-size="11" fill="#fff" stroke="#3b2f2f" stroke-width="2.2" paint-order="stroke">?</text></svg>',
    known: '<svg viewBox="0 0 18 18" width="17" height="17"><circle cx="9" cy="9" r="7.2" fill="#ffc93c" stroke="#3b2f2f" stroke-width="1.6"/><path d="M7.5 5v3l-2.5 4.5h8L10.5 8V5z" fill="#fff" stroke="#3b2f2f" stroke-width="1.4" stroke-linejoin="round"/></svg>'
  };
  function hintCell(G) {
    const h = G.hints(); let best = null;
    for (const [i, v] of h) { if (v.recipe) return i; if (v.merge && best == null) best = i; }
    return best;
  }
  // when: 이 단계를 보여줄 조건 / done: 다음으로 넘어갈 조건 / target: 강조할 DOM / pair: 손가락으로 보여줄 칸 두 개
  const STEPS = [
    { id: 'summon', when: () => true, done: (G) => G.stats.summons >= 3, target: '#bSummon', text: () => '<b>소환</b>을 눌러 재료를 불러요' },
    { id: 'merge', when: () => true, done: (G) => units(G).some(([c]) => c.unit.star >= 2), pair: samePair,
      target: (G) => samePair(G) ? null : '#bSummon', text: (G) => samePair(G) ? '<b>같은 재료</b> 둘을 끌어다 겹치면 별이 올라요' : '같은 재료가 나올 때까지 <b>소환</b>해요' },
    { id: 'wave', when: (G) => G.phase === 'ready', done: (G) => G.phase !== 'ready', target: '#bWave', text: () => '준비됐으면 <b>설거지 시작!</b>' },
    { id: 'hearts', when: (G) => G.phase === 'wave', done: (G, t) => t > 5, target: '#hearts', tap: true, text: () => '재료가 지나가는 그릇을 닦아요. 그릇이 끝까지 가면 <b>하트</b>가 줄어요' },
    // 1.3: 선물로 받은 3성 두 개로 첫 비법 만들기 (기본 주방 3스테이지부터 비법이 없으면)
    { id: 'gift', opt: true, revisit: true, when: (G) => !!giftPair(G), done: (G) => G.stats.recipes.length > 0, pair: giftPair, text: () => '선물로 받은 <b>3성 재료</b> 둘을 격쳐 보세요. 서로 다른 3성을 격치면 <b>살림 비법</b>이 생겨요' },
    // 1.3: 수도관·배수구 마개 설명. 쉬는 시간에 띄우고 레일 위 구역을 깜빡인다
    { id: 'tap', opt: true, dev: 'tap', when: (G) => !!G.devices.tap && G.wave >= 1, done: (G, t) => t > 10 || (G.devices.tap && G.devices.tap.active > 0), target: '#dTap', tap: true,
      text: () => '<b>수도관</b>을 누르면 8초 동안 깜빡이는 레일에 물줄기가 흘러요. 지나가는 그릇이 <b>불고</b> 느려져서, 불려야 하는 보스나 소금물 연쇄에 좋아요' },
    { id: 'plug', opt: true, dev: 'plug', when: (G) => !!G.devices.plug && G.wave >= 2, done: (G, t) => t > 10 || (G.devices.plug && G.devices.plug.active > 0), target: '#dPlug', tap: true,
      text: () => '<b>배수구 마개</b>는 5초 동안 깜빡이는 구역을 막아 그릇을 <b>멈춰요</b>. 판마다 3번! 그릇이 몰려올 때나 굴러다니는 보스에 쓰세요' },
    { id: 'bulk', opt: true, when: (G) => G.mergePairs() >= 2, done: (G, t) => G.mergePairs() < 2 || t > 7, target: '#bMerge', tap: true, text: () => '합칠 게 많으면 <b>일괄 합성</b> 한 번이면 돼요' },
    { id: 'hold', opt: true, when: (G) => G.stats.summons >= 6 && G.shine >= G.summonCost() * 5 && G.emptyCells().length >= 3, done: (G, t) => t > 6 || G.shine < G.summonCost() * 2 || !G.emptyCells().length, target: '#bSummon', tap: true, text: () => '<b>소환</b>을 꾹 누르면 연달아 불러요' },
    { id: 'recycle', opt: true, when: (G) => G.canRecycleLow() && G.mergePairs() === 0 && G.shine >= G.summonCost() * 3, done: (G, t) => t > 8 || !G.canRecycleLow(), target: '#bRecycle', tap: true, text: () => '조리대가 꽉 찼으면 <b>재활용</b>으로 1성을 한 번에 비우고 다시 소환해요' },
    { id: 'hints', opt: true, when: (G) => hintCell(G) != null, done: (G, t) => t > 9, tap: true, cell: hintCell,
      text: () => `<div class="tlg"><span>${BADGE.merge}같은 재료 짝</span><span>${BADGE.fresh}새 비법 짝</span><span>${BADGE.known}아는 비법 짝</span></div>칸을 <b>탭</b>하면 짝이 점선으로 보여요` },
    // 첫 비법을 실제로 만들 때까지 끝내지 않는다. 짝이 사라지면 숨었다가 다음에 짝이 생길 때 다시 알려 준다 (revisit)
    { id: 'hybrid', opt: true, revisit: true, when: (G) => !!hybridPair(G), done: (G) => G.stats.recipes.length > 0 || Object.keys((SD.ui && SD.ui.codex && SD.ui.codex.recipes) || {}).length > 0, pair: hybridPair, text: () => '서로 다른 <b>3성 재료</b>를 겹치면 <b>살림 비법</b>이 생겨요' }
  ];

  // 앞 4단계는 순서대로, 뒤 2단계(opt)는 조건이 맞을 때 한 번씩. 진행은 프로필(tutDone)에 저장돼 판을 나가도 이어진다
  const OLD = ['summon', 'merge', 'wave', 'hearts', 'bulk', 'hybrid'];
  const doneSet = () => { const P = SD.meta.p; if (P.tut && !P.tutDone) { P.tutDone = OLD.slice(); SD.meta.save(); } return new Set(P.tutDone || []); };
  const allDone = () => { const d = doneSet(); return STEPS.every(s => d.has(s.id)); };
  function markDone(id) { const P = SD.meta.p, d = doneSet(); d.add(id); P.tutDone = [...d]; if (STEPS.every(s => d.has(s.id))) P.tut = 1; SD.meta.save(); }
  function pick(G) {
    const d = doneSet();
    for (const s of STEPS) if (!s.opt && !d.has(s.id)) { if (s.when(G)) return s; if (s.done(G, 0)) { markDone(s.id); continue; } return null; }
    if (cur && cur.opt && !d.has(cur.id) && (!cur.revisit || cur.when(G))) return cur;   // 보여주기 시작한 단계는 끝날 때까지 유지
    for (const s of STEPS) if (s.opt && !d.has(s.id) && s.when(G)) return s;
    return null;
  }
  function finish() { hide(); const P = SD.meta.p; if (!P) return; P.tut = 1; P.tutDone = STEPS.map(s => s.id); SD.meta.save(); }
  function hide() { if (el) el.style.display = 'none'; }
  function build() {
    el = document.createElement('div'); el.id = 'tut';
    el.innerHTML = `<div class="tring"></div><svg class="thand" viewBox="0 0 40 40" width="40" height="40"><path d="M14 36c-3-4-7-9-7-12 0-2 2-3 4-1l3 3V9a2.5 2.5 0 0 1 5 0v9l1-1a2.5 2.5 0 0 1 4 1l1-1a2.5 2.5 0 0 1 4 1 2.5 2.5 0 0 1 4 1v7c0 5-2 8-4 11z" fill="#fff" stroke="#3b2f2f" stroke-width="2.2" stroke-linejoin="round"/></svg><svg class="tarrow" width="390" height="844"><path d="" fill="none" stroke="#3b2f2f" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/></svg><div class="tbub"><div class="tt"></div><span class="tskip">건너뛰기</span></div>`;
    $('#stage').appendChild(el);
    el.querySelector('.tskip').addEventListener('pointerdown', (e) => { e.stopPropagation(); finish(); });
    el.querySelector('.tbub').addEventListener('pointerdown', () => { if (cur && cur.tap) { markDone(cur.id); cur = null; hide(); } });
  }

  function stageRect(node) {
    const st = $('#stage').getBoundingClientRect(), k = st.width / 390, r = node.getBoundingClientRect();
    return { x: (r.left - st.left) / k, y: (r.top - st.top) / k, w: r.width / k, h: r.height / k };
  }
  function render(G, s) {
    if (!el) build();
    el.style.display = 'block';
    const ring = el.querySelector('.tring'), hand = el.querySelector('.thand'), arrow = el.querySelector('.tarrow'), bub = el.querySelector('.tbub');
    el.querySelector('.tt').innerHTML = s.text(G);
    const tsel = typeof s.target === 'function' ? s.target(G) : s.target;
    const tn = tsel && $(tsel);
    const pair = s.pair && s.pair(G);
    const cell = s.cell && s.cell(G);
    let by, low = false;   // low: 조리대 위 재료를 가리지 않게 말풍선을 조리대 아래(버튼 판 바로 위)에 둔다
    if (tn && tn.offsetParent !== null) {
      const r = stageRect(tn);
      Object.assign(ring.style, { display: 'block', left: (r.x - 5) + 'px', top: (r.y - 5) + 'px', width: (r.w + 10) + 'px', height: (r.h + 10) + 'px' });
      by = r.y > 420 ? r.y - 74 : r.y + r.h + 14;
    } else if (cell != null && G.cells[cell]) {
      const cc = G.cells[cell];
      Object.assign(ring.style, { display: 'block', left: (cc.x - 6) + 'px', top: (cc.y - 6) + 'px', width: '68px', height: '68px' });
      low = true;
    } else ring.style.display = 'none';
    if (pair) {
      const a = G.cells[pair[0]], b = G.cells[pair[1]];
      const mx = (a.cx + b.cx) / 2, my = Math.min(a.cy, b.cy) - 40;
      arrow.style.display = 'block'; arrow.querySelector('path').setAttribute('d', `M${a.cx} ${a.cy}Q${mx} ${my} ${b.cx} ${b.cy}`);
      const p = (performance.now() % 1400) / 1400, q = Math.min(1, p * 1.3), u = 1 - q;
      const hx = u * u * a.cx + 2 * u * q * mx + q * q * b.cx, hy = u * u * a.cy + 2 * u * q * my + q * q * b.cy;
      Object.assign(hand.style, { display: 'block', left: (hx - 12) + 'px', top: (hy - 4) + 'px', opacity: p > 0.85 ? 0 : 1 });
      low = true;
    } else { arrow.style.display = 'none'; hand.style.display = 'none'; }
    if (low) by = 598 - (bub.offsetHeight || 56);
    if (by == null) by = 140;
    bub.style.top = Math.max(60, Math.min(546, by)) + 'px';
  }

  // 실제 흐른 시간으로 센다 (탭이 가려져 rAF가 멈춰도 setInterval로 이어감)
  let lastNow = 0;
  function frame() {
    const now = performance.now(), dt = lastNow ? Math.min(0.25, (now - lastNow) / 1000) : 0; lastNow = now;
    const G = SD.ui && SD.ui.G, P = SD.meta && SD.meta.p;
    const st = SD.ui && SD.ui.state;
    if (st) st.tutHint = null;
    if (!P || allDone() || !G || G.phase === 'end' || $('#modal.show') || $('#lobby').style.display === 'block') { hide(); return; }
    const s = pick(G);
    if (!s) { hide(); return; }
    // 1.3: 덜 급한 안내(opt)는 웨이브 중에 띄우지 않는다. 말풍선이 조리대를 가리지 않게 준비·쉬는 시간에만
    if (s.opt && G.phase === 'wave') { hide(); return; }
    if (st && s.dev) st.tutHint = s.dev;
    if (s !== cur) { cur = s; stepT = 0; }
    stepT += dt;
    if (s.done(G, stepT)) { markDone(s.id); cur = null; hide(); return; }
    render(G, s);
  }
  function raf() { frame(); requestAnimationFrame(raf); }
  requestAnimationFrame(raf);
  setInterval(() => { if (performance.now() - lastNow > 120) frame(); }, 100);
  SD.tutorial = { reset() { const P = SD.meta.p; delete P.tut; delete P.tutDone; SD.meta.save(); cur = null; }, get all() { return STEPS.map(s => s.id); }, get step() { return cur && cur.id; } };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
