      ['missions', '미션', '<path d="M6 4h12v16H6z" fill="#fff" ' + S + '/><path d="M9 9l1.5 1.5L13 8M9 14l1.5 1.5L13 13M15 9h1M15 14h1" ' + S + '/>', M.missionBadge()],
      ['mail', '우편', '<path d="M3 6h18v12H3z" fill="#fff" ' + S + '/><path d="M3 6l9 7 9-7" fill="none" ' + S + '/>', M.p.mail.length > 0],
      ['sound', '소리', '<path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff" ' + S + '/>' + (SD.sound && (SD.sound.sfx || SD.sound.bgm) ? '<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" ' + S + '/>' : '<path d="M16 9l5 6M21 9l-5 6" ' + S + '/>'), false]];
    return `<div class="lside row">${L.map(([a, n, p, dot]) => `<div class="sideb" data-act="${a}"><svg viewBox="0 0 24 24" width="24" height="24">${p}</svg><span class="jua">${n}</span>${dot ? '<span class="dot"></span>' : ''}</div>`).join('')}</div>`;
  }

  /* ---------- 영업 (가운데 카드: 위아래 = 음식점, 좌우 = 스테이지) ---------- */
  let viewStage = null, slideDir = '';
  function bestStage(m) { if (M.p.sel.map === m && M.stageUnlocked(m, M.p.sel.stage)) return M.p.sel.stage; return [5, 4, 3, 2, 1].find(s => M.stageUnlocked(m, s)) || 1; }
  function moveView(dm, ds) {
    const O = D.MAP_ORDER; let i = O.indexOf(viewMap);
    if (dm) { const j = i + dm; if (j < 0 || j >= O.length) return false; viewMap = O[j]; viewStage = bestStage(viewMap); slideDir = dm > 0 ? 'up' : 'down'; }
    if (ds) { const s = viewStage + ds; if (s < 1 || s > 5) return false; viewStage = s; slideDir = ds > 0 ? 'left' : 'right'; }
    if (M.stageUnlocked(viewMap, viewStage)) { M.p.sel = { map: viewMap, stage: viewStage }; M.save(); }
    return true;
  }
  function playTab() {
    const P = M.p;
    if (!viewMap) { viewMap = P.sel.map; viewStage = P.sel.stage; }
    const O = D.MAP_ORDER, mi = O.indexOf(viewMap), map = D.MAPS[viewMap], st = viewStage;
    const mapOpen = M.mapUnlocked(viewMap), open = M.stageUnlocked(viewMap, st);
    const stars = M.starsOf(viewMap, st), first = stars === 0, free = M.isFree(viewMap);
    const boss = M.stageBoss(viewMap, st), bname = (k) => (A.BOSS[k] || {}).name || k;
    const today = D.PAIRS[P.today], known = today && (codex().recipes[today.A] || codex().recipes[today.B]);
    const prev = O[mi - 1], next = O[mi + 1];
    const peek = (m, dir) => m ? `<div class="peek ${dir}" data-act="mv" data-dm="${dir === 'up' ? -1 : 1}"><svg viewBox="0 0 24 24" width="14" height="14"><path d="${dir === 'up' ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6'}" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span style="background:${D.MAPS[m].color}" class="pdot"></span>${D.MAPS[m].name}${M.mapUnlocked(m) ? ` <small>${M.mapStars(m)}/15</small>` : ` <small>${lock(11)}</small>`}</div>` : `<div class="peek ${dir} none"></div>`;
    const dots = [1, 2, 3, 4, 5].map(s => { const so = M.stageUnlocked(viewMap, s), sr = M.starsOf(viewMap, s); return `<div class="sdot ${s === st ? 'on' : ''} ${so ? '' : 'lock'} ${s === 5 ? 'last' : ''}" data-act="stage" data-s="${s}"><b>${so ? s : lock(10)}</b><span>${sr ? '★'.repeat(sr) : ''}</span></div>`; }).join('');
    const arrow = (d) => { const ok = d < 0 ? st > 1 : st < 5; return `<div class="sarrow ${d < 0 ? 'l' : 'r'} ${ok ? '' : 'off'}" data-act="mv" data-ds="${d}"><svg viewBox="0 0 24 24" width="22" height="22"><path d="${d < 0 ? 'M15 5l-7 7 7 7' : 'M9 5l7 7-7 7'}" fill="none" stroke="${INK}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`; };
    const lockMsg = !mapOpen ? `${D.MAPS[prev].name} 5스테이지를 깨면 열려요` : `${mi + 1}-${st - 1} 스테이지를 먼저 깨요`;
    return `<div class="phead"><span class="jua" style="font-size:22px">영업하러 가기</span><div class="hicons">${sideIcons()}</div></div>
      ${peek(prev, 'up')}
      <div class="swipezone">
        <div class="stageview ${slideDir}" style="--mc:${map.color}">
          <img class="sbg" src="${SD.mapImg(viewMap)}" alt="">
          <div class="stop"><span class="maptag" style="background:${map.color}">${mi + 1}장 · ${map.shape}</span><span class="mapstars">${starS(1, 14)} ${M.mapStars(viewMap)}/15</span></div>
          <div class="sinfo">
            <div class="jua sname"><span class="sno" style="background:${map.color}">${mi + 1}-${st}</span>${map.name}</div>
            <div class="jua ssub">${M.stageName(viewMap, st)}</div>
            <div class="bossline">${st === 5 ? `<span class="bossic">${A.boss(map.final, 34)}</span>` : ''}${D.GUEST_COUNT[st] ? `<span class="tag" style="background:#ff9f43">까다로운 손님 ${D.GUEST_COUNT[st]}명</span>` : ''}<span class="tag" style="background:#a77bf3">W7 ${bname(map.mid)}</span><span class="tag" style="background:${boss.lastStrong ? '#a77bf3' : '#ff6b5b'}">W15 ${bname(boss.last)}${boss.lastStrong ? ' 강화' : ''}</span></div>
            <div class="sstars2">${starS(stars > 0, 22)}${starS(stars > 1, 22)}${starS(stars > 2, 22)}</div>
          </div>
          ${open ? '' : `<div class="slock"><div>${lock(30)}</div><div class="jua">${lockMsg}</div></div>`}
        </div>
        ${arrow(-1)}${arrow(1)}
      </div>
      <div class="sdots">${dots}</div>
      ${peek(next, 'down')}
      <div class="lpanel">
        <div class="infoline card" style="padding:7px 10px;margin:0">${first ? `첫 클리어 ${box(M.firstChest(viewMap, st), 22)}${M.CHESTS[M.firstChest(viewMap, st)].name}` : `별 3개 ${box('silver', 22)}은 상자`}
          <span class="todaychip" data-act="today"><span class="tag" style="background:#ff6b5b">오늘</span>${today ? ing(today.a, 18) + (known ? ing(today.b, 18) : '<b class="q">?</b>') : '-'}<small>바꾸기</small></span></div>
        <div style="display:flex;gap:8px;margin-top:8px">
          ${stars >= 3 ? `<div class="btn" style="width:96px;height:58px;flex-direction:column;gap:0" data-act="sweep">소탕<small style="display:flex;align-items:center;gap:2px">${free ? '무료' : coffee(14) + '5'}</small></div>` : ''}
          <div class="btn startbtn ${open ? '' : 'dis'} ${open && !P.stats.plays ? 'pulse' : ''}" data-act="${open ? 'start' : 'lockedStart'}">영업 시작<span>${free ? '연습 주방 · 무료' : coffee(18) + ' 5'}</span></div>
        </div></div>`;
  }

  /* ---------- 재료 ---------- */
  function ingTile(k, sel) {
    const P = M.p, un = M.isUnlocked(k), lv = P.levels[k] || 0;
    const c = un ? M.lvCost(k) : { shards: M.ECON.UNLOCK_SHARDS };
    const ready = c && (P.shards[k] || 0) >= c.shards && (!un || P.tips >= c.tips);
    return `<div class="itile ${sel ? 'sel' : ''} ${un ? '' : 'locked'}" data-act="ing" data-k="${k}"><div class="ia">${ing(k, 30)}</div><div class="ib" style="background:${fam(k).color}">${un ? 'Lv' + lv : '잠김'}</div>${ready ? '<span class="dot"></span>' : ''}</div>`;
  }
  function ingTab() {
    const P = M.p; selIng = selIng || P.deck[0];
    const all = M.allIngs(), deck = P.deck, rest = all.filter(k => !deck.includes(k));
    const famCount = ['acid', 'alk', 'soap', 'water', 'scrub'].map(f => `<span class="fc"><i style="background:${A.FAMILY[f].color}"></i>${deck.filter(k => A.ING[k].family === f).length}</span>`).join('');
    const k = selIng, un = M.isUnlocked(k), lv = P.levels[k] || 0, sp = D.ING[k], c = un ? M.lvCost(k) : null;
    const have = P.shards[k] || 0, need = un ? (c ? c.shards : 0) : M.ECON.UNLOCK_SHARDS;
    const pairs = Object.values(D.PAIRS).filter(p => p.key === k);
    const brs = ['A', 'B'].map(b => { const B = D.BRANCH[k][b], rs = pairs.map(p => `+ ${A.ING[p.a === k ? p.b : p.a].name} → ${codex().recipes[p[b]] ? D.RECIPES[p[b]].name : '???'}`); return `<div class="brcard ${b}"><div><span class="brb">${b}</span><span class="jua">${B.name}</span></div><div class="brd">${B.desc}</div>${rs.map(r => `<div class="brr">${r}</div>`).join('')}</div>`; }).join('');
    return `<div class="lscroll">
      <div class="sec">덱 <small>${deck.length}/8종 · 판에서 소환되는 재료</small><span class="famc">${famCount}</span></div>
      <div class="igrid">${deck.map(x => ingTile(x, x === k)).join('')}${Array.from({ length: 8 - deck.length }, () => '<div class="itile empty"></div>').join('')}</div>
      <div class="sec" style="margin-top:12px">전체 재료 <small>눌러서 보기 · 덱에 넣기</small></div>
      <div class="igrid">${rest.map(x => ingTile(x, x === k)).join('')}</div>
      <div class="card idetail">
        <div style="display:flex;gap:12px;align-items:center">
          <div class="bigicon">${ing(k, 64)}</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px"><span class="jua" style="font-size:23px">${A.ING[k].name}</span><span class="tag" style="background:${fam(k).color};color:${INK}">${fam(k).name} · ${ROLE[sp.role]}</span></div>
            <div style="font-size:12px;font-weight:800;margin-top:3px">${un ? (c ? `Lv ${lv} → ${lv + 1} <span class="dim">위력 +8%</span>` : `Lv ${lv} 최대`) : '아직 없는 재료'} <span class="dim">· 지금 위력 x${M.dmgMul(k).toFixed(2)}</span></div>
            <div style="display:flex;align-items:center;gap:6px;margin-top:6px">${shard(k, 20)}<div class="bar" style="flex:1"><i style="width:${need ? Math.min(100, 100 * have / need) : 100}%;background:#2ec4b6"></i></div><span style="font-size:12px;font-weight:800">${have}/${need || '-'}</span></div>
          </div></div>
        <div class="brrow">${brs}</div>
        <div class="dbtns">
          ${un ? `<div class="btn" data-act="deck" data-k="${k}">${deck.includes(k) ? '덱에서 빼기' : '덱에 넣기'}</div>` : ''}
          ${un ? (c ? `<div class="btn go" data-act="lvup" data-k="${k}">레벨업<span>${tip(14)}${num(c.tips)} · ${shard(k, 14)}${c.shards}</span></div>` : `<div class="btn" style="opacity:.5">최대 레벨</div>`) : `<div class="btn go" data-act="unlock" data-k="${k}">해금<span>${shard(k, 14)}${M.ECON.UNLOCK_SHARDS}</span></div>`}
        </div></div></div>`;
  }

  /* ---------- 비법 노트 ---------- */
  function noteTab_() {
    const cx = codex(), R = D.RECIPES;
    const known = Object.keys(R).filter(k => cx.recipes[k]).length;
    const sub = `<div class="ntabs">${[['recipe', `비법 ${known}/${Object.keys(R).length}`], ['combo', `콤보 ${Object.keys(cx.combos).length}/5`], ['safety', `안전 ${Object.keys(cx.safety || {}).length}/1`]].map(([k, n]) => `<div class="ntab ${noteTab === k ? 'on' : ''}" data-act="note" data-n="${k}">${n}</div>`).join('')}</div>`;
    let body = '';
    if (noteTab === 'recipe') {
      body = Object.entries(D.PAIRS).map(([pid, P]) => `<div class="prow"><div class="pico">${ing(P.a, 26)}<b>+</b>${ing(P.b, 26)}</div>${['A', 'B'].map(b => { const id = P[b], kn = cx.recipes[id]; return `<div class="rcard ${kn ? '' : 'unk'}" data-act="${kn ? 'recipe' : ''}" data-id="${id}"><span class="brb ${b}">${b}</span><span>${kn ? R[id].name : '???'}</span></div>`; }).join('')}</div>`).join('')
        + `<div class="sec" style="margin-top:12px">상위 비법 <small>비법 + 재료 3성, 비법 + 비법</small></div>`
        + Object.entries(R).filter(([, r]) => r.tier > 1).map(([id, r]) => { const kn = cx.recipes[id]; const src = `${A.ING[D.PAIRS[r.src].a].name}+${A.ING[D.PAIRS[r.src].b].name} 비법`; const w = r.with ? A.ING[r.with].name : `${A.ING[D.PAIRS[r.withPair].a].name}+${A.ING[D.PAIRS[r.withPair].b].name} 비법`; return `<div class="t2row ${kn ? '' : 'unk'}" data-act="${kn ? 'recipe' : ''}" data-id="${id}"><span class="tag" style="background:${r.tier === 3 ? '#e8653f' : '#ff9f43'}">${r.tier === 3 ? '최상위' : '상위'}</span><span class="jua">${kn ? r.name : '???'}</span><small>${kn ? `${src} + ${w}` : `${src} + ?`}</small></div>`; }).join('');
    } else if (noteTab === 'combo') {
      const desc = { blast: '산성 + 알칼리 → 범위 세척 + 밀어내기', puddle: '거품 + 불림 → 바닥 거품 장판', shatter: '굳힘 + 연마 → 주변으로 파편', chain: '불림 + 소금 → 옆 그릇으로 연쇄', cloud: '불림 + 과탄산 → 그릇이 구름을 달고 다님' };
      const fxk = { blast: 'burst', puddle: 'puddle', shatter: 'shard', chain: 'crystal', cloud: 'cloud' };
      body = Object.keys(D.COMBOS).map(k => { const kn = cx.combos[k]; return `<div class="t2row ${kn ? '' : 'unk'}"><span class="ii" style="width:40px;height:40px">${kn ? A.fx(fxk[k], 40) : ''}</span><span class="jua">${kn ? D.COMBOS[k].name.replace('!', '') : '???'}</span><small>${kn ? desc[k] : '전투에서 상태를 겹쳐 보세요'}</small></div>`; }).join('');
    } else {
      const kn = cx.safety && cx.safety.bleachAcid;
      body = `<div class="t2row ${kn ? '' : 'unk'}"><span class="tag" style="background:#ff6b5b">금지</span><span class="jua">${kn ? '락스 + 산성 세제' : '???'}</span><small>${kn ? '절대 섞으면 안 돼요. 유독한 염소 가스가 나와요' : '위험한 조합을 시도하면 기록돼요'}</small></div>
        <div class="t2row"><span class="tag" style="background:#ff9f43">주의</span><span class="jua">철수세미 + 코팅 팬</span><small>코팅 팬은 철수세미로 닦으면 코팅이 벗겨져요</small></div>`;
    }
    return `<div class="lscroll notebook">${sub}${body}</div>`;
  }
  function recipeModal(id) {

      ${r.tier === 1 ? `<div class="lbl center dim">${A.ING[D.PAIRS[r.pair].key].name} 분기 ${r.branch}로 교잡</div>` : ''}<div class="note pen">${r.tip}</div><div class="btn big" data-close>닫기</div>`, bindModal);
  }

        ${WEB ? '' : `<div class="card fcard ${d.adCoffee >= E.AD_COFFEE_CAP ? 'used' : ''}" data-act="adCoffee">${coffee(44)}<span class="jua">커피 +${E.AD_COFFEE}</span>${adBtn(E.AD_COFFEE_CAP, E.AD_COFFEE_CAP - d.adCoffee)}</div>

    </div>`;
  }

    const sweeps = []; for (const m of D.MAP_ORDER) for (let s = 1; s <= 5; s++) if (M.starsOf(m, s) >= 3) sweeps.push([m, s]);

      </div>
      <div class="sec" style="margin-top:14px">소탕 <small>별 3개 스테이지 · 바로 보상 (나무 상자)</small></div>
      ${sweeps.length ? sweeps.map(([m, s]) => `<div class="t2row"><span class="tag" style="background:${D.MAPS[m].color}">${D.MAPS[m].name}</span><span class="jua">${D.MAP_ORDER.indexOf(m) + 1}-${s} ${M.stageName(m, s)}</span><div class="btn sm" style="margin-left:auto;width:auto;padding:0 10px;flex-direction:row;gap:3px;white-space:nowrap" data-act="sweepAt" data-m="${m}" data-s="${s}">소탕 ${M.isFree(m) ? '무료' : coffee(14) + '5'}</div></div>`).join('') : `<div class="lbl dim" style="margin-top:8px">아직 별 3개 스테이지가 없어요. 만족도를 16 이상 남기고 클리어하면 별 3개예요.</div>`}
    </div>`;
  }

  /* ---------- 출석 · 미션 · 우편 ---------- */
  const itemText = (it) => [it.coffee ? `${coffee(16)}${it.coffee}` : '', it.tips ? `${tip(16)}${num(it.tips)}` : '', it.chest ? `${box(it.chest, 18)}${M.CHESTS[it.chest].name}` : ''].filter(Boolean).join(' ');
  function attendModal() {
    const st = M.attendState();
    SD.ui.modal(`<div class="ribbon" style="background:#ffc93c;color:${INK};text-shadow:none">출석 보상</div>
      <div class="att">${M.ATTEND.map((a, i) => `<div class="attd ${i < st.idx || (st.claimedToday && i === st.idx) ? 'got' : ''} ${i === st.idx && !st.claimedToday ? 'now' : ''}"><b>${i + 1}일</b><div>${itemText(a)}</div></div>`).join('')}</div>
      <div class="btn big" data-act="${st.claimedToday ? '' : 'attendClaim'}" ${st.claimedToday ? 'data-close' : ''}>${st.claimedToday ? '내일 또 와요' : '받기'}</div>`, bindModal);
  }
  function missionModal() {
    SD.ui.modal(`<div class="ribbon" style="background:#a77bf3">오늘의 미션</div>${M.missionState().map(ms => `<div class="mrow"><div style="flex:1"><div class="jua" style="font-size:15px">${ms.name}</div><div class="bar" style="margin-top:4px"><i style="width:${Math.round(100 * ms.prog / ms.goal)}%;background:#a77bf3"></i></div><small class="dim">${ms.prog}/${ms.goal} · ${itemText(ms.reward)}</small></div><div class="btn sm ${ms.done && !ms.claimed ? 'go' : ''}" style="width:72px" data-act="${ms.done && !ms.claimed ? 'mClaim' : ''}" data-id="${ms.id}">${ms.claimed ? '완료' : ms.done ? '받기' : '진행 중'}</div></div>`).join('')}${M.missionBadge() ? '<div class="btn big go" data-act="mAll">모두 받기</div>' : '<div class="btn big" data-close>닫기</div>'}`, bindModal);
  }
  function mailModal() {
    const L = M.p.mail;
    SD.ui.modal(`<div class="ribbon" style="background:#4aa3ff">우편함</div>${L.length ? L.map(m => `<div class="mrow"><div style="flex:1"><div class="jua" style="font-size:15px">${m.title}</div><small class="dim">${m.body || ''}</small><div style="font-size:12px;font-weight:800;margin-top:3px">${itemText(m.items)}</div></div><div class="btn sm go" style="width:64px" data-act="mailOne" data-id="${m.id}">받기</div></div>`).join('') + '<div class="btn big" data-act="mailAll">모두 받기</div>' : '<div class="lbl center dim" style="padding:20px 0">우편이 없어요</div><div class="btn big" data-close>닫기</div>'}`, bindModal);
  }

  /* ---------- 동작 ---------- */
  function res(r, okMsg) { if (!r.ok) { if (r.why) toast(r.why); return false; } if (okMsg) toast(okMsg); return true; }
  function act(a, ds) {
    const P = M.p;
    switch (a) {
      case 'tab': tab = ds.t; break;
      case 'goShop': tab = 'shop'; break;
      case 'mv': if (!moveView(+(ds.dm || 0), +(ds.ds || 0))) return; break;
      case 'stage': { const s = +ds.s; if (s === viewStage) return; moveView(0, s - viewStage); break; }
      case 'lockedStart': toast('아직 잠긴 스테이지예요'); return;
      case 'today': { const t = M.cycleToday(); if (!t) toast('덱에 비법 짝이 되는 재료가 없어요'); break; }
      case 'start': SD.ui.startRun(P.sel.map, P.sel.stage); return;
      case 'sweep': case 'sweepAt': { const m = ds.m || viewMap, s = +(ds.s || viewStage); const r = M.sweep(m, s); if (res(r)) { SD.ui.closeModal(); showRewards('소탕 완료', r.rewards); } else if (r.coffee) tab = 'shop'; break; }
      case 'ing': selIng = ds.k; break;
      case 'deck': res(M.toggleDeck(ds.k)); break;
      case 'lvup': res(M.levelUp(ds.k), `${A.ING[ds.k].name} 레벨업!`); break;
      case 'unlock': res(M.unlock(ds.k), `${A.ING[ds.k].name} 해금! 덱에 넣어 보세요`); break;
      case 'note': noteTab = ds.n; break;
      case 'recipe': if (ds.id) recipeModal(ds.id); return;
      case 'free': { const r = M.freeChest(); if (res(r)) showRewards('무료 상자', [{ type: 'chest', tier: 'wood', items: r.items }]); break; }
      case 'adCoffee': case 'adTip': if (window.SD_PLATFORM === 'web') return; { const r = M.adReward(a === 'adCoffee' ? 'coffee' : 'tips'); if (res(r)) showRewards(P.adFree ? '광고 보상' : '광고 보상 (테스트 광고)', r.rewards); break; }
      case 'shopBuy': res(M.shopBuy(+ds.i), '샀어요!'); break;
      case 'reroll': res(M.shopReroll(), '조각 가게를 새로 채웠어요'); break;
      case 'buy': if (window.SD_PLATFORM === 'web') return; { const r = M.buyProduct(ds.id); if (res(r)) showRewards('(테스트) 결제 완료', r.rewards, '#ff9f43'); break; }
      case 'odds': oddsModal(ds.tier); return;
      case 'kCollect': { const r = M.kitchenCollect(); if (res(r)) toast(`팁 +${num(r.rewards[0].n)}`); break; }
      case 'kUp': res(M.kitchenUp(), '주방 확장!'); break;
      case 'attend': attendModal(); return;
      case 'attendClaim': { const r = M.claimAttend(); SD.ui.closeModal(); if (res(r)) showRewards(`출석 ${r.day}일째`, r.rewards, '#ffc93c'); break; }
      case 'missions': missionModal(); return;
      case 'mAll': { const r = M.claimAllMissions(); SD.ui.closeModal(); if (res(r)) showRewards('미션 완료', r.rewards, '#a77bf3'); break; }
      case 'mClaim': { const r = M.claimMission(ds.id); SD.ui.closeModal(); if (res(r)) showRewards('미션 완료', r.rewards, '#a77bf3'); break; }
      case 'mail': mailModal(); return;
      case 'sound': SD.ui.modal(`<div class="ribbon" style="background:#2ec4b6">소리</div>${SD.sndToggles()}<div class="btn big" data-close>닫기</div>`, (m) => { SD.bindSnd(m); m.querySelector('[data-close]').onclick = () => { SD.ui.closeModal(); render(); }; }); return;
      case 'mailOne': { const r = M.claimMail(ds.id); SD.ui.closeModal(); if (res(r)) showRewards('우편 받기', r.rewards, '#4aa3ff'); break; }
      case 'mailAll': { const r = M.claimAllMail(); SD.ui.closeModal(); if (r.rewards.length) showRewards('우편 받기', r.rewards, '#4aa3ff'); break; }
      default: return;
    }
    render();
  }
  let swipe = null, swallowClick = false;
  el.addEventListener('pointerdown', (e) => { if (tab !== 'play' || !e.target.closest('.swipezone')) return; swipe = { x: e.clientX, y: e.clientY }; });
  el.addEventListener('pointerup', (e) => {
    if (!swipe) return; const k = (el.getBoundingClientRect().width / 390) || 1;
    const dx = (e.clientX - swipe.x) / k, dy = (e.clientY - swipe.y) / k; swipe = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 36) return;
    swallowClick = true; setTimeout(() => swallowClick = false, 50);
    const ok = Math.abs(dx) > Math.abs(dy) ? moveView(0, dx < 0 ? 1 : -1) : moveView(dy < 0 ? 1 : -1, 0);
    if (ok) render(); else bump(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down'));
  });
  el.addEventListener('pointercancel', () => { swipe = null; });
  function bump(dir) { const v = el.querySelector('.stageview'); if (!v) return; v.classList.remove('bump-' + dir); void v.offsetWidth; v.classList.add('bump-' + dir); }
  el.addEventListener('click', (e) => { if (swallowClick) return; const t = e.target.closest('[data-act]'); if (!t || !el.contains(t)) return; act(t.dataset.act, t.dataset); });
  document.addEventListener('keydown', (e) => {
    if (el.style.display === 'none' || tab !== 'play' || document.querySelector('#modal.show')) return;
    const mv = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] }[e.key];
    if (!mv) return; e.preventDefault(); if (moveView(mv[0], mv[1])) render(); else bump(mv[1] ? (mv[1] > 0 ? 'left' : 'right') : (mv[0] > 0 ? 'up' : 'down'));
  });

  /* ---------- 그리기 ---------- */
  function render() {
    M.tick();
    const body = tab === 'play' ? playTab() : tab === 'ing' ? ingTab() : tab === 'note' ? noteTab_() : tab === 'shop' ? shopTab() : kitchenTab();
    const keep = el.querySelector('.lscroll'); const y = keep ? keep.scrollTop : 0, prevTab = el.dataset.tab;
    el.innerHTML = topbar() + `<div class="lbody">${body}</div>` + tabsHtml();
    el.dataset.tab = tab; slideDir = ''; window.__sdReady = true;
    const sc = el.querySelector('.lscroll'); if (sc && prevTab === tab) sc.scrollTop = y;
  }
  function tickTop() {
    if (el.style.display === 'none') return;
    M.tick(); const P = M.p, n = M.coffeeNextMs();
    const c = el.querySelector('#lCoffee'), t = el.querySelector('#lCoffeeT');
    if (c) c.innerHTML = `${P.coffee}<small style="font-size:12px;opacity:.5">/${M.coffeeMax()}</small>`;
    if (t) t.textContent = n ? '+1 · ' + mmss(n) : '가득';
    const s = el.querySelector('#lShopT'); if (s) s.textContent = mmss(M.shopNextMs()) + ' 뒤 바뀜';
    const k = el.querySelector('#lKitchen'); if (k) k.textContent = num(M.kitchenPending().tips);
  }
  SD.lobby = {
    show(t) { if (t) tab = t; el.style.display = 'block'; render(); clearInterval(timer); timer = setInterval(tickTop, 1000); },
    hide() { el.style.display = 'none'; clearInterval(timer); },
    render, showRewards, chestHtml, rewardChips, starS, get tab() { return tab; }
  };
})(window);

</script>
<script>
/* 싱크대 수비대 - 처음 하는 사람 안내
 * 첫 영업에서 순서대로: 소환 → 같은 재료 합성 → 설거지 시작 → 하트 설명 → (때가 되면) 일괄 합성 → 살림 비법
 * 화면을 막지 않고 말풍선 + 강조 테두리 + 손가락만 띄운다. 끝나거나 건너뛰면 프로필에 tut=1 저장 */
(function (g) {
  const SD = g.SD;
  const $ = (s) => document.querySelector(s);
  let el = null, cur = null, stepT = 0;

  const units = (G) => G.cells.map((c, i) => [c, i]).filter(([c]) => c.unit);
  function samePair(G) {
    const us = units(G);
    for (let a = 0; a < us.length; a++) for (let b = a + 1; b < us.length; b++) {
      const x = us[a][0].unit, y = us[b][0].unit;
      if (x.key === y.key && !!x.recipe === !!y.recipe && x.star === y.star && x.star < 4 && x.jam <= 0 && y.jam <= 0) return [us[a][1], us[b][1]];
    }
    return null;
  }
  function hybridPair(G) {
    const us = units(G);
    for (let a = 0; a < us.length; a++) for (let b = a + 1; b < us.length; b++) {
      const x = us[a][0].unit, y = us[b][0].unit; if (x.recipe || y.recipe || x.key === y.key) continue;
      const h = G.hybridOf(x, y); if (h && (h.id || h.needBranch != null)) return [us[a][1], us[b][1]];
    }
    return null;
  }

  // 칸에 실제로 그려지는 표시와 같은 모양
  const BADGE = {
    merge: '<svg viewBox="0 0 18 18" width="17" height="17"><circle cx="9" cy="9" r="7.2" fill="#ffd84d" stroke="#3b2f2f" stroke-width="1.6"/><path d="M5.5 10.5L9 7l3.5 3.5" fill="none" stroke="#3b2f2f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    fresh: '<svg viewBox="0 0 18 18" width="17" height="17"><circle cx="9" cy="9" r="7.2" fill="#a77bf3" stroke="#3b2f2f" stroke-width="1.6"/><text x="9" y="13" text-anchor="middle" font-family="Jua" font-size="11" fill="#fff" stroke="#3b2f2f" stroke-width="2.2" paint-order="stroke">?</text></svg>',
    known: '<svg viewBox="0 0 18 18" width="17" height="17"><circle cx="9" cy="9" r="7.2" fill="#ffc93c" stroke="#3b2f2f" stroke-width="1.6"/><path d="M7.5 5v3l-2.5 4.5h8L10.5 8V5z" fill="#fff" stroke="#3b2f2f" stroke-width="1.4" stroke-linejoin="round"/></svg>'
  };
  function hintCell(G) {
    const h = G.hints(); let best = null;
    for (const [i, v] of h) { if (v.recipe) return i; if (v.merge && best == null) best = i; }
    return best;
  }
  // when: 이 단계를 보여줄 조건 / done: 다음으로 넘어갈 조건 / target: 강조할 DOM / pair: 손가락으로 보여줄 칸 두 개
  const STEPS = [
    { id: 'summon', when: () => true, done: (G) => G.stats.summons >= 3, target: '#bSummon', text: () => '<b>소환</b>을 눌러 재료를 불러요' },
    { id: 'merge', when: () => true, done: (G) => units(G).some(([c]) => c.unit.star >= 2), pair: samePair,
      target: (G) => samePair(G) ? null : '#bSummon', text: (G) => samePair(G) ? '<b>같은 재료</b> 둘을 끌어다 겹치면 별이 올라요' : '같은 재료가 나올 때까지 <b>소환</b>해요' },
    { id: 'wave', when: (G) => G.phase === 'ready', done: (G) => G.phase !== 'ready', target: '#bWave', text: () => '준비됐으면 <b>설거지 시작!</b>' },
    { id: 'hearts', when: (G) => G.phase === 'wave', done: (G, t) => t > 5, target: '#hearts', tap: true, text: () => '재료가 지나가는 그릇을 닦아요. 그릇이 끝까지 가면 <b>하트</b>가 줄어요' },
    { id: 'bulk', opt: true, when: (G) => G.mergePairs() >= 2, done: (G, t) => G.mergePairs() < 2 || t > 7, target: '#bMerge', tap: true, text: () => '합칠 게 많으면 <b>일괄 합성</b> 한 번이면 돼요' },
    { id: 'hints', opt: true, when: (G) => hintCell(G) != null, done: (G, t) => t > 9, tap: true, cell: hintCell,
      text: () => `<div class="tlg"><span>${BADGE.merge}같은 재료 짝</span><span>${BADGE.fresh}새 비법 짝</span><span>${BADGE.known}아는 비법 짝</span></div>칸을 <b>탭</b>하면 짝이 점선으로 보여요` },
    { id: 'hybrid', opt: true, when: (G) => !!hybridPair(G), done: (G, t) => G.stats.recipes.length > 0 || (!hybridPair(G) && t > 1), pair: hybridPair, text: () => '서로 다른 <b>3성 재료</b>를 겹치면 <b>살림 비법</b>이 생겨요' }
  ];

  // 앞 4단계는 순서대로, 뒤 2단계(opt)는 조건이 맞을 때 한 번씩. 진행은 프로필(tutDone)에 저장돼 판을 나가도 이어진다
  const OLD = ['summon', 'merge', 'wave', 'hearts', 'bulk', 'hybrid'];
  const doneSet = () => { const P = SD.meta.p; if (P.tut && !P.tutDone) { P.tutDone = OLD.slice(); SD.meta.save(); } return new Set(P.tutDone || []); };
  const allDone = () => { const d = doneSet(); return STEPS.every(s => d.has(s.id)); };
  function markDone(id) { const P = SD.meta.p, d = doneSet(); d.add(id); P.tutDone = [...d]; if (STEPS.every(s => d.has(s.id))) P.tut = 1; SD.meta.save(); }
  function pick(G) {
    const d = doneSet();
    for (const s of STEPS) if (!s.opt && !d.has(s.id)) { if (s.when(G)) return s; if (s.done(G, 0)) { markDone(s.id); continue; } return null; }
    if (cur && cur.opt && !d.has(cur.id)) return cur;   // 보여주기 시작한 단계는 끝날 때까지 유지
    for (const s of STEPS) if (s.opt && !d.has(s.id) && s.when(G)) return s;
    return null;
  }
  function finish() { hide(); const P = SD.meta.p; if (!P) return; P.tut = 1; P.tutDone = STEPS.map(s => s.id); SD.meta.save(); }
  function hide() { if (el) el.style.display = 'none'; }
  function build() {
    el = document.createElement('div'); el.id = 'tut';
    el.innerHTML = `<div class="tring"></div><svg class="thand" viewBox="0 0 40 40" width="40" height="40"><path d="M14 36c-3-4-7-9-7-12 0-2 2-3 4-1l3 3V9a2.5 2.5 0 0 1 5 0v9l1-1a2.5 2.5 0 0 1 4 1l1-1a2.5 2.5 0 0 1 4 1 2.5 2.5 0 0 1 4 1v7c0 5-2 8-4 11z" fill="#fff" stroke="#3b2f2f" stroke-width="2.2" stroke-linejoin="round"/></svg><svg class="tarrow" width="390" height="844"><path d="" fill="none" stroke="#3b2f2f" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/></svg><div class="tbub"><div class="tt"></div><span class="tskip">건너뛰기</span></div>`;
    $('#stage').appendChild(el);
    el.querySelector('.tskip').addEventListener('pointerdown', (e) => { e.stopPropagation(); finish(); });
    el.querySelector('.tbub').addEventListener('pointerdown', () => { if (cur && cur.tap) { markDone(cur.id); cur = null; hide(); } });
  }

  function stageRect(node) {
    const st = $('#stage').getBoundingClientRect(), k = st.width / 390, r = node.getBoundingClientRect();
    return { x: (r.left - st.left) / k, y: (r.top - st.top) / k, w: r.width / k, h: r.height / k };
  }
  function render(G, s) {
    if (!el) build();
    el.style.display = 'block';
    const ring = el.querySelector('.tring'), hand = el.querySelector('.thand'), arrow = el.querySelector('.tarrow'), bub = el.querySelector('.tbub');
    el.querySelector('.tt').innerHTML = s.text(G);
    const tsel = typeof s.target === 'function' ? s.target(G) : s.target;
    const tn = tsel && $(tsel);
    const pair = s.pair && s.pair(G);
    const cell = s.cell && s.cell(G);
    let by;
    if (tn && tn.offsetParent !== null) {
      const r = stageRect(tn);
      Object.assign(ring.style, { display: 'block', left: (r.x - 5) + 'px', top: (r.y - 5) + 'px', width: (r.w + 10) + 'px', height: (r.h + 10) + 'px' });
      by = r.y > 420 ? r.y - 74 : r.y + r.h + 14;
    } else if (cell != null && G.cells[cell]) {
      const cc = G.cells[cell];
      Object.assign(ring.style, { display: 'block', left: (cc.x - 6) + 'px', top: (cc.y - 6) + 'px', width: '68px', height: '68px' });
      by = cc.y > 330 ? cc.y - 120 : cc.y + 70;
    } else ring.style.display = 'none';
    if (pair) {
      const a = G.cells[pair[0]], b = G.cells[pair[1]];
      const mx = (a.cx + b.cx) / 2, my = Math.min(a.cy, b.cy) - 40;
      arrow.style.display = 'block'; arrow.querySelector('path').setAttribute('d', `M${a.cx} ${a.cy}Q${mx} ${my} ${b.cx} ${b.cy}`);
      const p = (performance.now() % 1400) / 1400, q = Math.min(1, p * 1.3), u = 1 - q;
      const hx = u * u * a.cx + 2 * u * q * mx + q * q * b.cx, hy = u * u * a.cy + 2 * u * q * my + q * q * b.cy;
      Object.assign(hand.style, { display: 'block', left: (hx - 12) + 'px', top: (hy - 4) + 'px', opacity: p > 0.85 ? 0 : 1 });
      by = Math.max(a.cy, b.cy) + 46 > 560 ? Math.min(a.cy, b.cy) - 110 : Math.max(a.cy, b.cy) + 46;
    } else { arrow.style.display = 'none'; hand.style.display = 'none'; }
    if (by == null) by = 140;
    bub.style.top = Math.max(60, Math.min(540, by)) + 'px';
  }

  // 실제 흐른 시간으로 센다 (탭이 가려져 rAF가 멈춰도 setInterval로 이어감)
  let lastNow = 0;
  function frame() {
    const now = performance.now(), dt = lastNow ? Math.min(0.25, (now - lastNow) / 1000) : 0; lastNow = now;
    const G = SD.ui && SD.ui.G, P = SD.meta && SD.meta.p;
    if (!P || allDone() || !G || G.phase === 'end' || $('#modal.show') || $('#lobby').style.display === 'block') { hide(); return; }
    const s = pick(G);
    if (!s) { hide(); return; }
    if (s !== cur) { cur = s; stepT = 0; }
    stepT += dt;
    if (s.done(G, stepT)) { markDone(s.id); cur = null; hide(); return; }
    render(G, s);
  }
