<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--ink:#3b2f2f;--paper:#fffdf7;--cream:#fff8ec}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#2b2320;font-family:"Pretendard","Malgun Gothic",sans-serif;color:var(--ink);touch-action:none}

  .ii{display:inline-flex;align-items:center;justify-content:center;flex:none}.ii svg{display:block}
  /* top */

  .tok i{font-style:normal;font-size:11px;opacity:.8}.tok.on{border-color:var(--ink);color:var(--ink);box-shadow:0 2px 0 var(--ink)}
  /* tray */

  #next{display:flex;flex-direction:column;gap:3px}.mini{display:flex;width:26px;height:26px;border:2px solid var(--ink);border-radius:7px;background:#fff8ec;align-items:center;justify-content:center}
  .badge{position:absolute;top:-9px;right:-7px;background:#ff6b5b;color:#fff;font-family:Jua;font-size:12px;border:2px solid var(--ink);border-radius:999px;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center}

  .lbl{font-size:13px;font-weight:800}.center{text-align:center}
  .deck{display:flex;gap:5px;justify-content:space-between}.tile{position:relative;width:38px;height:44px;border:2px solid var(--ink);border-radius:8px;background:var(--cream);overflow:hidden;display:flex;justify-content:center;padding-top:1px}.tile .bar{position:absolute;left:0;right:0;bottom:0;height:6px;border-top:1.5px solid var(--ink)}
  .recipes{display:grid;grid-template-columns:1fr 1fr;gap:6px}.rcp{display:flex;align-items:center;gap:3px;border:2px solid var(--ink);border-radius:9px;padding:4px 6px;background:#fff;font-weight:800;font-size:12.5px;cursor:pointer}.rcp.sel{background:#fff6b8;box-shadow:0 0 0 3px #ffc93c}
  .btn.big{height:52px;background:#ffc93c;font-size:20px;flex-direction:row}
  .rule{display:flex;gap:12px;align-items:center;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:10px;cursor:pointer;background:#fff}

  .rn{font-size:21px}.good,.bad{font-size:13px;font-weight:800;margin-top:4px;display:flex;gap:5px;align-items:flex-start}.good{color:#2e7d43}.bad{color:#c43c3c}
  .good span,.bad span{flex:none;font-family:Jua;font-weight:400;font-size:11.5px;color:#fff;border:1.6px solid var(--ink);border-radius:5px;padding:0 4px}.good span{background:#5cc96b}.bad span{background:#ff6b5b}
  .pair{display:flex;align-items:center;justify-content:center;gap:10px;font-family:Jua;font-size:24px}
  .note{background:#fff6b8;border:2px solid var(--ink);border-radius:4px;padding:8px 12px;font-size:22px;line-height:1.2;transform:rotate(-1deg);box-shadow:0 3px 0 var(--ink)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;font-size:12px;font-weight:800}.stats b{display:block;font-family:Jua;font-weight:400;font-size:28px}
  .maps{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.mapc{border:2px solid var(--ink);border-radius:9px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px 5px;cursor:pointer;font-size:10px;font-weight:800;text-align:center}.mapc b{font-family:Jua;font-weight:400;font-size:12px;color:#fff;border:1.5px solid var(--ink);border-radius:5px;padding:0 4px;white-space:nowrap}.mapc i{font-style:normal;color:#e8a100;font-size:9px;letter-spacing:-1px}.mapc.sel{background:#fff6b8;box-shadow:0 0 0 3px #ffc93c}
  #chalk{cursor:pointer}
  #r3{gap:6px!important}.dev .t{font-size:12px!important}
  .chipr{font-family:Jua;font-size:15px;border:2px solid var(--ink);border-radius:9px;background:#fff1b8;padding:6px 10px;box-shadow:0 2px 0 var(--ink)}

  .ltab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:Jua;font-size:13px;border-radius:12px;position:relative;opacity:.65;cursor:pointer}

  .mchips{display:flex;gap:5px;margin:6px 0 8px;flex-wrap:wrap}

  .sstars{position:absolute;display:flex}
  .lpanel{position:absolute;left:14px;right:14px;bottom:8px}
  .stagecard{padding:10px 12px}
  .bossline{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
  .infoline{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:12px;font-weight:800;flex-wrap:wrap}

  const WAVES = 15, MID_WAVE = 7;
  const STAGE_MUL = [1, 0.75, 0.82, 0.93, 1.0, 1.0];   // 까다로운 손님(2~5스테이지) 반영, 10웨이브 보스를 없앤 뒤 다시 맞춤. 예전 0.75/0.85/1.0/1.1/1.2   // 2026-10-22: 까다로운 손님(2~5스테이지)이 붙는 만큼 체력 배율을 낮춤. 예전 0.75/0.85/1.0/1.1/1.2. 시뮬(Lv3, 30판)로 스테이지가 오를수록 승률이 내려가게 맞춤
  const HPK = (typeof process !== 'undefined' && process.env && +process.env.SD_HPK) || 0.85;
  function waveSpec(w, map, stage = 5) {
    const x = 1 + (w - 1) * 9 / (WAVES - 1);
    const count = 7 + Math.round(x * 1.6);
    const hpMul = HPK * (1 + 0.38 * (x - 1) + 0.06 * (x - 1) * (x - 1)) * (map.hpMul || 1) * (STAGE_MUL[stage] || 1);
    const last = w === WAVES;
    const boss = w === MID_WAVE ? map.mid : last ? (stage >= 5 ? map.final : map.mid) : null;
    const bossMul = (last && stage < 5) ? 1.8 : 1;
    const bossLabel = !boss ? '' : w === MID_WAVE ? '중간 보스' : stage >= 5 ? '최종 보스' : '마지막 보스';
    return { pool: map.pool(Math.round(x)), count: boss ? Math.round(count * 0.6) : count, hpMul, boss, bossMul, bossLabel, duration: 12 };

    // 교잡 결과: {id} | {needBranch:'a'|'b'} | {forbidden} | {none} | null(교잡 대상 아님)

        }
      }
      // 랩 보호막: 1.5초마다 주변 그릇에 다시 씌움
      for (const s of shieldSrc) { s.shieldT = (s.shieldT || 0) - dt; if (s.shieldT <= 0) { s.shieldT = 1.5; const p = pos(s); for (const o of near(p, 70, s)) if (!DATA.DISHES[o.type].boss) o.shield = 1; } }

<script>
/* 싱크대 수비대 - 캔버스 렌더러 */

  /* ---------- 그리기 도우미 ---------- */
  function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  function outlinedText(ctx, text, x, y, size, fill, stroke = INK, w = 5) { ctx.font = `${size}px Jua, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.lineWidth = w; ctx.strokeStyle = stroke; ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y); }

      ctx.beginPath(); ctx.moveTo(W.x, W.y - 9); ctx.quadraticCurveTo(W.x + 8, W.y - 2, W.x + 6, W.y + 5); ctx.quadraticCurveTo(W.x, W.y + 10, W.x - 6, W.y + 5); ctx.quadraticCurveTo(W.x - 8, W.y - 1, W.x - 2, W.y - 4); ctx.quadraticCurveTo(W.x, W.y - 2, W.x, W.y - 9); ctx.closePath(); ctx.fillStyle = '#fff3c4'; ctx.fill(); ctx.lineWidth = 1.6; ctx.strokeStyle = INK; ctx.stroke();

  }

  function drawCell(ctx, G, c, i, ui) {
    const D = SD.DATA;
    if (c.locked) {
      rr(ctx, c.x, c.y, 56, 56, 12); ctx.fillStyle = 'rgba(255,248,236,0.4)'; ctx.fill();
      ctx.setLineDash([5, 4]); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(59,47,47,0.4)'; ctx.stroke(); ctx.setLineDash([]);

        ctx.font = '10px Jua'; ctx.fillStyle = R.tier > 1 ? '#c2410c' : '#b5651d'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(R.tier === 3 ? '최상위' : R.tier === 2 ? '비법+' : '비법', c.cx, c.y + 7);

        ctx.strokeStyle = '#ffd84d'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(c.x + 8, c.y + 8); ctx.quadraticCurveTo(c.x + 14, c.y + 16, c.x + 10, c.y + 24); ctx.moveTo(c.x + 42, c.y + 6); ctx.quadraticCurveTo(c.x + 38, c.y + 14, c.x + 44, c.y + 20); ctx.stroke(); ctx.lineCap = 'butt';

      ctx.fillStyle = INK; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(name, c.x, c.y);

  function drawDish(ctx, G, d) {
    const D = SD.DATA, ds = D.DISHES[d.type];
    const p = G.dishPos(d);
    const boss = !!ds.boss, s = boss ? 64 : (d.type === 'spore' || d.type === 'banchan' ? 26 : d.type.startsWith('sushi') ? 30 : 34);
    if (d.cloud > 0) { ctx.globalAlpha = Math.min(1, d.cloud) * 0.85; ctx.drawImage(img('fx', 'cloud'), p.x - 40, p.y - 44, 80, 80); ctx.globalAlpha = 1; }
    const jx = d.hitT > 0 ? (Math.random() - 0.5) * 2 : 0;
    ctx.globalAlpha = 0.25; ctx.fillStyle = INK; ctx.beginPath(); ctx.ellipse(p.x, p.y + s / 2 - 1, s * 0.38, 3, 0, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    ctx.drawImage(boss ? img('boss', d.type) : img('dish', d.type), p.x - s / 2 + jx, p.y - s / 2, s, s);

    const w = boss ? 56 : s * 0.85, f = Math.max(0, d.hp / d.max);
    rr(ctx, p.x - w / 2, p.y + s / 2 + 2, w, 6, 3); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 1.4; ctx.strokeStyle = INK; ctx.stroke();
    ctx.fillStyle = boss ? '#ff6b5b' : '#8b6b4a'; ctx.fillRect(p.x - w / 2 + 1, p.y + s / 2 + 3, (w - 2) * f, 4);
    if (ds.tiers) { const tier = ds.tiers[Math.min(2, Math.floor((1 - d.hp / d.max) * 3))]; rr(ctx, p.x + 18, p.y - 36, 16, 12, 4); ctx.fillStyle = FAMC[tier]; ctx.fill(); ctx.lineWidth = 1.6; ctx.strokeStyle = INK; ctx.stroke(); }
    const sts = Object.keys(d.st).filter(k => d.st[k] > 0);
    sts.forEach((k, i) => { const x = p.x + (i - (sts.length - 1) / 2) * 13, y = p.y - s / 2 - 7; ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 1.4; ctx.strokeStyle = INK; ctx.stroke(); ctx.drawImage(img('st', k), x - 6.5, y - 6.5, 13, 13); });
  }

  function drawFx(ctx, f) {
    const k = 1 - f.t / f.life;
    ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, k * 1.5));
    const pr = f.t / f.life;
    if (f.type === 'shot') { ctx.globalAlpha = 1; const x = f.x1 + (f.x2 - f.x1) * pr, y = f.y1 + (f.y2 - f.y1) * pr - Math.sin(pr * Math.PI) * 10; const s = f.fam === 'recipe' ? 16 : 13; ctx.drawImage(img('pj', f.fam || 'water'), x - s / 2, y - s / 2, s, s); }
    else if (f.type === 'splash') { ctx.strokeStyle = FAMC[f.fam] || '#fff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1 - k * 0.4), 0, Math.PI * 2); ctx.stroke(); }
    else if (f.type === 'burst') { const s = f.r * 2 * (0.7 + pr * 0.6); ctx.drawImage(img('fx', 'burst'), f.x - s / 2, f.y - s / 2, s, s); }
    else if (f.type === 'sparkle') { const s = 34 + pr * 20; ctx.translate(f.x, f.y); ctx.rotate(pr * 0.8); ctx.drawImage(img('fx', 'sparkle'), -s / 2, -s / 2, s, s); }
    else if (f.type === 'fire') { for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, r = f.r * (0.25 + pr * 0.65), s = 30 - pr * 8; ctx.drawImage(img('fx', 'fire'), f.x + Math.cos(a) * r - s / 2, f.y + Math.sin(a) * r * 0.8 - s / 2, s, s); } }
    else if (f.type === 'chain') { ctx.lineJoin = 'round'; for (const [w, c] of [[6, INK], [3, '#bfe9ff']]) { ctx.beginPath(); f.pts.forEach((p, i) => { if (!i) ctx.moveTo(p.x, p.y); else { const q = f.pts[i - 1]; ctx.lineTo((p.x + q.x) / 2 + 6, (p.y + q.y) / 2 - 6); ctx.lineTo(p.x, p.y); } }); ctx.lineWidth = w; ctx.strokeStyle = c; ctx.stroke(); } f.pts.forEach(p => ctx.drawImage(img('fx', 'crystal'), p.x - 8, p.y - 9, 16, 16)); }
    else if (f.type === 'shard') { const x = f.x1 + (f.x2 - f.x1) * pr, y = f.y1 + (f.y2 - f.y1) * pr; ctx.translate(x, y); ctx.rotate(Math.atan2(f.y2 - f.y1, f.x2 - f.x1) + Math.PI / 2); ctx.drawImage(img('fx', 'shard'), -9, -12, 18, 24); }
    else if (f.type === 'oil') { const mx = (f.x1 + f.x2) / 2, my = Math.min(f.y1, f.y2) - 30, u = 1 - pr; const x = u * u * f.x1 + 2 * u * pr * mx + pr * pr * f.x2, y = u * u * f.y1 + 2 * u * pr * my + pr * pr * f.y2; ctx.globalAlpha = 1; ctx.drawImage(img('fx', 'oil'), x - 9, y - 9, 18, 18); }
    else if (f.type === 'text') { const s = f.big ? 22 : 14; outlinedText(ctx, f.text, f.x, f.y - (1 - k) * 18, s, f.color || '#fff', INK, 6); }
    else if (f.type === 'coin') { outlinedText(ctx, f.text, f.x, f.y - (1 - k) * 22, 14, '#ffd84d', INK, 4); }
    else if (f.type === 'spark') { const s = 22 + pr * 16; ctx.translate(f.x, f.y); ctx.rotate(pr * 1.2); ctx.drawImage(img('fx', 'sparkle'), -s / 2, -s / 2, s, s); }
    else if (f.type === 'pop') { ctx.strokeStyle = f.merge ? '#ffb800' : '#fff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(f.x, f.y, 20 + (1 - k) * 18, 0, Math.PI * 2); ctx.stroke(); }
    ctx.restore();
  }

  SD.render = function (ctx, G, ui) {
    const bg = bgImage(G);
    ctx.fillStyle = '#f6f0e6'; ctx.fillRect(0, 0, 390, 612);

    drawDevices(ctx, G);
    for (const z of G.zones) { ctx.globalAlpha = 0.45 + 0.5 * Math.min(1, z.t / 1); const w = z.r * 2.2; ctx.drawImage(img('fx', 'puddle'), z.x - w / 2, z.y - w / 2 - 6, w, w); ctx.globalAlpha = 1; }
    G.cells.forEach((c, i) => drawCell(ctx, G, c, i, ui));
    const ri = ui.drag ? ui.drag.from : ui.sel;
    if (ri != null && G.cells[ri] && G.cells[ri].unit) {

    }
    if (!ui.drag && ui.sel != null && ui.selPartners && ui.selPartners.length && G.cells[ui.sel]) {
      const a = G.cells[ui.sel];
      ctx.save(); ctx.setLineDash([6, 5]); ctx.lineDashOffset = -performance.now() / 40; ctx.lineCap = 'round';
      for (const p of ui.selPartners) {
        const b = G.cells[p.j]; const mx = (a.cx + b.cx) / 2, my = (a.cy + b.cy) / 2 - 18;
        ctx.strokeStyle = p.kind === 'recipe' ? (p.known ? '#e0a800' : '#8b5cf6') : p.kind === 'branch' ? '#ff6b5b' : '#ff9f1c';
        const col = ctx.strokeStyle; ctx.beginPath(); ctx.moveTo(a.cx, a.cy); ctx.quadraticCurveTo(mx, my, b.cx, b.cy);
        ctx.setLineDash([]); ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.stroke();
        ctx.setLineDash([7, 5]); ctx.lineWidth = 4; ctx.strokeStyle = col; ctx.stroke();
        ctx.setLineDash([]); ctx.beginPath(); ctx.arc(b.cx, b.cy, 6, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke(); ctx.setLineDash([7, 5]);
      }
      ctx.restore();
    }
    for (const d of G.dishes) drawDish(ctx, G, d);
    for (const f of G.fx) drawFx(ctx, f);
    if (ui.drag && ui.drag.moved) {
      const u = G.cells[ui.drag.from].unit;
      if (u) { ctx.globalAlpha = 0.9; if (u.recipe) { const R = SD.DATA.RECIPES[u.recipe]; ctx.drawImage(img('ing', R.a), ui.drag.x - 30, ui.drag.y - 26, 34, 34); ctx.drawImage(img('ing', R.b), ui.drag.x - 6, ui.drag.y - 22, 34, 34); } else ctx.drawImage(img('ing', u.key), ui.drag.x - 24, ui.drag.y - 28, 48, 48); ctx.globalAlpha = 1; }
    }
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* 싱크대 수비대 - 판 밖 데이터와 규칙 (재화, 커피, 스테이지, 상자, 레벨업, 상점, 주방, 미션, 출석, 우편)
 * DOM 없음. store(get/set)와 now()를 바꿔 끼우면 노드에서 테스트할 수 있다 */
(function (g) {
  const SD = g.SD = g.SD || {};
  const D = () => SD.DATA;
  const ART = () => g.SD_ART;

  const ECON = {
    COFFEE_MAX: 50, COFFEE_REGEN_MS: 8 * 60e3, COFFEE_COST: 5, COFFEE_REFUND: 3,
    AD_COFFEE: 10, AD_COFFEE_CAP: 3, AD_TIP: 300, AD_TIP_CAP: 3,
    MAX_LV: 10, LV_DMG: 0.08,
    LV_SHARDS: [0, 0, 5, 10, 20, 30, 50, 80, 120, 160, 200],
    LV_TIPS: [0, 0, 100, 200, 400, 600, 900, 1300, 1800, 2400, 3000],
    UNLOCK_SHARDS: 10,
    SHOP_REFRESH_MS: 3 * 3600e3, SHOP_REROLL: 50,
    STAGE_MUL: [1, 0.75, 0.85, 1, 1.1, 1.2],
    KITCHEN_CAP_H: 8, KITCHEN_MAX_LV: 10,
    RECIPE_FIRST_TIPS: 100, LVUP_COFFEE: 10, DAY_RESET_HOUR: 5
  };
  const CHESTS = {
    wood: { name: '나무 상자', color: ['#d99a52', '#f2c48a'], deck: [2, 2, 5], off: [0.15, 3], unlock: [0.03, 5], tips: [60, 120] },
    silver: { name: '은 상자', color: ['#c9d1d6', '#e8edf0'], deck: [2, 3, 8], off: [0.2, 5], unlock: [0.05, 10], tips: [120, 240] },
    gold: { name: '금 상자', color: ['#ffc93c', '#ffe08a'], deck: [3, 6, 12], off: [0.35, 8], unlock: [0.12, 15], tips: [300, 500] }
  };
  const MISSIONS = [
    { id: 'plays', name: '영업 3판 하기', goal: 3, reward: { tips: 200 } },
    { id: 'dishes', name: '그릇 150개 닦기', goal: 150, reward: { coffee: 10 } },
    { id: 'combos', name: '콤보 30번 터뜨리기', goal: 30, reward: { tips: 150 } },
    { id: 'recipes', name: '살림 비법 1번 만들기', goal: 1, reward: { chest: 'wood' } }
  ];
  const ATTEND = [
    { coffee: 10, tips: 100 }, { coffee: 10, tips: 150 }, { coffee: 10, chest: 'wood' }, { coffee: 10, tips: 250 },
    { coffee: 10, chest: 'silver' }, { coffee: 10, tips: 400 }, { coffee: 10, chest: 'gold' }
  ];
  const PRODUCTS = {
    starter: { name: '스타터팩', price: 2900, once: true, desc: '커피 50 · 팁 3,000 · 덱 재료 조각 각 8 · 커피 최대치 +10', items: { coffee: 50, tips: 3000, deckShards: 8, maxPlus: 10 } },
    coffee50: { name: '커피 50', price: 1200, desc: '바로 충전', items: { coffee: 50 } },
    maxplus: { name: '커피 최대치 +10', price: 3300, desc: '영구', items: { maxPlus: 10 } },
    adfree: { name: '광고 제거', price: 5500, once: true, desc: '광고 없이 광고 보상 바로 받기', items: { adFree: true } }
  };
  const CHAPTERS = () => D().MAP_ORDER;

  let store = {
    get(k, d) { try { const v = g.localStorage && g.localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { g.localStorage && g.localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
  };
  let nowFn = () => Date.now();
  let randFn = Math.random;
  const KEY = 'sd.profile.v1';

  const dayKey = (t) => { const d = new Date(t - ECON.DAY_RESET_HOUR * 3600e3); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
  const rint = (a, b) => a + Math.floor(randFn() * (b - a + 1));
  function seeded(seed) { let s = seed >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  function fresh() {
    const deck = D().DEFAULT_DECK.slice();
    const t = nowFn();
    return {
      v: 1, created: t, coffee: ECON.COFFEE_MAX, coffeeT: t, maxPlus: 0, tips: 300, exp: 0, lv: 1,
      shards: {}, levels: Object.fromEntries(deck.map(k => [k, 1])), deck, today: 'bomb',
      stars: {}, sel: { map: 'basic', stage: 1 },
      day: null, attend: { last: '', streak: 0 },
      mail: [{ id: 'welcome', title: '싱크대 수비대에 오신 걸 환영해요', body: '첫 영업 준비금이에요.', items: { coffee: 20, tips: 500 } }],
      shop: null, kitchen: { lv: 1, t: t }, adFree: false, bought: {}, stats: { plays: 0, wins: 0 }
    };
  }
  let P = null;
  const M = SD.meta = {
    ECON, CHESTS, MISSIONS, ATTEND, PRODUCTS,
    setStore(s) { store = s; }, setNow(f) { nowFn = f; }, setRand(f) { randFn = f; },
    load() { P = store.get(KEY, null) || fresh(); M.tick(); return P; },
    save() { store.set(KEY, P); },
    reset() { P = fresh(); M.tick(); M.save(); return P; },
    get p() { return P; }
  };

  /* ---------- 시간 처리 ---------- */
  M.coffeeMax = () => ECON.COFFEE_MAX + (P.maxPlus || 0);
  M.tick = function () {
    const t = nowFn();
    // 커피 충전 (최대치까지만, 넘친 건 그대로 둠)
    if (P.coffee >= M.coffeeMax()) P.coffeeT = t;

      const n = Math.floor((t - P.coffeeT) / ECON.COFFEE_REGEN_MS);
      if (n > 0) { P.coffee = Math.min(M.coffeeMax(), P.coffee + n); P.coffeeT = P.coffee >= M.coffeeMax() ? t : P.coffeeT + n * ECON.COFFEE_REGEN_MS; }

    const dk = dayKey(t);
    if (!P.day || P.day.key !== dk) P.day = { key: dk, freeChest: false, adCoffee: 0, adTip: 0, prog: { plays: 0, dishes: 0, combos: 0, recipes: 0 }, claimed: {} };
    // 조각 가게
    const bucket = Math.floor(t / ECON.SHOP_REFRESH_MS);
    if (!P.shop || P.shop.bucket !== bucket) P.shop = { bucket, slots: rollShop(seeded(bucket * 7919 + 13)), bought: [] };
  };
  M.coffeeNextMs = () => P.coffee >= M.coffeeMax() ? 0 : ECON.COFFEE_REGEN_MS - (nowFn() - P.coffeeT);

  /* ---------- 지급 ---------- */
  function grant(items, out = [], label) {
    const n0 = out.length;
    if (!items) return out;
    if (items.coffee) { P.coffee += items.coffee; out.push({ type: 'coffee', n: items.coffee }); }
    if (items.tips) { P.tips += items.tips; out.push({ type: 'tips', n: items.tips }); }
    if (items.maxPlus) { P.maxPlus = (P.maxPlus || 0) + items.maxPlus; out.push({ type: 'maxPlus', n: items.maxPlus }); }
    if (items.adFree) { P.adFree = true; out.push({ type: 'adFree' }); }
    if (items.deckShards) { for (const k of P.deck) addShards(k, items.deckShards); out.push({ type: 'deckShards', n: items.deckShards, keys: P.deck.slice() }); }
    for (const k of ['chest', 'chest2']) if (items.chest && items[k]) out.push({ type: 'chest', tier: items[k], items: M.openChest(items[k]) });
    if (label) for (let i = n0; i < out.length; i++) out[i].label = label;
    return out;
  }
  M.grant = grant;
  function addShards(k, n) { P.shards[k] = (P.shards[k] || 0) + n; }

  /* ---------- 재료 ---------- */
  M.allIngs = () => Object.keys(ART().ING);
  M.isUnlocked = (k) => (P.levels[k] || 0) >= 1;
  M.lvCost = (k) => { const lv = P.levels[k] || 0; if (!lv || lv >= ECON.MAX_LV) return null; return { shards: ECON.LV_SHARDS[lv + 1], tips: ECON.LV_TIPS[lv + 1] }; };
  M.levelUp = function (k) {
    const c = M.lvCost(k); if (!c) return { ok: false, why: '최대 레벨' };
    if ((P.shards[k] || 0) < c.shards) return { ok: false, why: '조각이 부족해요' };
    if (P.tips < c.tips) return { ok: false, why: '팁이 부족해요' };
    P.shards[k] -= c.shards; P.tips -= c.tips; P.levels[k]++; M.save(); return { ok: true, lv: P.levels[k] };
  };
  M.unlock = function (k) {
    if (M.isUnlocked(k)) return { ok: false, why: '이미 있어요' };
    if ((P.shards[k] || 0) < ECON.UNLOCK_SHARDS) return { ok: false, why: `조각 ${ECON.UNLOCK_SHARDS}개가 필요해요` };
    P.shards[k] -= ECON.UNLOCK_SHARDS; P.levels[k] = 1; M.save(); return { ok: true };
  };
  M.toggleDeck = function (k) {
    const i = P.deck.indexOf(k);
    if (i >= 0) { if (P.deck.length <= 4) return { ok: false, why: '덱은 4종 이상이어야 해요' }; P.deck.splice(i, 1); }
    else { if (!M.isUnlocked(k)) return { ok: false, why: '아직 없는 재료예요' }; if (P.deck.length >= 8) return { ok: false, why: '덱은 8종까지예요. 먼저 하나를 빼요' }; P.deck.push(k); }
    if (!M.todayOptions().includes(P.today)) P.today = M.todayOptions()[0] || P.today;
    M.save(); return { ok: true };
  };
  M.todayOptions = () => Object.keys(D().PAIRS).filter(k => P.deck.includes(D().PAIRS[k].a) && P.deck.includes(D().PAIRS[k].b));
  M.cycleToday = () => { const o = M.todayOptions(); if (!o.length) return null; P.today = o[(o.indexOf(P.today) + 1) % o.length]; M.save(); return P.today; };
  M.dmgMul = (k) => 1 + ECON.LV_DMG * ((P.levels[k] || 1) - 1);

  /* ---------- 상자 ---------- */
  M.chestOdds = function (tier) {
    const C = CHESTS[tier];
    return [[`덱에 있는 재료 조각 x${C.deck[1]}~${C.deck[2]} (${C.deck[0]}묶음)`, '100%'], [`덱에 없는 재료 조각 x${C.off[1]}`, Math.round(C.off[0] * 100) + '%'], [`아직 없는 재료 조각 x${C.unlock[1]}`, Math.round(C.unlock[0] * 100) + '%'], [`팁 ${C.tips[0]}~${C.tips[1]}`, '100%']];
  };
  M.openChest = function (tier) {
    const C = CHESTS[tier], out = [];
    const pick = (L) => L[Math.floor(randFn() * L.length)];
    const deck = P.deck.slice();
    for (let i = 0; i < C.deck[0]; i++) { const k = pick(deck); const n = rint(C.deck[1], C.deck[2]); addShards(k, n); out.push({ type: 'shard', k, n }); }
    const off = M.allIngs().filter(k => M.isUnlocked(k) && !P.deck.includes(k));
    if (off.length && randFn() < C.off[0]) { const k = pick(off); addShards(k, C.off[1]); out.push({ type: 'shard', k, n: C.off[1] }); }
    const locked = M.allIngs().filter(k => !M.isUnlocked(k));
    if (locked.length && randFn() < C.unlock[0]) { const k = pick(locked); addShards(k, C.unlock[1]); out.push({ type: 'shard', k, n: C.unlock[1], fresh: true }); }
    const tp = rint(C.tips[0], C.tips[1]); P.tips += tp; out.push({ type: 'tips', n: tp });
    return out;
  };

  /* ---------- 스테이지 ---------- */
  const sk = (m, s) => m + '-' + s;
  M.starsOf = (m, s) => P.stars[sk(m, s)] || 0;
  M.mapUnlocked = (m) => { const o = CHAPTERS(), i = o.indexOf(m); return i <= 0 || M.starsOf(o[i - 1], 5) > 0; };
  M.stageUnlocked = (m, s) => M.mapUnlocked(m) && (s === 1 || M.starsOf(m, s - 1) > 0);
  M.mapStars = (m) => [1, 2, 3, 4, 5].reduce((a, s) => a + M.starsOf(m, s), 0);
  M.isFree = (m) => m === 'basic';
  M.stageName = (m, s) => (({ basic: ['첫 출근', '설거지 연습', '점심 준비', '저녁 손님', '기름 쟁반'], kr: ['반찬 가게', '국밥집', '돌솥 비빔밥', '고깃집 점심', '삼겹살 회식'], cn: ['짜장면 배달', '탕수육 주문', '딤섬 브런치', '중식 코스', '불쇼 만찬'], jp: ['초밥 오픈', '라멘 줄서기', '타코야키 축제', '회전 가속', '카레 데이'], we: ['브런치 카페', '파스타 런치', '스테이크 디너', '디저트 타임', '라자냐 파티'] })[m] || [])[s - 1] || `${s}번째 영업`;
  M.stageBoss = (m, s) => { const M0 = D().MAPS[m]; return { mid: M0.mid, last: s >= 5 ? M0.final : M0.mid, lastStrong: s < 5 }; };
  M.firstChest = (m, s) => s >= 5 ? 'gold' : 'silver';
  M.startRun = function (m, s) {
    M.tick();
    if (!M.stageUnlocked(m, s)) return { ok: false, why: '아직 잠긴 스테이지예요' };
    const cost = M.isFree(m) ? 0 : ECON.COFFEE_COST;
    if (P.coffee < cost) return { ok: false, why: '커피가 부족해요', coffee: true };
    if (cost && P.coffee >= M.coffeeMax() && P.coffee - cost < M.coffeeMax()) P.coffeeT = nowFn();
    const guests = D().rollGuests(s, P.deck, Math.random, CHAPTERS().indexOf(m));
    P.coffee -= cost; P.sel = { map: m, stage: s }; P.run = { map: m, stage: s, cost, t: nowFn(), guests }; M.save();
    return { ok: true, cost, deck: P.deck.slice(), levels: { ...P.levels }, today: P.today, guests };
  };
  M.finishRun = function (r) {
    const run = P.run || { map: r.map, stage: r.stage, cost: 0 }; P.run = null;
    const m = run.map, s = run.stage, ci = CHAPTERS().indexOf(m);
    const out = { win: !!r.win, stars: 0, rewards: [], firstClear: false, chest: null, lvUp: false };
    const base = Math.round(((ci + 1) * 40 + s * 10) * 1.5);   // 15웨이브(예전 10웨이브의 1.5배 길이)
    if (r.win) {
      const hm = r.maxHearts || 20;   // 까다로운 입맛이면 15에서 시작하니 비율로 (20 기준 16·8)
      out.stars = r.hearts >= hm * 0.8 ? 3 : r.hearts >= hm * 0.4 ? 2 : 1;
      out.firstClear = M.starsOf(m, s) === 0;
      P.stars[sk(m, s)] = Math.max(M.starsOf(m, s), out.stars);
      grant({ tips: base + out.stars * 10 }, out.rewards, '클리어');
      const ng = (run.guests || []).length; if (ng) grant({ tips: Math.round(base * 0.2 * ng) }, out.rewards, '까다로운 손님');
      out.chest = out.firstClear ? M.firstChest(m, s) : out.stars >= 3 ? 'silver' : 'wood';
      out.rewards.push({ type: 'chest', tier: out.chest, items: M.openChest(out.chest) });
      P.stats.wins++;
    } else {
      grant({ tips: Math.round(base * Math.min(D().WAVES, r.wave || 0) / (2 * D().WAVES)) }, out.rewards, '버틴 만큼');
      if (run.cost) grant({ coffee: ECON.COFFEE_REFUND }, out.rewards, '환불');
    }
    if (r.newRecipes) grant({ tips: r.newRecipes * ECON.RECIPE_FIRST_TIPS }, out.rewards, '새 비법');
    // 경험치
    const exp = r.win ? 10 * (ci + 1) + s * 2 : 3;
    P.exp += exp; out.exp = exp;
    while (P.exp >= M.expNeed()) { P.exp -= M.expNeed(); P.lv++; out.lvUp = true; grant({ coffee: ECON.LVUP_COFFEE }, out.rewards, '레벨 업'); }
    // 미션 진행
    M.tick(); const pr = P.day.prog;
    pr.plays++; pr.dishes += r.cleaned || 0; pr.combos += r.combos || 0; pr.recipes += r.recipes || 0;
    P.stats.plays++;
    M.save(); return out;
  };
  M.expNeed = () => 40 + P.lv * 20;
  M.sweep = function (m, s) {
    M.tick();
    if (M.starsOf(m, s) < 3) return { ok: false, why: '별 3개를 받은 스테이지만 소탕돼요' };
    if (!M.isFree(m) && P.coffee < ECON.COFFEE_COST) return { ok: false, why: '커피가 부족해요', coffee: true };
    if (!M.isFree(m)) P.coffee -= ECON.COFFEE_COST;
    const ci = CHAPTERS().indexOf(m), out = [];
    grant({ tips: (ci + 1) * 40 + s * 10 + 30 }, out);
    out.push({ type: 'chest', tier: 'wood', items: M.openChest('wood') });
    P.day.prog.plays++; M.save(); return { ok: true, rewards: out };
  };

  /* ---------- 상점 ---------- */
  function rollShop(rng) {
    const all = M.allIngs ? Object.keys(ART().ING) : [];
    const pool = []; for (const k of all) { const w = P && (P.levels[k] || 0) >= 1 ? 3 : 1; for (let i = 0; i < w; i++) pool.push(k); }
    const slots = [], used = new Set();
    while (slots.length < 4 && used.size < all.length) { const k = pool[Math.floor(rng() * pool.length)]; if (used.has(k)) continue; used.add(k); const unlocked = P && (P.levels[k] || 0) >= 1; slots.push({ k, n: unlocked ? 10 : 5, price: unlocked ? 200 + (P.levels[k] || 1) * 20 : 300 }); }
    return slots;
  }
  M.shopNextMs = () => ECON.SHOP_REFRESH_MS - (nowFn() % ECON.SHOP_REFRESH_MS);
  M.shopBuy = function (i) {
    M.tick(); const sl = P.shop.slots[i];
    if (!sl || P.shop.bought.includes(i)) return { ok: false, why: '이미 샀어요' };
    if (P.tips < sl.price) return { ok: false, why: '팁이 부족해요' };
    P.tips -= sl.price; addShards(sl.k, sl.n); P.shop.bought.push(i); M.save(); return { ok: true };
  };
  M.shopReroll = function () {
    if (P.tips < ECON.SHOP_REROLL) return { ok: false, why: '팁이 부족해요' };
    P.tips -= ECON.SHOP_REROLL; P.shop.slots = rollShop(randFn); P.shop.bought = []; M.save(); return { ok: true };
  };
  M.freeChest = function () { M.tick(); if (P.day.freeChest) return { ok: false, why: '오늘은 이미 받았어요' }; P.day.freeChest = true; const items = M.openChest('wood'); M.save(); return { ok: true, items }; };
  M.adReward = function (kind) {
    M.tick();
    if (kind === 'coffee') { if (P.day.adCoffee >= ECON.AD_COFFEE_CAP) return { ok: false, why: '오늘은 다 봤어요' }; P.day.adCoffee++; const r = grant({ coffee: ECON.AD_COFFEE }); M.save(); return { ok: true, rewards: r }; }
    if (P.day.adTip >= ECON.AD_TIP_CAP) return { ok: false, why: '오늘은 다 봤어요' }; P.day.adTip++; const r = grant({ tips: ECON.AD_TIP }); M.save(); return { ok: true, rewards: r };
  };
  // 토스 결제 연결 전: 바로 지급 (테스트)
  M.buyProduct = function (id) {
    const pr = PRODUCTS[id]; if (!pr) return { ok: false };
    if (pr.once && P.bought[id]) return { ok: false, why: '이미 산 상품이에요' };
    P.bought[id] = (P.bought[id] || 0) + 1; const r = grant(pr.items); M.save(); return { ok: true, rewards: r };
  };

  /* ---------- 주방 (방치 생산 + 소탕) ---------- */
  M.clearedCount = () => Object.values(P.stars).filter(x => x > 0).length;
  M.kitchenRate = () => Math.round((40 + 15 * M.clearedCount()) * (1 + 0.25 * (P.kitchen.lv - 1)));
  M.kitchenPending = () => { const h = Math.min(ECON.KITCHEN_CAP_H, (nowFn() - P.kitchen.t) / 3600e3); return { tips: Math.floor(h * M.kitchenRate()), hours: h, full: h >= ECON.KITCHEN_CAP_H }; };
  M.kitchenCollect = function () { const p = M.kitchenPending(); if (p.tips < 1) return { ok: false, why: '아직 모인 게 없어요' }; P.kitchen.t = nowFn(); const r = grant({ tips: p.tips }); M.save(); return { ok: true, rewards: r }; };
  M.kitchenUpCost = () => P.kitchen.lv >= ECON.KITCHEN_MAX_LV ? null : Math.round(500 * Math.pow(P.kitchen.lv, 1.5));
  M.kitchenUp = function () {
    const c = M.kitchenUpCost(); if (c == null) return { ok: false, why: '최대 레벨' };
    if (P.tips < c) return { ok: false, why: '팁이 부족해요' };
    M.kitchenCollect(); P.tips -= c; P.kitchen.lv++; M.save(); return { ok: true };
  };

  /* ---------- 미션 · 출석 · 우편 ---------- */
  M.missionState = () => { M.tick(); return MISSIONS.map(ms => ({ ...ms, prog: Math.min(ms.goal, P.day.prog[ms.id] || 0), done: (P.day.prog[ms.id] || 0) >= ms.goal, claimed: !!P.day.claimed[ms.id] })); };
  M.claimMission = function (id) {
    const ms = M.missionState().find(x => x.id === id);
    if (!ms || !ms.done || ms.claimed) return { ok: false };
    P.day.claimed[id] = true; const r = grant(ms.reward); M.save(); return { ok: true, rewards: r };
  };
  M.claimAllMissions = function () { const out = []; for (const ms of M.missionState()) if (ms.done && !ms.claimed) { const r = M.claimMission(ms.id); if (r.ok) out.push(...r.rewards); } return { ok: out.length > 0, rewards: out, why: '받을 미션이 없어요' }; };
  M.missionBadge = () => M.missionState().some(x => x.done && !x.claimed);
  M.attendState = () => { M.tick(); const today = P.day.key; const claimedToday = P.attend.last === today; const idx = claimedToday ? (P.attend.streak - 1) % 7 : P.attend.streak % 7; return { idx, claimedToday, streak: P.attend.streak }; };
  M.claimAttend = function () {
    const st = M.attendState(); if (st.claimedToday) return { ok: false, why: '오늘은 이미 받았어요' };
    P.attend.last = P.day.key; P.attend.streak++; const r = grant(ATTEND[st.idx]); M.save(); return { ok: true, rewards: r, day: st.idx + 1 };
  };
  M.claimMail = function (id) {
    const i = P.mail.findIndex(x => x.id === id); if (i < 0) return { ok: false };
    const m = P.mail.splice(i, 1)[0]; const r = grant(m.items); M.save(); return { ok: true, rewards: r };
  };
  M.claimAllMail = function () { const out = []; while (P.mail.length) out.push(...M.claimMail(P.mail[0].id).rewards); return { ok: true, rewards: out }; };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* 싱크대 수비대 - 광고 연결부
 * 지금은 토스 SDK 연결 전이라 테스트로 바로 성공한다. 앱인토스로 포장할 때 show()만 실제 보상형 광고로 바꾸면 된다.
 *   (앱인토스: loadAdMobRewardedAd → showAdMobRewardedAd, 보상 이벤트를 받았을 때만 true)
 * 웹판(깃허브 페이지·원스토어)은 광고가 없으므로 available() = false → 광고 버튼 자체를 안 보여준다. */
(function (g) {
  const SD = g.SD = g.SD || {};
  SD.ads = {
    available: () => g.SD_PLATFORM !== 'web',
    // kind: 'revive' 등. 끝까지 봤으면 true
    show(kind) {
      return new Promise((resolve) => {
        if (SD.meta && SD.meta.p && SD.meta.p.adFree) return resolve(true);   // 광고 제거 구매자는 바로 보상
        // TODO 토스 SDK 연결
        setTimeout(() => resolve(true), 400);
      });
    },
    isTest: true
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* 싱크대 수비대 - 소리 (파일 없이 WebAudio로 합성)
 * 효과음: 버튼, 소환, 합성, 비법, 그릇 닦기, 콤보 5종, 하트 깎임, 보스, 웨이브, 승패
 * 배경음: 로비(느리고 가벼움) / 영업(조금 빠름) 두 가지 루프
 * 설정: localStorage 'sd.sound.v1' = { sfx, bgm } */
(function (g) {
  const SD = g.SD = g.SD || {};
  const KEY = 'sd.sound.v1';
  let cfg = { sfx: true, bgm: true };
  try { cfg = Object.assign(cfg, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) { } };

  const AC = g.AudioContext || g.webkitAudioContext;
  let ctx = null, sfxBus = null, bgmBus = null, noiseBuf = null;
  function ensure() {
    if (!AC) return null;
    if (!ctx) {
      ctx = new AC();
      const master = ctx.createDynamicsCompressor(); master.connect(ctx.destination);
      sfxBus = ctx.createGain(); sfxBus.gain.value = cfg.sfx ? 0.9 : 0; sfxBus.connect(master);
      bgmBus = ctx.createGain(); bgmBus.gain.value = cfg.bgm ? 0.55 : 0; bgmBus.connect(master);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended' && !document.hidden) ctx.resume();
    return ctx;
  }
  // 브라우저 자동재생 정책: 첫 터치 때 켠다
  const unlock = () => { ensure(); if (ctx && ctx.state === 'running') { removeEventListener('pointerdown', unlock, true); startBgmIfNeeded(); } };
  addEventListener('pointerdown', unlock, true);
  document.addEventListener('visibilitychange', () => { if (!ctx) return; if (document.hidden) ctx.suspend(); else ctx.resume(); });

  /* ---------- 기본 소리 ---------- */
  function tone(f, dur, o = {}) {
    if (!ctx || !cfg.sfx && !o.bgm) return;
    const t = (o.at != null ? o.at : ctx.currentTime) + (o.delay || 0);
    const osc = ctx.createOscillator(), gn = ctx.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    const v = o.vol == null ? 0.2 : o.vol, a = o.attack || 0.005;
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(v, t + a); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = osc;
    if (o.lp) { const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.lp; osc.connect(fl); node = fl; }

  }
  function noise(dur, o = {}) {

    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const fl = ctx.createBiquadFilter(); fl.type = o.ft || 'bandpass'; fl.frequency.setValueAtTime(o.f || 1200, t); if (o.fTo) fl.frequency.exponentialRampToValueAtTime(o.fTo, t + dur); fl.Q.value = o.q || 1;
    const gn = ctx.createGain(); const v = o.vol == null ? 0.15 : o.vol;
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(v, t + (o.attack || 0.005)); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(fl); fl.connect(gn); gn.connect(o.bgm ? bgmBus : sfxBus);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.02);
  }
  const last = {};
  const gate = (k, ms) => { const n = performance.now(); if (last[k] && n - last[k] < ms) return false; last[k] = n; return true; };

  const FX = {
    click: () => tone(720, 0.05, { type: 'triangle', vol: 0.06 }),
    summon: () => { tone(520, 0.08, { type: 'triangle', vol: 0.14 }); tone(780, 0.1, { type: 'triangle', vol: 0.12, delay: 0.05 }); },
    merge: () => [523, 659, 784].forEach((f, i) => tone(f, 0.16, { vol: 0.13, delay: i * 0.045 })),
    recipe: () => { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.22, { vol: 0.12, delay: i * 0.06 })); tone(2093, 0.5, { vol: 0.05, delay: 0.24 }); },
    clean: () => tone(1300 + Math.random() * 500, 0.09, { vol: 0.045 }),
    blast: () => { noise(0.28, { ft: 'lowpass', f: 1400, fTo: 200, vol: 0.22 }); tone(200, 0.2, { to: 70, type: 'sine', vol: 0.18 }); },
    puddle: () => { for (let i = 0; i < 3; i++) tone(300 + Math.random() * 300, 0.08, { to: 700, vol: 0.07, delay: i * 0.05 }); },
    shatter: () => { noise(0.12, { ft: 'highpass', f: 3000, vol: 0.12 }); tone(1800, 0.06, { type: 'square', vol: 0.03, delay: 0.02 }); },
    chain: () => tone(1100, 0.16, { to: 260, type: 'sawtooth', vol: 0.05, lp: 2400 }),
    cloud: () => noise(0.4, { f: 600, fTo: 1600, q: 2, vol: 0.08, attack: 0.08 }),
    leak: () => tone(190, 0.22, { to: 110, type: 'square', vol: 0.06, lp: 900 }),
    boss: () => { tone(220, 0.35, { type: 'sawtooth', vol: 0.08, lp: 900 }); tone(196, 0.5, { type: 'sawtooth', vol: 0.08, lp: 900, delay: 0.32 }); },
    waveStart: () => { tone(880, 0.35, { vol: 0.1 }); tone(1320, 0.4, { vol: 0.06, delay: 0.01 }); },
    waveEnd: () => [659, 880].forEach((f, i) => tone(f, 0.18, { vol: 0.08, delay: i * 0.08 })),
    win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i === 3 ? 0.5 : 0.18, { type: 'triangle', vol: 0.14, delay: i * 0.11 })),
    lose: () => [523, 466, 392, 330].forEach((f, i) => tone(f, 0.25, { type: 'triangle', vol: 0.11, delay: i * 0.15 })),
    chime: () => [988, 1319].forEach((f, i) => tone(f, 0.25, { vol: 0.08, delay: i * 0.07 })),
    buzz: () => tone(140, 0.35, { type: 'square', vol: 0.07, lp: 700 }),
    coin: () => { tone(988, 0.06, { type: 'square', vol: 0.04 }); tone(1319, 0.12, { type: 'square', vol: 0.04, delay: 0.05 }); }
  };
  const played = {};
  function play(k, throttle = 0) { if (!cfg.sfx || !ensure() || ctx.state !== 'running') return; if (throttle && !gate(k, throttle)) return; played[k] = (played[k] || 0) + 1; FX[k] && FX[k](); }

  /* ---------- 배경음: 간단한 4마디 루프 ---------- */
  const CH = [[262, 330, 392], [220, 262, 330], [175, 220, 262], [196, 247, 294]];   // C Am F G
  const MEL = [0, 2, 4, 2, 1, -1, 2, -1, 0, 2, 4, 5, 4, 2, 1, -1];                     // 화음 음 인덱스(-1 = 쉼)
  let bgmMode = null, bgmTimer = null, step = 0, nextT = 0;
  function sched() {
    if (!ctx || ctx.state !== 'running') return;
    const fast = bgmMode === 'run', spb = fast ? 60 / 108 / 2 : 60 / 84 / 2;   // 8분음표 길이
    while (nextT < ctx.currentTime + 0.35) {
      const bar = Math.floor(step / 8) % 4, s = step % 8, ch = CH[bar];
      if (s === 0 || s === 4) tone(ch[0] / 2, spb * 3.5, { type: 'triangle', vol: 0.09, at: nextT, bgm: true, lp: 600 });
      const m = MEL[(step % 16)]; if (m >= 0 && (fast || s % 2 === 0)) { const f = m < 3 ? ch[m] * 2 : ch[m - 3] * 4; tone(f, spb * 0.9, { type: 'sine', vol: 0.045, at: nextT, bgm: true }); }
      if (fast && s % 2 === 1) noise(0.04, { ft: 'highpass', f: 7000, vol: 0.018, at: nextT, bgm: true });
      nextT += spb; step++;
    }
  }
  function startBgmIfNeeded() {
    if (!bgmMode || !cfg.bgm || !ctx || ctx.state !== 'running') return;
    if (!bgmTimer) { nextT = ctx.currentTime + 0.1; bgmTimer = setInterval(sched, 100); }
  }
  function setBgm(mode) {
    if (mode === bgmMode) return; bgmMode = mode; step = 0;
    if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
    if (mode) startBgmIfNeeded();
  }

  /* ---------- 게임 상태 변화 감지 ---------- */
  let seen = new WeakSet(), prev = null, prevG = null;
  function tick(G) {
    if (!G) { prevG = null; return; }
    if (G !== prevG) { prevG = G; prev = { cleaned: G.stats.cleaned, summons: G.stats.summons, hearts: G.hearts, combos: { ...G.stats.combos } }; seen = new WeakSet(); for (const f of G.fx) seen.add(f); return; }
    if (G.stats.summons > prev.summons) play('summon', 60);
    if (G.stats.cleaned > prev.cleaned) play('clean', 70);
    if (G.hearts < prev.hearts) play('leak', 150);
    for (const k in G.stats.combos) if ((G.stats.combos[k] || 0) > (prev.combos[k] || 0)) play(k, 140);
    for (const f of G.fx) if (!seen.has(f)) { seen.add(f); if (f.type === 'pop' && f.merge) play('merge', 60); }   // 그릇마다 뜨는 +반짝 글자는 닦기 소리로 충분
    prev.cleaned = G.stats.cleaned; prev.summons = G.stats.summons; prev.hearts = G.hearts; prev.combos = { ...G.stats.combos };
  }
  function events(list) {
    for (const e of list) {
      if (e.type === 'recipe') play('recipe');
      else if (e.type === 'bossWarn') play('boss');
      else if (e.type === 'waveStart') play('waveStart');
      else if (e.type === 'waveEnd') play('waveEnd');
      else if (e.type === 'end') play(e.win ? 'win' : 'lose');
      else if (e.type === 'chooseRule' || e.type === 'branch' || e.type === 'comboFirst') play('chime', 200);
      else if (e.type === 'forbidden') play('buzz');
    }
  }
  // 버튼 누를 때 가벼운 소리 (캔버스는 제외)
  addEventListener('pointerdown', (e) => { if (e.target.closest && e.target.closest('.btn,.chip,.ltab,.sideb,.sdot,.peek,.sarrow,.card[data-act],.rule,.br')) play('click', 40); }, true);

  SD.sound = {
    play, tick, events, setBgm, played, get state() { return ctx ? ctx.state : 'none'; }, get bgmMode() { return bgmMode; }, get bgmRunning() { return !!bgmTimer; },
    get sfx() { return cfg.sfx; }, get bgm() { return cfg.bgm; },
    setSfx(on) { cfg.sfx = !!on; save(); ensure(); if (sfxBus) sfxBus.gain.value = on ? 0.9 : 0; },
    setBgmOn(on) { cfg.bgm = !!on; save(); ensure(); if (bgmBus) bgmBus.gain.value = on ? 0.55 : 0; if (on) startBgmIfNeeded(); else if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; } },
    suspend() { if (ctx) ctx.suspend(); }, resume() { if (ctx && !document.hidden) ctx.resume(); }
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>document.getElementById('icTap').innerHTML=SD_ART.device('pipe',34);document.getElementById('icPlug').innerHTML=SD_ART.device('drainplug',34);</script>
<script>
/* 싱크대 수비대 - 화면(DOM) · 입력 · 루프 */
(function (g) {
  const SD = g.SD;
  const D = SD.DATA, A = g.SD_ART;
  const INK = '#3b2f2f';
  const $ = (s) => document.querySelector(s);
  const ROLE = { aoe: '범위', single: '단일', support: '지원', slow: '둔화' };
  const STN = { acid: '산성', alk: '알칼리', foam: '거품', soak: '불림', hard: '굳힘' };
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
  };

  let G = null, speed = store.get('sd.speed', 1), paused = false, modalOpen = false;
  const codex = store.get('sd.codex.v1', { recipes: {}, combos: {}, safety: {} });
  const ui = { sel: null, drag: null, hover: null, dragTargets: null };
  const cv = $('#cv'), ctx = cv.getContext('2d');
  const stage = $('#stage');
  let scale = 1, seenTypes = new Set();

  const ingName = (k) => A.ING[k] ? A.ING[k].name : (D.RECIPES[k] ? D.RECIPES[k].name : k);
  const dishName = (k) => (A.DISH[k] || A.BOSS[k] || {}).name || k;
  const ingImg = (k, s) => `<span class="ii" style="width:${s}px;height:${s}px">${A.ing(k, s)}</span>`;
  const coin = (s = 16) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}"><circle cx="12" cy="12" r="10" fill="#ffc93c" stroke="${INK}" stroke-width="2.2"/><path d="M12 6l1.6 4.4L18 12l-4.4 1.6L12 18l-1.6-4.4L6 12l4.4-1.6z" fill="#fff" stroke="${INK}" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
  const traitsOf = (type) => { const ds = D.DISHES[type]; return Object.keys(D.TRAIT_TEXT).filter(k => ds[k]).map(k => D.TRAIT_TEXT[k]); };

  /* ---------- layout ---------- */
  function fit() {
    const W = window.innerWidth, H = window.innerHeight;
    scale = Math.min(W / 390, H / 844);
    stage.style.transform = `translate(${(W - 390 * scale) / 2}px, ${(H - 844 * scale) / 2}px) scale(${scale})`;
    const k = scale * (window.devicePixelRatio || 1);
    cv.width = Math.round(390 * k); cv.height = Math.round(844 * k);
    ctx.setTransform(k, 0, 0, k, 0, 0);
  }
  window.addEventListener('resize', fit);

  /* ---------- HUD ---------- */
  function hud() {
    if (!G) return;
    $('#wave').innerHTML = `W<b>${Math.max(1, G.wave)}</b><i>/${D.WAVES}</i>`;
    const seg = Math.ceil(G.hearts / 2);
    $('#hearts').innerHTML = Array.from({ length: 10 }, (_, i) => `<span class="${i < seg ? 'on' : ''}"></span>`).join('');
    $('#speed').textContent = 'x' + speed;
    $('#speed').classList.toggle('hot', speed > 1);
    // chalkboard
    let line1 = `${G.map.name} ${G.stage}스테이지`, line2 = '';
    if (G.map.situations) { const S = D.SITUATIONS; line1 = G.sit ? `지금 ${S[G.sit].name}${G.sitNext ? ' → 다음 ' + S[G.sitNext].name : ''}` : `다음 ${S[G.sitNext].name}`; }
    if (ui.sel != null && G.cells[ui.sel] && G.cells[ui.sel].unit) {
      const u = G.cells[ui.sel].unit, sp = u.recipe ? D.RECIPES[u.recipe] : D.ING[u.key], br = G.branchOf(u);
      line1 = (u.recipe ? '살림 비법' : A.FAMILY[A.ING[u.key].family].name) + ' · ' + ROLE[sp.role] + (br.name ? ' · ' + br.name : '');
      const sts = (sp.sts || (sp.st ? [sp.st] : [])).map(s => STN[s]).join('+');
      line2 = `${ingName(u.key)} ${'★'.repeat(u.star)}${sts ? ' · ' + sts : ''}`;
    } else if (G.phase === 'ready') { line2 = '재료를 놓고 시작!'; }
    else if (G.phase === 'break') { line2 = `다음 W${G.wave + 1} · ${Math.ceil(G.breakT)}초`; }
    else if (G.phase === 'wave') { const spec = D.waveSpec(G.wave, G.map, G.stage); line2 = spec.boss ? spec.bossLabel + '!' : `남은 그릇 ${G.spawn.list.length + G.dishes.length}`; }
    else if (G.phase === 'end') line2 = '영업 끝';
    $('#chalk').innerHTML = `<div class="pen">${line1}</div><div class="jua">${line2}</div>`;
    const rs = Object.keys(G.rules);
    $('#receipt').innerHTML = (G.guests && G.guests.length ? `<div class="rl gl">${G.guests.map(g => `<span class="tago">${D.GUESTS[g.id].name}</span>`).join('')}</div>` : '') + `<div class="rt"><span class="tagr">주방 규칙</span></div>` + (rs.length ? rs.map(k => `<div class="rl">${D.RULES[k].name}</div>`).join('') : `<div class="rl dim">${D.RULE_WAVES[0]}웨이브 뒤에 골라요</div>`);
    const syn = G.synergy(); const need = { acid: [2, 3], alk: [2, 3], soap: [2, 3], water: [2, 3], scrub: [2, 4] };
    $('#syn').innerHTML = ['acid', 'alk', 'scrub', 'water', 'soap'].map(f => { const n = syn[f], on = n >= need[f][0]; return `<div class="tok ${on ? 'on' : ''}" style="${on ? `background:${A.FAMILY[f].color}` : ''}">${A.FAMILY[f].name}<i>${n}/${n >= need[f][0] ? need[f][1] : need[f][0]}</i></div>`; }).join('');
    const R = D.PAIRS[G.recipeToday], known = !!(codex.recipes[R.A] || codex.recipes[R.B]);
    $('#today').innerHTML = `<span class="tagr">오늘의 레시피</span>${ingImg(R.a, 22)}${known ? ingImg(R.b, 22) : '<b class="q">?</b>'}<span class="jua">확률 x2</span>`;
    $('#shine').innerHTML = coin(20) + G.shine;
    const cost = G.summonCost();
    $('#bSummon').classList.toggle('dis', G.shine < cost || !G.emptyCells().length);
    $('#bSummon .cost').innerHTML = coin(12) + cost;
    $('#next').innerHTML = G.queue.map(k => `<span class="mini">${ingImg(k, 20)}</span>`).join('');
    const lc = G.lvCost(), odds = D.SUMMON_ODDS[G.summonLv];
    $('#bLv b').textContent = '소환 Lv' + G.summonLv;
    $('#bLv small').innerHTML = lc == null ? '최대' : `${coin(11)}${lc} · 2성 ${Math.round(odds[1] * 100)}%`;
    $('#bLv').classList.toggle('dis', lc == null || G.shine < lc);
    const mp = G.mergePairs();
    $('#bMerge .badge').textContent = mp; $('#bMerge .badge').style.display = mp ? 'flex' : 'none';
    $('#bMerge').classList.toggle('dis', !mp);
    const selU = ui.sel != null && G.cells[ui.sel] && G.cells[ui.sel].unit;
    $('#bRecycle small').innerHTML = selU ? `${coin(11)}+${G.refundOf(ui.sel)}` : '골라서 버리기';
    $('#bRecycle').classList.toggle('dis', !selU);
    const dv = G.devices;
    $('#dTap').style.display = dv.tap ? 'flex' : 'none';
    $('#dPlug').style.display = dv.plug ? 'flex' : 'none';
    $('#dWok').style.display = dv.wok ? 'flex' : 'none';
    if (dv.tap) { $('#dTap .cd').style.background = dv.tap.cd > 0 ? `conic-gradient(rgba(59,47,47,.55) 0 ${dv.tap.cd / D.TAP_CD * 100}%, transparent 0)` : 'none'; $('#dTap small').textContent = dv.tap.active > 0 ? '물웅덩이 중' : dv.tap.cd > 0 ? Math.ceil(dv.tap.cd) + '초' : '탭해서 사용'; }
    if (dv.plug) { $('#dPlug small').textContent = dv.plug.active > 0 ? '막는 중' : `${dv.plug.uses}회 남음`; $('#dPlug').classList.toggle('dis', dv.plug.uses <= 0); }
    if (dv.wok) { $('#dWok .cd').style.background = dv.wok.cd > 0 ? `conic-gradient(rgba(59,47,47,.55) 0 ${dv.wok.cd / D.WOK_CD * 100}%, transparent 0)` : 'none'; $('#dWok small').textContent = dv.wok.cd > 0 ? Math.ceil(dv.wok.cd) + '초' : '불쇼!'; }
    const wb = $('#bWave');
    if (G.phase === 'ready') { wb.style.display = 'flex'; wb.innerHTML = '설거지 시작!'; }
    else if (G.phase === 'break') { wb.style.display = 'flex'; wb.innerHTML = `바로 W${G.wave + 1}`; }
    else wb.style.display = 'none';
    // 처음 보는 특수 그릇 안내
    for (const d of G.dishes) if (!seenTypes.has(d.type)) { seenTypes.add(d.type); const t = traitsOf(d.type); if (t.length && !D.DISHES[d.type].boss) toast(`${dishName(d.type)}: ${t[0]}`); }
  }

  /* ---------- toasts / modals ---------- */
  let toastT = null;
  function toast(text, warn) { const t = $('#toast'); t.textContent = text; t.className = 'show' + (warn ? ' warn' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 1800); }
  const mq = [];
  function modal(html, onReady) { if (modalOpen) { mq.push([html, onReady]); return; } modalOpen = true; const m = $('#modal'); m.innerHTML = `<div class="sheet">${html}</div>`; m.classList.add('show'); onReady && onReady(m); }
  function closeModal() { modalOpen = false; $('#modal').classList.remove('show'); $('#modal').innerHTML = ''; if (mq.length) { const [h, f] = mq.shift(); modal(h, f); } }
  const ribbon = (t, c = '#ff6b5b') => `<div class="ribbon" style="background:${c}">${t}</div>`;

const sndToggles = () => `<div class="tgls"><div class="tgl ${SD.sound && SD.sound.sfx ? 'on' : ''}" data-snd="sfx"><span>효과음</span><i></i></div><div class="tgl ${SD.sound && SD.sound.bgm ? 'on' : ''}" data-snd="bgm"><span>배경음</span><i></i></div></div>`;
  const bindSnd = (m) => m.querySelectorAll('[data-snd]').forEach(t => t.onclick = () => { const on = !t.classList.contains('on'); t.classList.toggle('on', on); if (t.dataset.snd === 'sfx') SD.sound.setSfx(on); else SD.sound.setBgmOn(on); });
  SD.sndToggles = sndToggles; SD.bindSnd = bindSnd;
  function startScreen() { SD.sound && SD.sound.setBgm('lobby'); mq.length = 0; modalOpen = false; $('#modal').classList.remove('show'); G = null; SD.lobby.show(); }
  function startRun(mapId, stage) {
    const r = SD.meta.startRun(mapId, stage);
    if (!r.ok) { toast(r.why); if (r.coffee) SD.lobby.show('shop'); return false; }
    SD.lobby.hide();
    newGame(mapId, r.today, { deck: r.deck, levels: r.levels, stage, guests: r.guests || [] });
    if (r.guests && r.guests.length) guestScreen(r.guests);
    return true;
  }
  function guestScreen(gs) {
    modal(`${ribbon('오늘의 까다로운 손님', '#ff9f43')}<div class="pen sub">한 명당 클리어 팁 +20%</div>
      ${gs.map(g => `<div class="guest"><span class="tag" style="background:#ff9f43">손님</span><div><div class="jua gn">${D.GUESTS[g.id].name}</div><div class="gd">${D.GUESTS[g.id].desc(g, g && window.SD_ART)}</div></div></div>`).join('')}
      <div class="btn big" id="gOk">알겠어요</div>`, (m) => { m.querySelector('#gOk').onclick = () => closeModal(); });
  }
  function ruleScreen(choices) {
    modal(`${ribbon('주방 규칙 하나 고르기', '#5cc96b')}<div class="pen sub">W${G.wave} 정리 끝!</div>
      ${choices.map(k => { const r = D.RULES[k]; return `<div class="rule" data-k="${k}"><div class="ra">${ingImg(D.RULE_ART[k], 52)}</div><div><div class="jua rn">${r.name}</div><div class="good"><span>좋은 점</span>${r.good}</div><div class="bad"><span>대가</span>${r.bad}</div></div></div>`; }).join('')}`, (m) => {
      m.querySelectorAll('.rule').forEach(el => el.onclick = () => { G.pickRule(el.dataset.k); closeModal(); });
    });
  }
  function branchScreen(i) {
    const c = G.cells[i]; if (!c || !c.unit || c.unit.branch || c.unit.recipe) { G.branchQueue = G.branchQueue.filter(x => x !== i); return; }
    const k = c.unit.key, B = D.BRANCH[k];
    modal(`${ribbon('3성 분기 진화', '#ff9f43')}<div class="pair">${ingImg(k, 64)}</div><div class="jua h2">${ingName(k)} ★★★</div>
      ${['A', 'B'].map(b => `<div class="rule br" data-b="${b}"><div class="ra" style="background:${b === 'A' ? '#d6f5f1' : '#ffe9d6'}"><span class="jua" style="font-size:30px">${b}</span></div><div><div class="jua rn">${B[b].name}</div><div class="good">${B[b].desc}</div></div></div>`).join('')}`, (m) => {
      m.querySelectorAll('.br').forEach(el => el.onclick = () => { G.chooseBranch(i, el.dataset.b); closeModal(); });
    });
  }
  function recipeScreen(id) {
    const r = D.RECIPES[id];
    const src = r.tier === 1 ? `${ingImg(D.PAIRS[r.pair].a, 52)}<b>+</b>${ingImg(D.PAIRS[r.pair].b, 52)}` : r.with ? `<span class="chipr">${pairLabel(r.src)}</span><b>+</b>${ingImg(r.with, 52)}` : `<span class="chipr">${pairLabel(r.src)}</span><b>+</b><span class="chipr">${pairLabel(r.withPair)}</span>`;
    const br = r.tier === 1 ? `<div class="lbl center dim">${ingName(D.PAIRS[r.pair].key)} 분기 ${r.branch}로 만들면 이 비법이 나와요</div>` : '';
    modal(`${ribbon(r.tier === 3 ? '최상위 비법 발견!' : r.tier === 2 ? '상위 비법 발견!' : '새 살림 비법 발견!', r.tier > 1 ? '#e8653f' : '#ff6b5b')}
      <div class="pair">${src}</div>${br}
      <div class="jua h1">${r.name}</div>
      <div class="note pen">${r.tip}</div>
      <div class="lbl center">비법 노트에 적었어요 (${Object.keys(codex.recipes).length}/${Object.keys(D.RECIPES).length})</div>
      <div class="btn big" id="mOk">좋아요!</div>`, (m) => { m.querySelector('#mOk').onclick = closeModal; });
  }
  function pairLabel(p) { const P = D.PAIRS[p]; return [P.A, P.B].filter(id => codex.recipes[id]).map(id => D.RECIPES[id].name)[0] || (ingName(P.a) + '+' + ingName(P.b) + ' 비법'); }
  function bossScreen(boss) {
    const ds = D.DISHES[boss];
    const weak = (ds.weak || []).map(f => (A.FAMILY[f] || {}).name || ingName(f)).join(', ');
    const res = (ds.resist || []).map(f => (A.FAMILY[f] || {}).name || ingName(f)).join(', ');
    modal(`${ribbon(D.waveSpec(G.wave, G.map, G.stage).bossLabel + ' 등장', '#a77bf3')}
      <div class="pair">${A.boss(boss, 120)}</div><div class="jua h1">${dishName(boss)}</div>
      <div class="lbl center">${weak ? `약점 <b>${weak}</b>` : ''}${res ? ` · 저항 <b>${res}</b>` : ''}</div>
      ${traitsOf(boss).map(t => `<div class="lbl center dim">${t}</div>`).join('')}
      <div class="btn big" id="mOk">막아보자!</div>`, (m) => { m.querySelector('#mOk').onclick = closeModal; });
  }
  function settle(win) {
    const comboN = Object.values(G.stats.combos).reduce((s, v) => s + v, 0);
    return SD.meta.finishRun({ win, hearts: G.hearts, maxHearts: G.maxHearts, wave: G.wave, cleaned: G.stats.cleaned, combos: comboN, recipes: G.stats.recipes.length, newRecipes: G.stats.newRecipes });
  }
  function reviveScreen() {
    const half = Math.ceil(G.maxHearts / 2), adFree = SD.meta.p && SD.meta.p.adFree;
    modal(`${ribbon('만족도가 바닥났어요', '#ff6b5b')}<div class="pen sub">W${G.wave} · 판마다 한 번 이어할 수 있어요</div>
      <div class="lbl center" style="margin:6px 0 10px">만족도를 ${half}까지 채우고 레일 위 그릇을 치워요</div>
      <div class="btn big go" id="rvAd">${adFree ? '바로 이어하기' : '광고 보고 이어하기'}</div>
      <div class="btn" id="rvNo">그만하기</div>`, (m) => {
      const go = m.querySelector('#rvAd');
      go.onclick = () => {
        if (go.classList.contains('dis')) return; go.classList.add('dis'); go.textContent = '광고 보는 중…';
        SD.ads.show('revive').then((ok) => {
          closeModal();
          if (ok && G.revive()) { toast(SD.ads.isTest && !adFree ? '(테스트 광고) 다시 영업 시작!' : '다시 영업 시작!'); SD.sound && SD.sound.play('recipe'); }
          else endScreen(false);
        });
      };
      m.querySelector('#rvNo').onclick = () => { closeModal(); endScreen(false); };
    });
  }
  function endScreen(win) {
    mq.length = 0;
    const res = settle(win), L = SD.lobby;
    const combos = Object.entries(G.stats.combos).map(([k, v]) => `${D.COMBOS[k].name.replace('!', '')} ${v}`).join(' · ') || '없음';
    const stars = win ? `<div class="bigstars">${[1, 2, 3].map(i => L.starS(res.stars >= i, 44)).join('')}</div>` : '';
    const chest = res.rewards.filter(r => r.type === 'chest').map(L.chestHtml).join('');
    const stage = G.stage, mapId = G.mapId;
    const nextOk = win && stage < 5;
    modal(`${ribbon(win ? '영업 성공!' : '손님이 화났어요', win ? '#5cc96b' : '#ff6b5b')}
      <div class="jua h2">${G.map.name} ${stage}스테이지${res.firstClear ? ' · 첫 클리어' : ''}</div>${stars}
      <div class="stats"><div><b>${G.wave}</b>웨이브</div><div><b>${G.stats.cleaned}</b>닦은 그릇</div><div><b>${G.hearts}</b>남은 만족도</div></div>
      <div class="rwrow">${L.rewardChips(res.rewards)}<span class="rw">경험치 +${res.exp}</span>${res.lvUp ? '<span class="rw" style="background:#ffc93c">레벨 업!</span>' : ''}</div>
      ${chest}
      <div class="lbl">콤보: ${combos}</div>
      <div class="row2"><div class="btn" id="mLobby">로비로</div><div class="btn big" id="mNext" style="height:44px">${nextOk ? '다음 스테이지' : '다시 하기'}</div></div>`, (m) => {
      m.querySelector('#mLobby').onclick = () => { closeModal(); startScreen(); };
      m.querySelector('#mNext').onclick = () => { closeModal(); G = null; if (!startRun(mapId, nextOk ? stage + 1 : stage)) SD.lobby.show(); };
      m.querySelectorAll('[data-act="odds"]').forEach(b => b.onclick = () => { const t = b.closest('.chestbox').querySelector('.odds'); t.style.display = t.style.display === 'none' ? '' : 'none'; });
    });
  }
  function pauseScreen() {
    paused = true;
    modal(`${ribbon('잠깐 멈춤', '#8d7b6f')}
      <div class="btn big" id="pGo">계속하기</div>
      <div class="btn" id="pHome">영업 그만하기</div>
      ${sndToggles()}
      ${window.SD_PLATFORM === 'web' ? '' : `<div class="lbl center dim">개발용</div>
      <div class="row2"><div class="btn" id="pShine">+200 반짝</div><div class="btn" id="pSkip">웨이브 넘기기</div></div>`}`, (m) => {
      m.querySelector('#pGo').onclick = () => { paused = false; closeModal(); };
      bindSnd(m);
      m.querySelector('#pHome').onclick = () => { paused = false; closeModal(); settle(false); startScreen(); };
      if (m.querySelector('#pShine')) m.querySelector('#pShine').onclick = () => { G.shine += 200; hud(); };
      if (m.querySelector('#pSkip')) m.querySelector('#pSkip').onclick = () => { if (G.phase === 'wave') { G.spawn.list = []; G.dishes.forEach(d => d.dead = true); } else if (G.phase === 'break' || G.phase === 'ready') G.startWave(); paused = false; closeModal(); };
    });
  }

  function drainEvents() {
    if (SD.sound) SD.sound.events(G.events);
    for (const e of G.events) {
      if (e.type === 'toast') toast(e.text);
      else if (e.type === 'forbidden') toast('락스와 산성 세제는 절대 섞으면 안 돼요! 유독 가스가 나와요', true);
      else if (e.type === 'recipe') { if (e.first) recipeScreen(e.id); else toast(D.RECIPES[e.id].name + '!'); }
      else if (e.type === 'chooseRule') ruleScreen(e.choices);
      else if (e.type === 'branch') branchScreen(e.cell);
      else if (e.type === 'needBranch') { toast(`${ingName(e.key)}의 3성 분기를 먼저 골라야 교잡돼요`); branchScreen(e.cell); }
      else if (e.type === 'bossWarn') bossScreen(e.boss);
      else if (e.type === 'end') { if (!e.win && G.canRevive() && SD.ads && SD.ads.available()) reviveScreen(); else endScreen(e.win); }
      else if (e.type === 'comboFirst') toast('새 콤보: ' + D.COMBOS[e.combo].name);
      else if (e.type === 'waveEnd') toast(`W${e.wave} 정리! +${e.bonus}`);
      else if (e.type === 'waveStart' && e.sit && e.sit !== 'normal') toast(`${D.SITUATIONS[e.sit].name}: ${D.SITUATIONS[e.sit].desc}`);
      else if (e.type === 'jam') toast('기름이 튀었어요! 탭해서 닦기');
    }
    G.events.length = 0;
    store.set('sd.codex.v1', codex);
  }

  function newGame(mapId, recipeToday, extra = {}) {
    G = SD.createGame({ codex, recipeToday, mapId, ...extra });
    SD.sound && SD.sound.setBgm('run');
    ui.sel = null; ui.drag = null; seenTypes = new Set(['plate', 'cup', 'mug', 'pot', 'spore']);
    paused = false;
    hud();
  }

  /* ---------- input ---------- */
  function toLocal(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * 390, y: (e.clientY - r.top) / r.height * 844 }; }
  function cellAt(p) { if (!G) return null; const i = G.cells.findIndex(c => p.x >= c.x - 3 && p.x <= c.x + 59 && p.y >= c.y - 3 && p.y <= c.y + 59); return i < 0 ? null : i; }
  function overRecycle(e) { const el = document.elementFromPoint(e.clientX, e.clientY); return el && el.closest && el.closest('#bRecycle'); }
  cv.addEventListener('pointerdown', (e) => {
    if (!G || modalOpen) return;
    const p = toLocal(e), i = cellAt(p);
    ui.press = { i, x: p.x, y: p.y };
    if (i != null && G.cells[i].unit && G.cells[i].unit.jam <= 0) { ui.drag = { from: i, x: p.x, y: p.y, moved: false }; cv.setPointerCapture(e.pointerId); }
  });
  cv.addEventListener('pointermove', (e) => {
    if (!ui.drag) return;
    const p = toLocal(e); ui.drag.x = p.x; ui.drag.y = p.y;
    if (!ui.drag.moved && Math.hypot(p.x - ui.press.x, p.y - ui.press.y) > 8) {
      ui.drag.moved = true; ui.sel = ui.drag.from;
      const a = G.cells[ui.drag.from].unit;
      ui.dragTargets = new Set(G.cells.map((c, j) => [c, j]).filter(([c, j]) => j !== ui.drag.from && c.unit && ((c.unit.key === a.key && c.unit.star === a.star && a.star < 4) || G.canHybrid(a, c.unit))).map(([c, j]) => j));
    }
    ui.hover = ui.drag.moved ? cellAt(p) : null;
    $('#bRecycle').classList.toggle('drop', ui.drag.moved && !!overRecycle(e));
  });
  cv.addEventListener('pointerup', (e) => {
    if (!G || modalOpen) { ui.drag = null; return; }
    const p = toLocal(e), i = cellAt(p);
    if (ui.drag && ui.drag.moved) {
      if (overRecycle(e)) { G.recycle(ui.drag.from); ui.sel = null; }
      else if (i != null) { const r = G.move(ui.drag.from, i); if (r === 'move' || r === 'merge' || r === 'recipe') ui.sel = i; }
    } else if (ui.press) {
      const j = ui.press.i;
      if (j != null) {
        const c = G.cells[j];
        if (c.unit && c.unit.jam > 0) G.unjam(j);
        else if (c.locked) { if (!G.expand(j)) toast(c.ruleLocked ? '주방 정리 규칙으로 잠긴 칸이에요' : '반짝이 부족해요'); }
        else if (c.unit) { if (!c.unit.recipe && c.unit.star >= 3 && !c.unit.branch) branchScreen(j); else ui.sel = ui.sel === j ? null : j; }
        else ui.sel = null;
      } else {
        const W = G.map.devices.wok;
        if (W && Math.hypot(p.x - W.x, p.y - W.y) < 24) { if (!G.useWok()) toast('아직 화구가 식는 중이에요'); }
        ui.sel = null;
      }
    }
    ui.drag = null; ui.hover = null; ui.dragTargets = null; ui.press = null;
    $('#bRecycle').classList.remove('drop');
    hud();
  });
  cv.addEventListener('pointercancel', () => { ui.drag = null; ui.hover = null; ui.dragTargets = null; });

  const on = (id, fn) => $(id).addEventListener('click', () => { if (!G || modalOpen) return; fn(); hud(); });
  on('#bSummon', () => G.summon());
  on('#bLv', () => { if (!G.levelUp()) toast(G.lvCost() == null ? '소환 레벨 최대예요' : '반짝이 부족해요'); });
  on('#bMerge', () => { const n = G.bulkMerge(); const b = G.lastBulk || {}; if (n) toast(b.recipes ? (b.merged ? `${b.merged}번 합성 · 비법 ${b.recipes}개` : `비법 ${b.recipes}개 만들었어요`) : `${n}번 합성!`); });
  on('#bRecycle', () => { if (ui.sel != null) { G.recycle(ui.sel); ui.sel = null; } });
  on('#dTap', () => { if (!G.useTap()) toast(G.phase !== 'wave' ? '웨이브 중에만 써요' : '아직 쿨타임이에요'); });
  on('#dPlug', () => { if (!G.usePlug()) toast(G.devices.plug.uses <= 0 ? '다 썼어요' : G.phase !== 'wave' ? '웨이브 중에만 써요' : '이미 막는 중이에요'); });
  on('#dWok', () => { if (!G.useWok()) toast(G.phase !== 'wave' ? '웨이브 중에만 써요' : '아직 화구가 식는 중이에요'); });
  on('#bWave', () => G.startWave());
  on('#chalk', () => { if (G.map.situations) { const k = G.sit || G.sitNext; toast(`${D.SITUATIONS[k].name}: ${D.SITUATIONS[k].desc}`); } });
  $('#speed').addEventListener('click', () => { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; store.set('sd.speed', speed); hud(); });
  $('#pause').addEventListener('click', () => { if (G && !modalOpen) pauseScreen(); });

  /* ---------- loop ---------- */
  let last = performance.now(), acc = 0, hudT = 0, lastFrame = 0;
  function frame(now) {
    lastFrame = now;
    const real = Math.min(0.1, (now - last) / 1000); last = now;
    if (G) {
      if (!paused && !modalOpen) {
        acc += real * speed; let n = 0;
        while (acc >= 1 / 60 && n < 12) { G.update(1 / 60); acc -= 1 / 60; n++; if (G.events.some(e => e.type === 'branch' || e.type === 'chooseRule' || e.type === 'bossWarn' || e.type === 'end' || (e.type === 'recipe' && e.first))) break; }
        if (n >= 12) acc = 0;
      }
      if (SD.sound) SD.sound.tick(G);
      ui.hintT = (ui.hintT || 0) - real; if (ui.hintT <= 0) { ui.hintT = 0.15; ui.hints = G.hints(); ui.selPartners = ui.sel != null && !ui.drag ? G.partnersOf(ui.sel) : null; }
      if (G.events.length) drainEvents();
      SD.render(ctx, G, ui);
      hudT -= real; if (hudT <= 0) { hud(); hudT = 0.1; }
    }
  }
  function raf(now) { frame(now); requestAnimationFrame(raf); }
  requestAnimationFrame(raf);
  setInterval(() => { const now = performance.now(); if (now - lastFrame > 60) frame(now); }, 16);

  SD.meta.load();
  fit();
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => SD.preload(D.MAP_ORDER)).then(() => { startScreen(); });
  SD.ui = { modal, closeModal, toast, startRun, codex, get G() { return G; } };
  SD.debug = { get G() { return G; }, ui, setSpeed: (s) => { speed = s; }, newGame };
})(window);

</script>
<script>
/* 싱크대 수비대 - 로비 (영업 · 재료 · 비법 노트 · 상점 · 주방 + 출석 · 미션 · 우편) */
(function (g) {
  const SD = g.SD, D = SD.DATA, A = g.SD_ART, M = SD.meta, INK = A.INK;
  const S = `stroke="${INK}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"`;

  const ing = (k, s) => `<span class="ii" style="width:${s}px;height:${s}px">${A.ing(k, s)}</span>`;
  const coffee = (s = 22) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}"><path d="M5 9h12v6a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5z" fill="#fff" ${S}/><path d="M5 11h12" stroke="#8a5338" stroke-width="3"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17" fill="none" ${S}/><path d="M9 3c-1 1.5 1 2 0 3.5M13 3c-1 1.5 1 2 0 3.5" stroke="#9aa5ad" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>`;
  const tip = (s = 22) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}"><circle cx="12" cy="12" r="9.5" fill="#ffc93c" ${S}/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#e0a800" stroke-width="1.6"/><path d="M9.5 10.2c0-1.2 1.1-1.9 2.5-1.9s2.4.7 2.4 1.7c0 2.4-4.9 1.4-4.9 3.9 0 1.1 1.1 1.8 2.5 1.8s2.5-.7 2.5-1.9M12 7v1.3M12 15.7V17" stroke="${INK}" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>`;
  const shard = (k, s = 22) => `<span class="ii" style="position:relative;width:${s}px;height:${s}px">${A.ing(k, s)}<svg viewBox="0 0 24 24" width="${Math.round(s * .55)}" height="${Math.round(s * .55)}" style="position:absolute;right:-3px;bottom:-3px"><path d="M12 2l7 6-3 13H8L5 8z" fill="#c8f1fb" ${S} stroke-width="1.8"/></svg></span>`;
  const box = (tier, s = 64) => { const [c1, c2] = M.CHESTS[tier].color; return `<svg viewBox="0 0 48 48" width="${s}" height="${s}"><path d="M6 20h36v20a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3z" fill="${c1}" ${S}/><path d="M4 13h40v8H4z" fill="${c2}" ${S}/><path d="M20 13h8v30h-8z" fill="#ff6b5b" ${S}/><path d="M24 13c-4-6-11-6-10-1 1 3 6 2 10 1zM24 13c4-6 11-6 10-1-1 3-6 2-10 1z" fill="#ff6b5b" ${S}/><path d="M9 26v10" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".7"/></svg>`; };
  const starS = (on, s = 14) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" fill="${on ? '#ffc93c' : '#e9e1d4'}" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/></svg>`;
  const lock = (s = 12) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}"><rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.6"/></svg>`;
  const TI = {
    play: `<svg viewBox="0 0 24 24" width="26" height="26"><ellipse cx="12" cy="19" rx="9" ry="2.4" fill="#8d7b6f" ${S}/><path d="M4.5 18a7.5 7.5 0 0 1 15 0z" fill="#ffd84d" ${S}/><rect x="10.5" y="7" width="3" height="3.5" rx="1" fill="#ffd84d" ${S}/></svg>`,
    ing: A.ing('dish', 26),
    note: `<svg viewBox="0 0 24 24" width="26" height="26"><rect x="5" y="3" width="15" height="18" rx="2" fill="#fff6b8" ${S}/><path d="M5 3h3v18H5z" fill="#ff9f43" ${S}/><path d="M11 8h6M11 12h6M11 16h4" ${S}/></svg>`,
    shop: `<svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 10h16v10H4z" fill="#fff" ${S}/><path d="M3 5h18l1 5H2z" fill="#ff6b5b" ${S}/><path d="M7 5l-1 5M12 5v5M17 5l1 5" ${S}/><rect x="9.5" y="14" width="5" height="6" fill="#ffc93c" ${S}/></svg>`,
    kitchen: `<svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 10h16v7a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z" fill="#9aa5ad" ${S}/><path d="M2 10h20M2 12H4M20 12h2" ${S}/><path d="M9 6c-1-1.5 1-2 0-3.5M14 6c-1-1.5 1-2 0-3.5" stroke="#9aa5ad" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>`
  };
  const fam = (k) => A.FAMILY[A.ING[k].family];
  const ROLE = { aoe: '범위', single: '단일', support: '지원', slow: '둔화' };
  const num = (n) => Number(n).toLocaleString('ko-KR');
  const mmss = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}` : `${m}:${String(x).padStart(2, '0')}`; };
  const toast = (t, w) => SD.ui.toast(t, w);
  const codex = () => SD.ui.codex;

  /* ---------- 보상 표시 ---------- */

    const lb = (r) => r.label ? `<small class="rwl">${r.label}</small>` : '';
    return rw.filter(r => r.type !== 'chest').map(r => lb(r) + (r.type === 'coffee' ? `<span class="rw">${coffee(18)}+${r.n}</span>` : r.type === 'tips' ? `<span class="rw">${tip(18)}+${num(r.n)}</span>` : r.type === 'maxPlus' ? `<span class="rw">${coffee(18)}최대치 +${r.n}</span>` : r.type === 'adFree' ? `<span class="rw">광고 제거</span>` : r.type === 'deckShards' ? r.keys.map(k => `<span class="rw">${shard(k, 18)}x${r.n}</span>`).join('') : '')).join('');
  }
  function chestHtml(c) {
    return `<div class="chestbox"><div style="display:flex;align-items:center;gap:8px">${box(c.tier, 44)}<span class="jua" style="font-size:17px">${M.CHESTS[c.tier].name}</span><span class="link" data-act="odds" data-tier="${c.tier}">확률 보기</span></div>
      <div class="chestitems">${c.items.map(it => it.type === 'shard' ? `<div class="ci ${it.fresh ? 'new' : ''}">${shard(it.k, 34)}<span>${A.ING[it.k].name}</span><b>x${it.n}</b>${it.fresh ? '<i>새 재료</i>' : ''}</div>` : `<div class="ci">${tip(34)}<span>팁</span><b>+${num(it.n)}</b></div>`).join('')}</div><table class="odds" style="display:none;margin-top:6px">${M.chestOdds(c.tier).map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table></div>`;
  }
  function showRewards(title, rw, color = '#5cc96b') {

    SD.ui.modal(`<div class="ribbon" style="background:${color}">${title}</div><div class="rwrow">${rewardChips(rw)}</div>${chests.map(chestHtml).join('')}<div class="btn big" data-close>좋아요!</div>`, bindModal);

  function bindModal(m) {

    m.querySelectorAll('[data-act]').forEach(b => b.onclick = (e) => { e.stopPropagation(); if (b.dataset.act === 'odds') { const t = b.closest('.chestbox') && b.closest('.chestbox').querySelector('.odds'); if (t) { t.style.display = t.style.display === 'none' ? '' : 'none'; return; } } act(b.dataset.act, b.dataset); });

    SD.ui.modal(`<div class="ribbon" style="background:#8d7b6f">${M.CHESTS[tier].name} 확률</div><div style="display:flex;justify-content:center">${box(tier, 72)}</div>
      <table class="odds">${M.chestOdds(tier).map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table>
      <div class="lbl center dim">조각 종류는 해당 묶음 안에서 같은 확률로 골라요</div><div class="btn big" data-close>닫기</div>`, bindModal);

      <div class="chip" style="flex:1" data-act="goShop">${coffee(22)}<span id="lCoffee">${P.coffee}<small style="font-size:12px;opacity:.5">/${M.coffeeMax()}</small></span><small id="lCoffeeT" style="margin-left:auto">${next ? '+1 · ' + mmss(next) : '가득'}</small><span class="plus">+</span></div>
      <div class="chip" data-act="goShop">${tip(22)}<span id="lTips">${num(P.tips)}</span><span class="plus">+</span></div></div>`;
  }
  function tabsHtml() {
    const L = [['play', '영업'], ['ing', '재료'], ['note', '비법 노트'], ['shop', '상점'], ['kitchen', '주방']];
    const dot = { shop: !M.p.day.freeChest, kitchen: M.kitchenPending().hours >= 2, ing: M.allIngs().some(k => (M.isUnlocked(k) ? (M.lvCost(k) && (M.p.shards[k] || 0) >= M.lvCost(k).shards && M.p.tips >= M.lvCost(k).tips) : (M.p.shards[k] || 0) >= M.ECON.UNLOCK_SHARDS)) };
    return `<div class="ltabs">${L.map(([k, n]) => `<div class="ltab ${k === tab ? 'on' : ''}" data-act="tab" data-t="${k}">${TI[k]}<span>${n}</span>${dot[k] && k !== tab ? '<span class="dot"></span>' : ''}</div>`).join('')}</div>`;
